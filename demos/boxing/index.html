<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boxing Demo</title>
<style>
  @font-face { font-family: nasa; src: url("../../fonts/nasalization-rg.ttf"); font-display: swap; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#05070a; }
  canvas { display:block; touch-action:none; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; opacity:0; transition:opacity .8s ease; }
  #hud.on { opacity:1; }
  .bar { position:absolute; top:22px; width:34%; }
  .bar.p { left:22px; } .bar.e { right:22px; }
  .bar .who {
    font:12px/1 nasa, ui-monospace, monospace; letter-spacing:.16em; text-transform:uppercase;
    color:#c7d4dd; margin-bottom:6px; text-shadow:0 2px 6px #000;
  }
  .bar.e .who { text-align:right; }
  .bar .track {
    height:13px; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.28); border-radius:3px;
    overflow:hidden;
  }
  .bar .fill { height:100%; width:100%; transition:width .18s ease; }
  .bar.p .fill { background:linear-gradient(90deg,#3ee07d,#8ff0b4); }
  .bar.e .fill { background:linear-gradient(90deg,#e0563e,#f0a23e); }
  .bar.e .track { direction:rtl; }

  #keys {
    position:absolute; left:22px; bottom:20px;
    font:11px/1.75 ui-monospace,"Courier New",monospace; letter-spacing:.08em; color:#8fa0ad;
    text-shadow:0 1px 4px #000;
  }
  #keys b { color:#e0c07a; font-weight:600; }
  #centre {
    position:absolute; left:0; right:0; top:42%; text-align:center;
    font:26px/1.3 nasa, sans-serif; letter-spacing:.14em; color:#fff;
    text-shadow:0 3px 18px #000; opacity:0; transition:opacity .5s ease;
  }
  #centre.on { opacity:1; }
  #centre small { display:block; font:13px ui-monospace,monospace; letter-spacing:.1em; opacity:.75; margin-top:10px; }
  #boot {
    position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    background:#05070a; color:#b9c8d2; font:13px nasa, "Courier New", monospace; letter-spacing:4px;
    transition:opacity .6s ease;
  }
  #boot.gone { opacity:0; pointer-events:none; }
  #skip {
    position:absolute; right:22px; bottom:20px; pointer-events:auto; cursor:pointer;
    font:11px ui-monospace,monospace; letter-spacing:.14em; color:#7f8d99;
    border:1px solid rgba(255,255,255,.18); border-radius:4px; padding:6px 11px;
    background:rgba(0,0,0,.35);
  }
  #skip:hover { color:#e0c07a; border-color:rgba(224,192,122,.5); }
  #opponent-picker {
    position:fixed; top:20px; right:22px; z-index:45; color:#8fa0ad;
    font:11px ui-monospace,monospace; letter-spacing:.08em; text-shadow:0 1px 4px #000;
  }
  #opponent-picker button { margin-left:7px; padding:6px 8px; color:#dce6ed; background:#101820;
    border:1px solid rgba(255,255,255,.25); border-radius:4px; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<div id="boot">LOADING…</div>
<div id="opponent-picker"><button id="opponent-switch" type="button">SWITCH FOE</button></div>
<div id="hud">
  <div class="bar p"><div class="who">Stephen</div><div class="track"><div class="fill" id="php"></div></div></div>
  <div class="bar e"><div class="who" id="enemy-name">Warrior Bug</div><div class="track"><div class="fill" id="ehp"></div></div></div>
  <div id="keys"></div>
  <div id="centre"></div>
  <div id="skip">SKIP INTRO</div>
</div>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
} }
</script>

<script type="module">
// BOXING DEMO — Stephen versus a selectable opponent.
//
// three 0.158.0 ON PURPOSE: r159 rewrote the skinning shader to use textureSize()/texelFetch(),
// which are WebGL 2 only, so every skinned mesh goes invisible on a WebGL 1 machine. Both fighters
// here are skinned. ?gl1 forces a WebGL 1 context so that stays testable.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const A = n => 'preset:biped:' + n;              // Stephen's clips carry this prefix
const C = n => 'preset:biped:' + n + '.001';      // Chimpanzee clips have a Blender suffix
const opponent = new URLSearchParams(location.search).get('opponent') === 'insect' ? 'insect' : 'chimp';
const ARENA = 11;
const INTRO_START_Z = -13, INTRO_END_Z = -4, INTRO_DURATION = 7;
const PLAYER = {
  scale: 1.8, walk: 2.4, run: 5.6, back: 1.8, side: 3.8,
  hp: 100, reach: 3.6, damage: [12, 20],
};
const BUG = {
  scale: 2.2, walk: 1.7, hp: 420, lungeSpeed: 9.5, lungeDamage: 16, reach: 3.2,
};
// The chimp has biped clips, but not the insect-specific names.
const CHIMP_ANIM = {
  idle: C('idle'), walk: C('walk'), rear: C('dance_05'), strike: C('press-up'), death: C('defeat_03'),
};
const INSECT_ANIM = {idle:'Idle', walk:'Walk', rear:'RearUp', strike:'Strike', death:'Death'};
const ENEMY_ANIM = opponent === 'chimp' ? CHIMP_ANIM : INSECT_ANIM;
const ENEMY_FILE = opponent === 'chimp' ? 'chimpanzee.glb' : 'insect_animated.glb';
document.getElementById('opponent-switch').textContent = opponent === 'chimp' ? 'SWITCH TO BUG' : 'SWITCH TO CHIMP';
document.getElementById('enemy-name').textContent = opponent === 'chimp' ? 'Chimpanzee' : 'Warrior Bug';
document.getElementById('opponent-switch').addEventListener('click', () => {
  const query = opponent === 'chimp' ? '?opponent=insect' : '';
  location.search = query;
});
const ATTACKS = ['box_01','box_03','front_kick_01','front_kick_02'];
// The preset clips are performed at a leisurely pace; a fight wants them snappy. Rate scales the
// playback AND the state timer together, otherwise the state outlasts the animation and he stands
// frozen at the end of a swing.
const ATTACK_RATE = 1.7, HURT_RATE = 1.5;

// ── renderer ──────────────────────────────────────────────────────────────────
const FORCE_GL1 = new URLSearchParams(location.search).has('gl1');
let renderer;
if (FORCE_GL1) {
  const cv = document.createElement('canvas');
  renderer = new THREE.WebGLRenderer({ canvas: cv, context: cv.getContext('webgl', { antialias:true }) });
} else {
  renderer = new THREE.WebGLRenderer({ antialias:true });
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070a);
scene.fog = new THREE.Fog(0x070a0f, 22, 50);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 300);

scene.add(new THREE.HemisphereLight(0xa8bccd, 0x18202a, 1.15));
const key = new THREE.DirectionalLight(0xfff2de, 3.4);
key.position.set(8, 14, 6); key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
const S = 16;
key.shadow.camera.left=-S; key.shadow.camera.right=S;
key.shadow.camera.top=S; key.shadow.camera.bottom=-S; key.shadow.camera.far=48;
key.shadow.bias=-0.0016;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6f9ac6, 1.5);
rim.position.set(-8,5,-7); scene.add(rim);

// platform
const plat = new THREE.Mesh(
  new THREE.CylinderGeometry(ARENA, ARENA*1.04, 0.7, 72),
  new THREE.MeshStandardMaterial({ color:0x2b333d, roughness:0.95 })
);
plat.position.y = -0.35; plat.receiveShadow = true; scene.add(plat);
const lip = new THREE.Mesh(
  new THREE.TorusGeometry(ARENA, 0.09, 10, 80).rotateX(Math.PI/2),
  new THREE.MeshStandardMaterial({ color:0x3b4a57, roughness:0.7, metalness:0.3 })
);
scene.add(lip);
const grid = new THREE.GridHelper(ARENA*2, 22, 0x2b3a46, 0x1d2830);
grid.position.y = 0.004; scene.add(grid);

// ── animation helper ──────────────────────────────────────────────────────────
// Add a distal mitten joint in the bind pose. Existing animation continues to
// control the knuckles; this extra joint curls the fingertips into the palm.
function closeStephenFists(model) {
  model.updateMatrixWorld(true);
  const fingers = ['L_Fingers', 'R_Fingers'].map(name => model.getObjectByName(name));
  for (const finger of fingers) {
    if (!finger) continue;
    const meshes = [];
    model.traverse(mesh => {
      if (mesh.isSkinnedMesh && mesh.skeleton.bones.includes(finger)) meshes.push(mesh);
    });
    const inverse = finger.matrixWorld.clone().invert();
    const point = new THREE.Vector3();
    let length = 0;
    for (const mesh of meshes) {
      const {position, skinIndex, skinWeight} = mesh.geometry.attributes;
      const index = mesh.skeleton.bones.indexOf(finger);
      for (let v = 0; v < position.count; v++) {
        let weight = 0;
        for (let k = 0; k < 4; k++) if (skinIndex.getComponent(v, k) === index) weight += skinWeight.getComponent(v, k);
        if (weight < 0.25) continue;
        point.fromBufferAttribute(position, v).applyMatrix4(mesh.matrixWorld).applyMatrix4(inverse);
        length = Math.max(length, point.y);
      }
    }
    if (length <= 0) continue;
    const tip = new THREE.Bone();
    tip.name = finger.name + '_Curl';
    tip.position.y = length * 0.5;
    finger.add(tip);
    model.updateMatrixWorld(true);
    const tipInverse = tip.matrixWorld.clone().invert();
    for (const mesh of meshes) {
      mesh.geometry = mesh.geometry.clone();
      const {position, skinIndex, skinWeight} = mesh.geometry.attributes;
      const skeleton = mesh.skeleton, index = skeleton.bones.indexOf(finger);
      const tipIndex = skeleton.bones.length;
      for (let v = 0; v < position.count; v++) {
        point.fromBufferAttribute(position, v).applyMatrix4(mesh.matrixWorld).applyMatrix4(inverse);
        const blend = THREE.MathUtils.smoothstep(point.y, length * 0.25, length * 0.62);
        const influences = [];
        let tipWeight = 0;
        for (let k = 0; k < 4; k++) {
          const bone = skinIndex.getComponent(v, k), weight = skinWeight.getComponent(v, k);
          const split = bone === index ? weight * blend : 0;
          tipWeight += split;
          influences.push({bone, weight:weight - split});
        }
        influences.push({bone:tipIndex, weight:tipWeight});
        influences.sort((a, b) => b.weight - a.weight);
        const total = influences.slice(0, 4).reduce((sum, item) => sum + item.weight, 0);
        if (!total) continue;
        for (let k = 0; k < 4; k++) {
          skinIndex.setComponent(v, k, influences[k].bone);
          skinWeight.setComponent(v, k, influences[k].weight / total);
        }
      }
      mesh.skeleton = new THREE.Skeleton([...skeleton.bones, tip], [...skeleton.boneInverses, tipInverse]);
      skinIndex.needsUpdate = skinWeight.needsUpdate = true;
    }
    tip.rotation.x = THREE.MathUtils.degToRad(-120);
  }
}

// STRIP ROOT MOTION. Tripo's clips travel: Stephen's walk moves the Hip 1.53 units over one
// cycle and his run 3.53, monotonically — and when the clip loops the Hip snaps back to the start,
// which is the teleport. The chimp's walk does the same (1.12). Attacks are fine; box_01 and
// box_03 return to where they began.
//
// The game decides where a character is, so a clip should only pose the bones. Hip translation is
// in the rig's own Z-up space — index 0 sideways, 1 forward/back, 2 height — so pin 0 and 1 to
// their first-frame value and leave 2 alone, which keeps bob, crouch, jump height and the fall in
// defeat_03.
function stripTravel(clip) {
  for (const tr of clip.tracks) {
    if (!/\.position$/.test(tr.name)) continue;
    if (!/(^|\.)(Hip|Root)\.position$/.test(tr.name)) continue;
    const v = tr.values;
    if (v.length < 6) continue;
    const x0 = v[0], y0 = v[1];
    for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i+1] = y0; }
  }
  return clip;
}

class Rig {
  constructor(gltf, scale, yaw) {
    this.root = new THREE.Group(); this.root.scale.setScalar(scale); scene.add(this.root);
    this.model = gltf.scene;
    this.model.rotation.y = yaw;
    this.model.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true; o.receiveShadow = true;
      o.frustumCulled = false;                       // skinned bounds go stale mid-clip
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of ms) if (m && m.map) m.map.colorSpace = THREE.SRGBColorSpace;
    });
    this.root.add(this.model);
    this.mixer = new THREE.AnimationMixer(this.model);
    this.clips = {};
    for (const c of gltf.animations) {
      const corrected = c.name === C('press-up');
      const entrance = c.name === A('swagger');
      const clip = c.clone();          // always clone: stripTravel edits track values in place
      if (entrance) clip.tracks = clip.tracks.filter(track => track.name !== 'Root.position');
      if (corrected) {
        // The push-up clip is authored on the floor, so pitch it upright.
        const root = clip.tracks.find(track => track.name === 'Root.quaternion');
        if (root) {
          const axis = c.name === C('press-up') ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
          const angle = -Math.PI/2;
          const turn = new THREE.Quaternion().setFromAxisAngle(axis, angle);
          const q = new THREE.Quaternion();
          for (let i = 0; i < root.times.length; i++) {
            q.fromArray(root.values, i * 4).premultiply(turn).toArray(root.values, i * 4);
          }
        }
      }
      this.clips[clip.name] = this.mixer.clipAction(stripTravel(clip));
    }
    this.cur = null; this.curName = null;
  }
  has(n){ return !!this.clips[n]; }
  play(n, { fade=0.22, rate=1, once=false, force=false } = {}) {
    const a = this.clips[n];
    if (!a) return null;
    a.setEffectiveTimeScale(rate);
    if (this.cur === a && !force) return a;
    a.reset();
    // A REVERSED CLIP MUST START AT ITS END. reset() puts the playhead at 0, so with a negative
    // rate the very first update steps to -0.04 and wraps round to the end — meaning one frame
    // posed at the START of the walk (mid-stride, weight forward) before it snaps back. That one
    // frame is what reads as lurching forward before he backs up.
    if (rate < 0) a.time = a.getClip().duration;
    a.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, once ? 1 : Infinity);
    a.clampWhenFinished = once;
    a.setEffectiveWeight(1); a.play();
    if (this.cur) this.cur.crossFadeTo(a, fade, false);
    this.cur = a; this.curName = n;
    return a;
  }
  get dur(){ return this.cur ? this.cur.getClip().duration : 0; }
  freeze(){ this.mixer.stopAllAction(); this.cur = null; this.curName = null; }
}

// ── load ──────────────────────────────────────────────────────────────────────
const loader = new GLTFLoader();
const load = f => new Promise((res, rej) => loader.load(f, res, undefined, rej));
let hero, bug, clock;

Promise.all([load('../../models/stephen.glb'), load('../../models/' + ENEMY_FILE)])
.then(([s, i]) => {
  closeStephenFists(s.scene);
  hero = new Rig(s, PLAYER.scale, 0);            // faces +Z after the glTF axis swap
  bug  = new Rig(i, BUG.scale, opponent === 'chimp' ? 0 : Math.PI/2);
  hero.root.position.set(0, 0, INTRO_START_Z);   // off-platform, walks on during the intro
  hero.root.rotation.y = 0;
  bug.root.position.set(0, 0, 3.2);
  B.home = bug.root.position.clone();
  bug.root.rotation.y = Math.PI;
  hero.play(A('swagger'));
  bug.play(ENEMY_ANIM.idle);
  document.getElementById('boot').classList.add('gone');
  setTimeout(()=>document.getElementById('boot').remove(), 700);
  clock = new THREE.Clock(true);
  renderer.setAnimationLoop(tick);
}).catch(e => { document.getElementById('boot').textContent = 'LOAD FAILED — ' + e.message; });

// ── state ─────────────────────────────────────────────────────────────────────
const hud = document.getElementById('hud');
const centre = document.getElementById('centre');
const php = document.getElementById('php'), ehp = document.getElementById('ehp');
document.getElementById('keys').innerHTML =
  '<b>W/S</b> dodge depth · <b>D</b> backstep · <b>1–4</b> attacks · <b>TAP/CLICK</b> random attack';

const P = { hp: PLAYER.hp, state:'intro', t:0, atk:null, dead:false, invuln:0, home:null, dodgeKey:null, dodgeUntil:0, dodgeAnimT:0 };
const B = { hp: BUG.hp, state:'idle', t:2.2, dead:false, hitFlash:0, lunged:false, home:null };
let phase = 'cine', cineT = 0, overT = 0;

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  const attack = ['Digit1','Digit2','Digit3','Digit4','Digit5'].indexOf(e.code);
  if (attack >= 0) { e.preventDefault(); tryAttack(attack); }
});
addEventListener('keyup', e => keys[e.code] = false);
let camYaw = 0, cameraDistance = 7, dragging = false, lastX = 0;
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('wheel', e => {
  if (phase !== 'fight') return;
  e.preventDefault();
  cameraDistance = THREE.MathUtils.clamp(cameraDistance + e.deltaY * 0.006, 4.2, 10);
}, {passive:false});
addEventListener('mousedown', e => {
  if (e.button === 0 && !e.target.closest('#opponent-picker, #skip')) tryAttack((Math.random() * ATTACKS.length) | 0);
  if (e.button === 2) { dragging = true; lastX = e.clientX; }
});
addEventListener('mouseup',   e => { if (e.button === 2) dragging = false; });
addEventListener('mouseleave', () => dragging = false);
addEventListener('mousemove', e => {
  if (!dragging) return;
  camYaw -= (e.clientX - lastX) * 0.006;     // drag right, scene spins right
  lastX = e.clientX;
});
document.getElementById('skip').onclick = () => endCine();
let touchStart = null;
addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  e.preventDefault();
  const touch = e.touches[0];
  touchStart = {x:touch.clientX, y:touch.clientY};
}, {passive:false});
addEventListener('touchend', e => {
  if (!touchStart) return;
  e.preventDefault();
  const touch = e.changedTouches[0];
  const dx = touch.clientX - touchStart.x, dy = touch.clientY - touchStart.y;
  touchStart = null;
  if (e.target.closest('#opponent-picker, #skip')) return;
  if (Math.hypot(dx,dy) < 28) {
    tryAttack((Math.random() * ATTACKS.length) | 0);
    return;
  }
  const key = Math.abs(dy) > Math.abs(dx) ? (dy < 0 ? 'KeyW' : 'KeyS') : 'KeyD';
  P.dodgeKey = key;
  P.dodgeUntil = performance.now() + 360;
}, {passive:false});

function say(t, sub) {
  centre.innerHTML = t + (sub ? `<small>${sub}</small>` : '');
  centre.classList.add('on');
}
function hide(){ centre.classList.remove('on'); }

function tryAttack(index) {
  if (phase !== 'fight' || P.dead || P.state === 'attack' || P.state === 'hurt') return;
  const n = ATTACKS[index];
  if (!n) return;
  P.kickYaw = n.startsWith('front_kick') ? -Math.PI/2 : 0;
  if (P.kickYaw) hero.model.rotation.y += P.kickYaw;
  P.state = 'attack'; P.atk = n;
  const a = hero.play(A(n), { once:true, fade:0.07, rate:ATTACK_RATE, force:true });
  P.t = (a ? a.getClip().duration : 0.8) / ATTACK_RATE;
  P.hitAt = P.t * 0.45;                            // land the blow partway through the swing
  P.didHit = false;
}

function damageBug(d) {
  if (B.dead) return;
  B.hp = Math.max(0, B.hp - d);
  B.hitFlash = 0.16;
  bug.model.traverse(o => { if (o.isMesh && o.material && o.material.emissive) {
    o.material.emissive.setHex(0x883322); o.material.emissiveIntensity = 1;
    setTimeout(()=>o.material.emissive.setHex(0x000000), 130); } });
  ehp.style.width = (100*B.hp/BUG.hp) + '%';
  if (B.hp <= 0) {
    B.dead = true; B.state = 'dead';
    bug.play(ENEMY_ANIM.death, { once:true, fade:0.15 });
    setTimeout(()=>{ if (!P.dead) { say('BUG DOWN', 'you win'); } }, 900);
  }
}
function damageHero(d) {
  if (P.dead || P.invuln > 0) return;
  if (P.kickYaw) { hero.model.rotation.y -= P.kickYaw; P.kickYaw = 0; }
  P.hp = Math.max(0, P.hp - d);
  P.invuln = 0.7;
  php.style.width = (100*P.hp/PLAYER.hp) + '%';
  if (P.hp <= 0) {
    P.dead = true; P.state = 'dead';
    hero.play(A('defeat_03'), { once:true, fade:0.15 });
    say('DEFEATED', 'reload to try again');
  } else {
    P.state = 'hurt';
    const n = Math.random() < 0.5 ? 'hit_to_body_01' : 'hit_to_side';
    const a = hero.play(A(n), { once:true, fade:0.08, rate:HURT_RATE, force:true });
    P.t = (a ? a.getClip().duration * 0.8 : 0.5) / HURT_RATE;
  }
}

// ── the intro ─────────────────────────────────────────────────────────────────
function cine(dt) {
  cineT += dt; window.__cineT = cineT;
  const t = cineT;
  // He walks on from the very start and the camera keeps him in frame throughout — an opening
  // that orbits the bug alone reads as spinning around an empty patch of floor.
  const walkK = Math.min(1, t/INTRO_DURATION), we = walkK*walkK*(3-2*walkK);
  if (t < INTRO_DURATION) hero.root.position.z = THREE.MathUtils.lerp(INTRO_START_Z, INTRO_END_Z, we);

  const between = tmp.copy(bug.root.position).add(hero.root.position).multiplyScalar(0.5);
  const line = new THREE.Vector3().subVectors(hero.root.position, bug.root.position);
  line.y = 0; line.normalize();
  const side = new THREE.Vector3(-line.z, 0, line.x);
  const behind = bug.root.position.clone().addScaledVector(line, -8).setY(2.9);
  const sideView = between.clone().addScaledVector(side, cameraDistance).setY(2.8);
  if (t < 3.4) {
    // Approach from behind the chimp, with the camera looking down the line
    // between the fighters as Stephen walks into the arena.
    camera.position.copy(behind);
    camera.lookAt(between.x, 1.2, between.z);
    if (t < 0.1) say('THE ARENA', '');
    if (t > 2.8) hide();
  } else if (t < INTRO_DURATION) {
    // Move to a side-on position and aim directly at the space between them.
    const k = Math.min(1,(t-3.4)/4.2), e = k*k*(3-2*k);
    camera.position.lerpVectors(behind, sideView, e);
    camera.lookAt(between.x, 1.2, between.z);
  } else {
    endCine();
  }
}
function endCine() {
  if (phase !== 'cine') return;
  phase = 'fight';
  hide(); hud.classList.add('on');
  // Keep the position reached by the intro walk. Resetting this to a separate
  // fight start position made Stephen visibly teleport backward at the handoff.
  hero.root.rotation.y = 0;
  hero.play(A('idle'), { fade:0.2 });
  P.home = hero.root.position.clone();
  P.state = 'idle';
  say('FIGHT', '');
  setTimeout(hide, 1100);
}

// ── the player ────────────────────────────────────────────────────────────────
const fwd = new THREE.Vector3(), tmp = new THREE.Vector3(), dodgeAxis = new THREE.Vector3(), dodgeTarget = new THREE.Vector3();
function player(dt) {
  if (P.dead) return;
  if (P.invuln > 0) P.invuln -= dt;

  // This is a one-dimensional fighter: the opponents stay squared up instead
  // of turning away while moving around the arena.
  if (!B.dead) {
    tmp.copy(bug.root.position).sub(hero.root.position); tmp.y = 0;
    const want = Math.atan2(tmp.x, tmp.z);
    let dY = want - hero.root.rotation.y;
    while (dY > Math.PI) dY -= Math.PI * 2;
    while (dY < -Math.PI) dY += Math.PI * 2;
    hero.root.rotation.y += Math.sign(dY) * Math.min(Math.abs(dY), 5.0 * dt);
  }

  if (P.state === 'attack' || P.state === 'hurt') {
    P.t -= dt;
    if (P.state === 'attack' && !P.didHit && P.t <= P.hitAt) {
      P.didHit = true;
      // does the swing actually reach the bug, and is it in front?
      tmp.copy(bug.root.position).sub(hero.root.position); tmp.y = 0;
      const d = tmp.length();
      fwd.set(0,0,1).applyQuaternion(hero.root.quaternion);
      if (d < PLAYER.reach && tmp.normalize().dot(fwd) > 0.45) {
        damageBug(PLAYER.damage[0] + Math.random()*(PLAYER.damage[1]-PLAYER.damage[0]));
      }
    }
    if (P.t <= 0) {
      if (P.kickYaw) hero.model.rotation.y -= P.kickYaw;
      P.kickYaw = 0;
      P.state = 'idle';
    }
    return;
  }

  dodgeAxis.set(0,0,0);
  const midpoint = tmp.copy(hero.root.position).add(bug.root.position).multiplyScalar(0.5);
  const dodgeKey = keys['KeyW'] ? 'KeyW' : keys['KeyS'] ? 'KeyS' : keys['KeyD'] ? 'KeyD' :
    performance.now() < P.dodgeUntil ? P.dodgeKey : null;
  if (dodgeKey === 'KeyW' || dodgeKey === 'KeyS') {
    dodgeAxis.copy(midpoint).sub(camera.position).setY(0).normalize();
    if (dodgeKey === 'KeyS') dodgeAxis.negate();
  } else if (dodgeKey === 'KeyD') {
    dodgeAxis.copy(hero.root.position).sub(bug.root.position).setY(0).normalize();
  }
  if (dodgeAxis.lengthSq() > 0) {
    dodgeTarget.copy(P.home).addScaledVector(dodgeAxis, 2.1);
    hero.root.position.lerp(dodgeTarget, 1 - Math.pow(0.0001, dt));
    if (P.state !== 'dodge') {
      const jump = hero.play(A('jump'), { once:true, fade:0.1 });
      P.dodgeAnimT = jump ? jump.getClip().duration : 0;
    } else if (P.dodgeAnimT > 0) {
      P.dodgeAnimT -= dt;
    } else {
      hero.play(A('idle'), { fade:0.2 });
    }
    P.state = 'dodge';
  } else {
    hero.root.position.lerp(P.home, 1 - Math.pow(0.0001, dt));
    if (P.state === 'dodge' && P.dodgeAnimT > 0) {
      P.dodgeAnimT -= dt;
    } else {
      P.dodgeAnimT = 0;
      hero.play(A('idle'), { fade:0.2 }); P.state = 'idle';
    }
  }
}

// ── the bug ───────────────────────────────────────────────────────────────────
function bugAI(dt) {
  if (B.dead) return;
  if (B.hitFlash > 0) B.hitFlash -= dt;
  B.t -= dt;

  tmp.copy(hero.root.position).sub(bug.root.position); tmp.y = 0;
  const dist = tmp.length();
  const toHero = tmp.clone().normalize();

  const want = Math.atan2(toHero.x, toHero.z);
  let dY = want - bug.root.rotation.y;
  while (dY > Math.PI) dY -= Math.PI*2;
  while (dY < -Math.PI) dY += Math.PI*2;
  bug.root.rotation.y += Math.sign(dY) * Math.min(Math.abs(dY), 4.0 * dt);

  switch (B.state) {
    case 'idle':
      bug.play(ENEMY_ANIM.idle);
      if (B.t <= 0) { B.state='rear'; B.t = 0.85; bug.play(ENEMY_ANIM.rear, { once:true, fade:0.12, rate:1.45 }); }
      break;
    case 'stalk': {
      // Compatibility state for older debug state. The chimp stays at its
      // mark instead of walking through Stephen.
      B.state='idle'; B.t = 1 + Math.random(); bug.play(ENEMY_ANIM.idle);
      break;
    }
    case 'rear':
      if (B.t <= 0) {
        B.state='lunge'; B.t = 0.85; B.lunged = false;
        B.dir = toHero.clone();                    // committed direction, locked at launch
        B.jumpFrom = bug.root.position.clone();
        // Land at striking distance instead of putting both fighters inside
        // the same point in space.
        B.jumpTo = hero.root.position.clone().addScaledVector(B.dir, -2.8);
        bug.play(ENEMY_ANIM.strike, { once:true, fade:0.08, rate:1.6 });
      }
      break;
    case 'lunge': {
      const progress = Math.min(1, 1 - B.t / 0.85);
      bug.root.position.lerpVectors(B.jumpFrom, B.jumpTo, progress);
      bug.root.position.y = Math.sin(progress * Math.PI) * 1.35;
      if (!B.lunged && B.t < 0.55) {
        B.lunged = true;
        // it connects only if the player is still in the path — stepping aside beats it
        tmp.copy(hero.root.position).sub(bug.root.position); tmp.y=0;
        if (tmp.length() < BUG.reach && tmp.normalize().dot(B.dir) > 0.3) damageHero(BUG.lungeDamage);
      }
      if (B.t <= 0) {
        bug.root.position.copy(B.jumpTo).setY(0);
        B.returnFrom = bug.root.position.clone();
        B.returnTo = B.home.clone();
        B.state='return'; B.t = 0.5;
      }
      break;
    }
    case 'return': {
      const progress = Math.min(1, 1 - B.t / 0.5);
      bug.root.position.lerpVectors(B.returnFrom, B.returnTo, progress);
      if (B.t <= 0) {
        bug.root.position.copy(B.home);
        B.state='idle'; B.t = 1.1 + Math.random()*1.4;
      }
      break;
    }
  }
  const r = Math.hypot(bug.root.position.x, bug.root.position.z);
  if (r > ARENA-1.2) { bug.root.position.x *= (ARENA-1.2)/r; bug.root.position.z *= (ARENA-1.2)/r; }


}

// ── camera during the fight ───────────────────────────────────────────────────
const camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3();
function fightCam(dt) {
  const mid = tmp.copy(hero.root.position).add(bug.root.position).multiplyScalar(0.5);
  const line = new THREE.Vector3().subVectors(hero.root.position, bug.root.position);
  line.y = 0;
  if (line.lengthSq() < 1e-4) line.set(0,0,1);
  line.normalize();
  // Keep the camera beside the line between them, aimed at their midpoint.
  const side = new THREE.Vector3(-line.z, 0, line.x);
  side.applyAxisAngle(new THREE.Vector3(0,1,0), camYaw);
  camGoal.copy(mid).addScaledVector(side, cameraDistance).setY(2.8);
  lookGoal.set(mid.x, 1.25, mid.z);
  camera.position.lerp(camGoal, 1 - Math.pow(0.0016, dt));
  camera.lookAt(lookGoal);
}

window.__heroPos = () => hero ? {
  x:+hero.root.position.x.toFixed(3), z:+hero.root.position.z.toFixed(3),
  yaw:+hero.root.rotation.y.toFixed(3), st:P.state, clip:hero.curName,
  bx:+bug.root.position.x.toFixed(2), bz:+bug.root.position.z.toFixed(2), bst:B.state,
  ct: hero.cur? +hero.cur.time.toFixed(3):null, ts: hero.cur? hero.cur.timeScale:null,
  w: hero.cur? +hero.cur.getEffectiveWeight().toFixed(2):null
} : null;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (phase === 'cine') cine(dt);
  else {
    player(dt); bugAI(dt);
    // SEPARATION, both ways. The bug is 2.2 across and Stephen 1.8, so anything under ~3 has them
    // standing inside each other. Pushing only the bug (as a first pass did) lets the player walk
    // straight through it.
    tmp.copy(hero.root.position).sub(bug.root.position); tmp.y = 0;
    const gap = tmp.length(), MIN = 3.0;
    if (B.state !== 'lunge' && B.state !== 'rear' && B.state !== 'return' && gap > 1e-4 && gap < MIN) {
      const push = tmp.normalize().multiplyScalar((MIN - gap) * 0.5);
      if (!B.dead) bug.root.position.sub(push);
    }
    fightCam(dt);
  }
  hero.mixer.update(dt);
  bug.mixer.update(dt);
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
