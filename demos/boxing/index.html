const keys = {};
// ANY INPUT SKIPS THE INTRO. It replaces a button that had to be aimed at, and the same press
// must not also throw a punch, so every handler returns once it has skipped.
const chrome = e => !!(e.target.closest && false);
function skipIntro() { if (phase !== 'cine') return false; endCine(); return true; }

addEventListener('keydown', e => {
  setInput('keys');
  if (skipIntro()) { e.preventDefault(); return; }
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (!e.repeat && (e.code === 'KeyW' || e.code === 'KeyS' || e.code === 'KeyD')) requestDodge(e.code);
  const attack = ['Digit1','Digit2','Digit3','Digit4','Digit5'].indexOf(e.code);
  if (attack >= 0) { e.preventDefault(); tryAttack(attack); }
});
addEventListener('keyup', e => keys[e.code] = false);
let camYaw = 0, cameraDistance = 7, dragging = false, lastX = 0, zoomedByUser = false;
// FIT THE PAIR TO THE VIEWPORT. A phone held upright has a horizontal field of view less than half
// a desktop's, so a distance that frames both fighters on a laptop puts them off the sides of a
// phone. Solve for the distance that fits their separation plus a margin in the HORIZONTAL fov,
// which is what actually constrains a side-on shot.
function fitDistance() {
  camera.fov = camera.aspect < 1 ? 62 : 48;
  camera.updateProjectionMatrix();
  const sep = Math.abs(ENEMY_END_Z - INTRO_END_Z) + 1.8;   // they close the gap, never widen it
  const vFov = camera.fov * Math.PI / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  return THREE.MathUtils.clamp((sep / 2) / Math.tan(hFov / 2) + 1.2, 4, 14);
}
cameraDistance = fitDistance();
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('wheel', e => {
  if (phase !== 'fight') return;
  e.preventDefault();
  zoomedByUser = true;
  cameraDistance = THREE.MathUtils.clamp(cameraDistance + e.deltaY * 0.012, 4.2, 30);
}, {passive:false});
addEventListener('mousedown', e => {
  if (e.button === 0) { if (skipIntro()) return; tryAttack((Math.random() * ATTACKS.length) | 0); }
  if (e.button === 2) { dragging = true; lastX = e.clientX; }
});
addEventListener('mouseup',   e => { if (e.button === 2) dragging = false; });
addEventListener('mouseleave', () => dragging = false);
addEventListener('mousemove', e => {
  if (!dragging) return;
  camYaw -= (e.clientX - lastX) * 0.006;     // drag right, scene spins right
  lastX = e.clientX;
});
let touchStart = null;
addEventListener('touchstart', e => {
  setInput('touch');
  if (e.touches.length !== 1) return;
  e.preventDefault();
  const touch = e.touches[0];
  touchStart = {x:touch.clientX, y:touch.clientY};
}, {passive:false});
addEventListener('touchend', e => {
  if (!touchStart) return;
  e.preventDefault();
  const touch = e.changedTouches[0];
  const dx = touch.clientX - touchStart.x, dy = touch.clientY - touchStart.y;
  touchStart = null;
  if (skipIntro()) return;
  if (Math.hypot(dx,dy) < 28) {
    tryAttack((Math.random() * ATTACKS.length) | 0);
    return;
  }
  requestDodge(Math.abs(dy) > Math.abs(dx) ? (dy < 0 ? 'KeyW' : 'KeyS') : 'KeyD');
}, {passive:false});

function say(t, sub) {
  centre.innerHTML = t + (sub ? `<small>${sub}</small>` : '');
  centre.classList.add('on');
}
function hide(){ centre.classList.remove('on'); }

function tryAttack(index) {
  if (paused || phase !== 'fight' || P.dead || ['attack','hurt','celebrate','grabbed','thrown'].includes(P.state)) return;
  const n = ATTACKS[index];
  if (!n) return;
  const st = STRIKE.stephen[n];
  P.kickYaw = st.yaw || 0;
  P.state = 'attack'; P.atk = n;
  const a = hero.play(A(n), { once:true, fade:0.07, rate:ATTACK_RATE, force:true });
  P.t = (a ? a.getClip().duration : 0.8) / ATTACK_RATE;
  P.dur = P.t;
  P.hitAt = P.t - P.t * st.peak;                   // fires when the fist is furthest out
  P.didHit = false;
  // DRIVE. The blow has to arrive at the other body, not at a radius. From the actual gap right
  // now, how much further than this swing's extension is the chest surface? Step that far in
  // on the way to the peak and back out afterwards, like a lunging jab.
  tmp.copy(bug.root.position).sub(hero.root.position); tmp.y = 0;
  P.drive = THREE.MathUtils.clamp(tmp.length() - HALF_DEPTH[opponent] + PEN - st.ext, 0, 1.4);
  P.driveDir = tmp.normalize().clone();
  P.driveFrom = hero.root.position.clone();
}

function damageBug(d) {
  if (B.dead) return;
  B.hp = Math.max(0, B.hp - d);
  B.hitFlash = 0.16;
  flashRed(bug);
  if (UNBEATABLE) B.hp = Math.max(B.hp, BUG.hp * HP_FLOOR);
  ehp.style.width = (100*B.hp/BUG.hp) + '%';
  // FLINCH. A hit interrupts whatever it was doing, including a committed swing, so trading blows
  // beats standing off. It does NOT interrupt a rear that is already past its tell - otherwise a
  // fast enough player denies the attack outright - and the cooldown is longer than the flinch
  // plus a wind-up, so a flurry cannot stun-lock it into a statue that never swings back.
  const committed = B.state === 'rear' && B.t < 0.32;
  if (B.hp > 0 && ENEMY_ANIM.hurt && B.hurtCd <= 0 && !committed && B.state !== 'victory') {
    B.kickYaw = 0; B.tellYaw = 0; B.tellPose = 0; B.mark = null;
    bug.model.rotation.x = 0;
    const n = ENEMY_ANIM.hurt[(Math.random() * ENEMY_ANIM.hurt.length) | 0];
    const a = bug.play(n, { once:true, fade:0.07, rate:HURT_RATE, force:true });
    B.state = 'hurt';
    B.t = (a ? a.getClip().duration * 0.45 : 0.4) / HURT_RATE;
    B.hurtCd = 2.0;
  }
  if (B.hp <= 0) {
    B.dead = true; B.state = 'dead';
    bug.play(ENEMY_ANIM.death, { once:true, fade:0.15 });
    setTimeout(()=>{ if (!P.dead) {
      P.state = 'celebrate';
      hero.play(A('dance_04'), { fade:0.3, rate:1 });
      if (round === 1) { say('ROUND 1 CLEARED', 'something worse is coming'); setTimeout(nextRound, 5200); }
      else say('BUG DOWN', 'you actually did it');
    } }, 900);
  }
}
// COMING APART. He is one skinned mesh, so the pieces have to be cut at the moment it happens:
// read every vertex in its POSED position, sort the triangles by whichever bone owns them, and
// build one loose mesh per limb. Each piece keeps the original UVs and material, so they are
// recognisably his, and is re-centred on its own centroid so it tumbles about itself rather than
// about the world origin.
const PART_OF = name => {
  if (/^(Head|NeckTwist)/.test(name)) return 'head';
  if (/^L_(Clavicle|Upperarm|Forearm|Hand)/.test(name)) return 'armL';
  if (/^R_(Clavicle|Upperarm|Forearm|Hand)/.test(name)) return 'armR';
  if (/^L_(Thigh|Calf|Foot|ToeBase)/.test(name)) return 'legL';
  if (/^R_(Thigh|Calf|Foot|ToeBase)/.test(name)) return 'legR';
  return 'torso';
};
const debris = [];
function comeApart(origin) {
  let skin = null;
  hero.model.traverse(o => { if (o.isSkinnedMesh && !skin) skin = o; });
  if (!skin) return false;
  const geo = skin.geometry, pos = geo.attributes.position, uv = geo.attributes.uv;
  const idx = geo.index, si = geo.attributes.skinIndex;
  const bones = skin.skeleton.bones;
  skin.updateMatrixWorld(true);

  // Pose every vertex once, into world space.
  const world = new Float32Array(pos.count * 3), v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    skin.getVertexPosition(i, v); v.applyMatrix4(skin.matrixWorld);
    world[i*3] = v.x; world[i*3+1] = v.y; world[i*3+2] = v.z;
  }
  const groups = {};
  const triCount = idx ? idx.count / 3 : pos.count / 3;
  for (let t = 0; t < triCount; t++) {
    const a = idx ? idx.getX(t*3) : t*3, b = idx ? idx.getX(t*3+1) : t*3+1, c = idx ? idx.getX(t*3+2) : t*3+2;
    const bone = bones[si.getX(a)];
    const part = bone ? PART_OF(bone.name) : 'torso';
    const g = groups[part] || (groups[part] = { p: [], u: [] });
    for (const k of [a, b, c]) {
      g.p.push(world[k*3], world[k*3+1], world[k*3+2]);
      if (uv) g.u.push(uv.getX(k), uv.getY(k));
    }
  }
  const mat = (Array.isArray(skin.material) ? skin.material[0] : skin.material).clone();
  mat.skinning = false; mat.side = THREE.DoubleSide;
  // The killing blow flashes him red, and the clone is taken mid-flash. The timeout that clears
  // the flash only ever sees the ORIGINAL materials, so without this the pieces stay glowing red.
  if (mat.emissive) { mat.emissive.setHex(0x000000); mat.emissiveIntensity = 1; }
  for (const name in groups) {
    const g = groups[name];
    if (g.p.length < 9) continue;
    const bg = new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.Float32BufferAttribute(g.p, 3));
    if (g.u.length) bg.setAttribute('uv', new THREE.Float32BufferAttribute(g.u, 2));
    bg.computeVertexNormals();
    bg.computeBoundingSphere();
    const c = bg.boundingSphere.center.clone();
    bg.translate(-c.x, -c.y, -c.z);                 // spin about itself, not the world
    const m = new THREE.Mesh(bg, mat);
    m.position.copy(c); m.castShadow = true;
    scene.add(m);
    const away = c.clone().sub(origin); away.y = 0;
    if (away.lengthSq() < 1e-4) away.set(Math.random()-0.5, 0, Math.random()-0.5);
    away.normalize();
    debris.push({ mesh: m,
      vel: away.multiplyScalar(2.2 + Math.random()*2.4).setY(3.4 + Math.random()*2.6),
      spin: new THREE.Vector3((Math.random()-0.5)*9, (Math.random()-0.5)*9, (Math.random()-0.5)*9) });
  }
  hero.model.visible = false;
  return debris.length > 0;
}
function stepDebris(dt) {
  for (const d of debris) {
    d.vel.y -= 11 * dt;
    d.mesh.position.addScaledVector(d.vel, dt);
    d.mesh.rotation.x += d.spin.x * dt;
    d.mesh.rotation.y += d.spin.y * dt;
    d.mesh.rotation.z += d.spin.z * dt;
    const floor = d.mesh.geometry.boundingSphere.radius * 0.45;
    if (d.mesh.position.y < floor) {                 // bounce, then settle
      d.mesh.position.y = floor;
      d.vel.y = Math.abs(d.vel.y) * 0.32;
      d.vel.x *= 0.62; d.vel.z *= 0.62;
      d.spin.multiplyScalar(0.55);
      if (d.vel.y < 0.4) { d.vel.set(0,0,0); d.spin.set(0,0,0); }
    }
  }
}

function flashRed(rig) {
  rig.model.traverse(o => {
    if (!o.isMesh || !o.material || !o.material.emissive) return;
    o.material.emissive.setHex(0x8c2a1e);
    o.material.emissiveIntensity = 1;
    setTimeout(() => o.material.emissive.setHex(0x000000), 130);
  });
}
// `held` is damage dealt while the jaws have him. It ignores the invulnerability window and does
// not open a new one - that window exists so a flurry cannot chain-stun a player who can still
// move, and he cannot. Without this the grab's third-of-a-second ticks mostly bounced off, and so
// did the blow that is supposed to finish him.
function damageHero(d, held) {
  if (P.dead || (!held && P.invuln > 0)) return;
  flashRed(hero);
  P.kickYaw = 0;
  P.hp = Math.max(0, P.hp - d);
  if (!held) P.invuln = 0.7;
  php.style.width = (100*P.hp/PLAYER.hp) + '%';
  if (P.hp <= 0) {
    P.dead = true; P.state = 'dead'; P.deadT = 0;
    hero.model.rotation.x = 0;                     // let go of the grab pose
    P.torn = P.state === 'dead' && B.state === 'grab' && comeApart(mouth);
    P.deathClip = STEPHEN_DEATHS[(Math.random() * STEPHEN_DEATHS.length) | 0];
    if (!P.torn) hero.play(A(P.deathClip), { once:true, fade:0.15 });
    // the opponent claims its win in bugAI, which sees it however the kill arrived
    say('DEFEATED', P.torn ? 'they do that' : (round > 1 ? 'back to the start' : 'going again'));
    // Long enough for it to walk onto the body and dance there, then restart the same round.
    setTimeout(restartRun, 5600);
  } else if (P.state === 'grabbed' || P.state === 'thrown') {
    // held in the jaws: he takes it, but the flinch must not fight the anchor
  } else {
    P.state = 'hurt';
    const n = HURTS[(Math.random() * HURTS.length) | 0];
    const a = hero.play(A(n), { once:true, fade:0.08, rate:HURT_RATE, force:true });
    P.t = (a ? a.getClip().duration * 0.8 : 0.5) / HURT_RATE;
  }
}

// ── the intro ─────────────────────────────────────────────────────────────────
function cine(dt) {
  cineT += dt; window.__cineT = cineT;
  const t = cineT;
  // He walks on from the very start and the camera keeps him in frame throughout — an opening
  // that orbits the bug alone reads as spinning around an empty patch of floor.
  const walkK = Math.min(1, t/WALK_T), we = walkK*walkK*(3-2*walkK);
  if (t < WALK_T) {
    hero.root.position.z = THREE.MathUtils.lerp(INTRO_START_Z, INTRO_END_Z, we);
    // the opponent squares up from the far side on the same beat
    bug.root.position.z = THREE.MathUtils.lerp(ENEMY_START_Z, ENEMY_END_Z, we);
    bug.root.rotation.y = Math.PI;
    bug.play(ENEMY_ANIM.walk, { fade:0.3, rate:FOE_WALK_RATE });
    hero.play(A('walk'), { fade:0.3, rate:HERO_WALK_RATE });
  } else {
    // ON THE MARK. He cheers, the opponent shows off, and neither keeps walking on the spot.
    hero.root.position.z = INTRO_END_Z;
    bug.root.position.z = ENEMY_END_Z;
    hero.play(A('greet_01'), { fade:0.18, rate:CHEER_RATE, once:true });
    bug.play(ENEMY_TAUNT, { fade:0.2, rate:1.5, once:true });
  }

  const between = tmp.copy(bug.root.position).add(hero.root.position).multiplyScalar(0.5);
  const line = new THREE.Vector3().subVectors(hero.root.position, bug.root.position);
  line.y = 0; line.normalize();
  const side = new THREE.Vector3(-line.z, 0, line.x);
  const sideView = between.clone().addScaledVector(side, cameraDistance).setY(2.8);

  // Where each fighter's face is. The chimp has a Head bone; the insect does not, so it gets an
  // estimate off its root instead of a crash.
  faceShot.copy(heroHead ? heroHead.getWorldPosition(tmp) : hero.root.position).setY(
    heroHead ? heroHead.getWorldPosition(tmp).y + 0.12 : 1.5);
  foeShot.copy(foeHead ? foeHead.getWorldPosition(tmp) : bug.root.position.clone().setY(1.25));
  if (foeHead) foeShot.y += 0.05;

  // Stephen's close-up sits off his shoulder; his opponent's is further out, since "not super
  // close" for something with that many teeth still wants its whole head in frame.
  // Stand off to his SIDE rather than back along the line - the line runs away from his opponent,
  // so distance along it puts the camera behind his head. Sideways keeps his face in shot and is
  // where the extra room was wanted.
  const heroNear = faceShot.clone().addScaledVector(line, 0.15).add(new THREE.Vector3(1.75, 0.25, 0));
  // `line` runs from the opponent toward Stephen, so the camera goes along POSITIVE line to sit in
  // front of its face. Going negative put it behind the head, which is why the sweep ended looking
  // at the back of it.
  // The insect is a much larger animal than the chimp, so its introduction stands off further to
  // get the whole thing in frame.
  const foeBack = opponent === 'chimp' ? 2.35 : 3.6;
  const foeNear  = foeShot.clone().addScaledVector(line, foeBack).add(new THREE.Vector3(0.9, 0.3, 0));

  if (t < WALK_T) {
    // RUNNING BACKWARDS AHEAD OF HIM. The camera leads him down the walkway at head height and
    // slightly to one side, so it is never on the line his opponent is walking in along, and
    // closes the distance as he arrives.
    const k = t / WALK_T, e = k*k*(3-2*k);
    // Close, and at or just under his head - his head sits at 1.475, so the lens rides 1.36 to
    // 1.44 and looks very slightly up at him, the way a camera operator walking backwards would.
    const ahead = THREE.MathUtils.lerp(2.5, 1.45, e);
    const across = THREE.MathUtils.lerp(1.05, 0.72, e);
    camTrack.set(hero.root.position.x + across, THREE.MathUtils.lerp(1.36, 1.44, e),
                 hero.root.position.z + ahead);
    camera.position.copy(camTrack);
    lookOut.copy(faceShot).lerp(hero.root.position, 0.16);   // hold his face, not his chest
    camera.lookAt(lookOut);
    if (t < 0.1) say('ROUND ' + round, FOE_NAME);
    if (t > WALK_T*0.5) hide();
  } else if (t < WALK_T + CELEBRATE) {
    // ON HIS FACE for the wave.
    camera.position.lerp(heroNear, 1 - Math.pow(0.004, dt));
    camera.lookAt(faceShot);
    if (t > WALK_T + CELEBRATE*0.25) say('', '');
  } else if (t < WALK_T + CELEBRATE + REVEAL) {
    // THE SWEEP. Orbit around the point between the two of them, from his shoulder round to the
    // far side, while the aim slides off his face and onto his opponent's. Interpolating the
    // camera position directly would cut straight through both fighters.
    const k = (t - WALK_T - CELEBRATE) / REVEAL, e = k*k*(3-2*k);
    pivot.copy(faceShot).add(foeShot).multiplyScalar(0.5);
    const a0 = Math.atan2(heroNear.x - pivot.x, heroNear.z - pivot.z);
    const r0 = Math.hypot(heroNear.x - pivot.x, heroNear.z - pivot.z);
    let a1 = Math.atan2(foeNear.x - pivot.x, foeNear.z - pivot.z);
    const r1 = Math.hypot(foeNear.x - pivot.x, foeNear.z - pivot.z);
    while (a1 - a0 >  Math.PI) a1 -= Math.PI * 2;
    while (a1 - a0 < -Math.PI) a1 += Math.PI * 2;
    const a = a0 + (a1 - a0) * e, r = THREE.MathUtils.lerp(r0, r1, e);
    camera.position.set(pivot.x + Math.sin(a) * r, THREE.MathUtils.lerp(heroNear.y, foeNear.y, e),
                        pivot.z + Math.cos(a) * r);
    lookOut.copy(faceShot).lerp(foeShot, e);
    camera.lookAt(lookOut);
    if (k > 0.35 && k < 0.42) say(FOE_NAME.toUpperCase(), '');
    if (k > 0.92) hide();
  } else if (t < INTRO_DURATION) {
    // Pull back to the fighting shot.
    const k = (t - WALK_T - CELEBRATE - REVEAL) / SETTLE, e = k*k*(3-2*k);
    camera.position.lerpVectors(foeNear, sideView, e);
    lookOut.copy(foeShot).lerp(new THREE.Vector3(between.x, 1.2, between.z), e);
    camera.lookAt(lookOut);
  } else {
    endCine();
  }
}
function endCine() {
  if (phase !== 'cine') return;
  phase = 'fight';
  hide(); hud.classList.add('on');
  // Let the walk-on finish where it stands if it ran to the end; if the intro was skipped part
  // way, put both on their marks. (Resetting unconditionally made Stephen teleport backward at
  // the handoff when the intro played out.)
  if (cineT < INTRO_DURATION) {
    hero.root.position.set(0, 0, INTRO_END_Z);
    bug.root.position.set(0, 0, ENEMY_END_Z);
    bug.root.rotation.y = Math.PI;
    bug.play(ENEMY_ANIM.idle, { fade:0.15 });
    cameraDistance = fitDistance();
  }
  hero.root.rotation.y = 0;
  hero.play(A('idle'), { fade:0.2 });
  P.home = hero.root.position.clone();
  P.state = 'idle';
  say('FIGHT', '');
  setTimeout(hide, 1100);
}

// ── the player ────────────────────────────────────────────────────────────────
const ndc = new THREE.Vector3();
const fwd = new THREE.Vector3(), tmp = new THREE.Vector3(), dodgeAxis = new THREE.Vector3();
function player(dt) {
  if (P.dead) { P.deadT += dt; if (!P.torn) liftBody(hero, 'stephen', P.deathClip, P.deadT); return; }
  if (P.state === 'celebrate') return;
  if (P.invuln > 0) P.invuln -= dt;

  // This is a one-dimensional fighter: the opponents stay squared up instead
  // of turning away while moving around the arena.
  if (!B.dead) {
    tmp.copy(bug.root.position).sub(hero.root.position); tmp.y = 0;
    const want = Math.atan2(tmp.x, tmp.z);
    let dY = want - hero.root.rotation.y;
    while (dY > Math.PI) dY -= Math.PI * 2;
    while (dY < -Math.PI) dY += Math.PI * 2;
    hero.root.rotation.y += Math.sign(dY) * Math.min(Math.abs(dY), 5.0 * dt);
  }

  if (P.state === 'grabbed') return;               // the bug is driving
  if (P.state === 'thrown') {
    P.t -= dt;
    const k = Math.min(1, 1 - P.t / GRAB.release), e = k*k*(3-2*k);
    hero.root.position.lerpVectors(P.throwFrom, P.home, e);
    hero.root.position.y = Math.sin(e * Math.PI) * 0.55;      // tumbles back to his mark
    hero.model.rotation.x = P.throwPitch * (1 - e);
    if (P.t <= 0) {
      hero.root.position.copy(P.home); hero.model.rotation.x = 0;
      P.state = 'idle'; hero.play(A('idle'), { fade:0.2 });
    }
    return;
  }
  if (P.state === 'dodge') { runDodge(dt); return; }

  if (P.state === 'attack' || P.state === 'hurt') {
    P.t -= dt;
    if (P.state === 'attack' && P.drive > 0) {
      // in to the peak, out over the rest
      const peakT = P.dur - P.hitAt, el = P.dur - P.t;
      const k = el < peakT ? el / peakT : Math.max(0, 1 - (el - peakT) / Math.max(0.05, P.hitAt));
      hero.root.position.copy(P.driveFrom).addScaledVector(P.driveDir, P.drive * k);
    }
    if (P.state === 'attack' && !P.didHit && P.t <= P.hitAt) {
      P.didHit = true;
      fwd.set(0,0,1).applyQuaternion(hero.root.quaternion);
      if (contact(hero.root.position, fwd, STRIKE.stephen[P.atk].ext, bug.root.position, HALF_DEPTH[opponent], LATERAL.stephen)) {
        damageBug(PLAYER.damage[0] + Math.random()*(PLAYER.damage[1]-PLAYER.damage[0]));
      }
    }
    if (P.t <= 0) {
      P.kickYaw = 0;
      P.state = 'idle';
    }
    return;
  }

  // Not dodging and not attacking: drift back to the mark and idle. The mark itself moves.
  hero.root.position.lerp(swayMark(P.home, 0, swayTarget), 1 - Math.pow(0.0001, dt));
  if (P.state !== 'idle') { hero.play(A('idle'), { fade:0.2 }); P.state = 'idle'; }
  // A bounce on his toes between exchanges. It only ever plays a clip - his state stays `idle` -
  // so it can never swallow a dodge: a press just plays the hop over it with force.
  if (P.bounceT > 0) {
    P.bounceT -= dt;
    if (P.bounceT <= 0) hero.play(A('idle'), { fade:0.15 });
  } else {
    P.bounceCd -= dt;
    if (P.bounceCd <= 0 && hero.has(HOP_CLIP)) {
      P.bounceCd = 1.3 + Math.random() * 2.0;
      const a = hero.play(HOP_CLIP, { once:true, fade:0.12, force:true });
      if (a) { a.setEffectiveTimeScale(1.35); P.bounceT = HOP_RAW / 1.35; }
    }
  }
}

// ── SLOTS ─────────────────────────────────────────────────────────────────────
// FOUR PLACES STEPHEN CAN BE, and the whole fight is read off them: center, far (W, away from the
// camera), close (S, toward it) and rear (D, straight back from the chimp).
//
// CENTER IS ALWAYS UNSAFE. The chimp's tell names exactly ONE more, so there are always two safe
// slots and two that are not - and which one it named is the only thing the player has to read.
//
// The hit test used to be geometric: a cone from the striker against Stephen's live position. That
// made "did I get out of the way" depend on sub-unit distances nobody can see, and because each
// clip peaked at a different fraction of its own length, the time from wind-up to damage moved
// between 0.26s and 0.58s depending on which attack was rolled. You cannot learn a tell whose
// payoff time changes every throw. Slots make the question discrete, and FIGHT.strike below makes
// the answer arrive at the same moment every single time.
const FIGHT = {
  slotDist:  1.0,    // how far a dodge carries him off the mark. 2.0 read as a standing long jump
  tell:      0.60,   // the wind-up. THIS IS THE REACTION WINDOW - see the note on `strike` below
  // commit -> damage, THE SAME FOR EVERY ATTACK, which is what makes the tell learnable at all.
  //
  // THE TIME THERE IS TO DODGE IS `tell` + `strike`, the whole way from the tell appearing to the
  // blow landing, because a press books its slot for the exchange rather than being sampled at one
  // instant. Both halves count, but they are not interchangeable: `tell` is time spent LOOKING at
  // the wind-up, so lengthening it makes the read easier, while `strike` is time spent watching an
  // attack already in flight, so lengthening that makes the chimp look slow and floaty. To buy
  // reaction time, raise `tell` first.
  strike:    0.30,
  recover:   0.35,   // after the blow, before it is back on guard
  gapMin:    1.1, gapMax: 2.3,        // breathing room between attacks, and room to move in it
  // THE TELL IS A POSE, NOT A CLIP. box_02 is a 2.8s duck: even played fast the read arrives late,
  // because the information is buried in the middle of a long move. These four numbers are struck
  // on in a tenth of a second and held, so the shape is complete before the player has to decide.
  look:      0.75,   // head yaw toward the marked slot - THIS is the direction cue
  bodyTurn:  0.18,   // a little shoulder follows the head, so it reads from the back of the arena
  headLift:  0.38,   // chin comes up
  armOut:    0.65,   // arms flare away from the body
  poseIn:    0.10,   // seconds to snap the whole pose on
  // THE DODGE MUST STILL BE OUT WHEN THE BLOW ARRIVES. At 0.40 the hold ran 0.72s in total against
  // a 0.75s tell-to-impact, so a player who read the tell perfectly and moved on the first frame was
  // home again three hundredths before the punch landed - and center is never safe, so a flawless
  // dodge was punished exactly as hard as standing still. The trip now outlasts the strike window
  // with room to spare: press any time from the start of the tell to the moment of impact and the
  // ground under him is somewhere else when it lands.
  dodgeOut:  0.12, dodgeHold: 0.55, dodgeBack: 0.20,
  dodgeRate: 1.9,
};
const dodgeDur = () => FIGHT.dodgeOut + FIGHT.dodgeHold + FIGHT.dodgeBack;

// KEEP THEIR FEET MOVING. Two fighters planted on their marks between exchanges reads as two models
// waiting for input rather than as two men looking for an opening. Both of them now drift on a slow
// figure of eight around the mark: lateral on one period, forward and back on a slower one, so the
// two never line up and it does not tick like a metronome. They run on opposite phases so they are
// not swaying in unison.
//
// The amplitude is an eighth of the gap between slots. That is deliberately far too small to change
// which slot anyone is nearest, so every hit rule is untouched by it - the movement is on the
// surface only, and nothing about who gets hit moves with it.
const SWAY = { amp: 0.13, rate: 1.9 };
let swayT = 0;
const swayTarget = new THREE.Vector3();
function swayMark(home, phase, out) {
  slotAxes();
  const a = swayT * SWAY.rate + phase;
  return out.copy(home)
    .addScaledVector(latAxis,  Math.sin(a) * SWAY.amp)
    .addScaledVector(rearAxis, Math.cos(a * 0.63) * SWAY.amp * 0.5);
}

// APPLIED AFTER THE MIXER, UNDONE BEFORE THE NEXT ONE. The mixer owns these bones; anything added
// on top of them only survives because it is re-added every frame, and the moment a clip stops
// writing a bone - frozen with timeScale 0, or clamped on its last frame - an offset that is merely
// added compounds instead. That is exactly how the bite's arms ended up helicoptering. Saving the
// mixer's own value and restoring it before the next update makes that impossible by construction:
// the pose is never read back as input, so there is nothing for it to accumulate onto.
//
// MEASURED on the rig: the Head bone's local Y maps to model up (so a Y rotation is a clean yaw)
// and its local X to model lateral (a pitch). The arms are mirrored about the spine, so the two
// sides take opposite signs or they scissor instead of flaring.
const TELL_SAVE = [];
const tellQ = new THREE.Quaternion(), tellQ2 = new THREE.Quaternion();
const AX_X = new THREE.Vector3(1,0,0), AX_Y = new THREE.Vector3(0,1,0), AX_Z = new THREE.Vector3(0,0,1);
function clearTellPose() {
  for (let i = TELL_SAVE.length - 1; i >= 0; i--) TELL_SAVE[i].b.quaternion.copy(TELL_SAVE[i].q);
  TELL_SAVE.length = 0;
}
function applyTellPose() {
  const k = B.tellPose || 0;
  if (k <= 0.001) return;
  const push = (bone, q) => {
    if (!bone) return;
    TELL_SAVE.push({ b: bone, q: bone.quaternion.clone() });
    bone.quaternion.premultiply(q);
  };
  if (foeHead) {
    tellQ.setFromAxisAngle(AX_Y, B.markYaw * k);                  // look at the slot it will hit
    // NEGATED: rendered both ways and looked at them. The Head bone's local +X tucks the chin
    // DOWN, so the sign is flipped here to let the slider read the way it is labelled.
    tellQ2.setFromAxisAngle(AX_X, -FIGHT.headLift * k);           // chin up
    push(foeHead, tellQ.multiply(tellQ2));
  }
  if (foeArms) foeArms.upper.forEach((b, i) => {
    push(b, tellQ2.setFromAxisAngle(AX_Z, (i ? -1 : 1) * FIGHT.armOut * k));
  });
  foeClav.forEach((b, i) => {
    push(b, tellQ2.setFromAxisAngle(AX_Z, (i ? -1 : 1) * FIGHT.armOut * 0.4 * k));
  });
}
const attackGap = () => FIGHT.gapMin + Math.random() * Math.max(0, FIGHT.gapMax - FIGHT.gapMin);

const SLOTS = ['center', 'far', 'close', 'rear'];
const KEY_SLOT = { KeyW:'far', KeyS:'close', KeyD:'rear' };
const latAxis = new THREE.Vector3(), rearAxis = new THREE.Vector3(), slotTmp = new THREE.Vector3();
// The lateral axis is taken ACROSS THE CAMERA rather than across the fight line, so W and S always
// move him visibly up and down the screen whatever angle the camera has been dragged to.
function slotAxes() {
  slotTmp.copy(hero.root.position).add(bug.root.position).multiplyScalar(0.5);
  latAxis.copy(slotTmp).sub(camera.position).setY(0).normalize();
  rearAxis.copy(hero.root.position).sub(bug.root.position).setY(0).normalize();
  if (latAxis.lengthSq() < 1e-6) latAxis.set(1, 0, 0);
  if (rearAxis.lengthSq() < 1e-6) rearAxis.set(0, 0, 1);
}
function slotPos(name, out) {
  slotAxes();
  out.copy(P.home || hero.root.position);
  if (name === 'far')   out.addScaledVector(latAxis,   FIGHT.slotDist);
  if (name === 'close') out.addScaledVector(latAxis,  -FIGHT.slotDist);
  if (name === 'rear')  out.addScaledVector(rearAxis,  FIGHT.slotDist);
  return out;
}
// WHERE HE ACTUALLY IS, not where he meant to go. Reading the live position rather than the dodge's
// target means a dodge that is still on its way out, or already on its way home, is judged on the
// ground he is actually standing over - which is what the player sees.
const slotProbe = new THREE.Vector3();
function currentSlot() {
  if (!P.home) return 'center';
  let best = 'center', bestD = Infinity;
  for (const n of SLOTS) {
    const d = slotPos(n, slotProbe).distanceToSquared(hero.root.position);
    if (d < bestD) { bestD = d; best = n; }
  }
  return best;
}
// ONCE THE JAWS ARE COMMITTED THEY FOLLOW HIM. Both closing moves are only ever thrown at a man
// standing in the middle who has had the whole tell to leave, so they are not meant to be escapable
// at the last instant - and if he does bolt inside the strike window, a mouth that keeps aiming at
// the ground he vacated is the exact thing that looks stupid. Re-aiming each frame while it closes
// means it lands on him wherever he went, which reads as being run down rather than as a whiff.
function trackHero(gap) {
  B.dir.copy(hero.root.position).sub(bug.root.position).setY(0);
  if (B.dir.lengthSq() > 1e-6) B.dir.normalize(); else B.dir.set(0, 0, 1);
  B.jumpTo.copy(hero.root.position).addScaledVector(B.dir, -gap);
}

const unsafeNow = () => ['center', B.mark].filter(Boolean);
const isUnsafe = n => n === 'center' || n === B.mark;
// A DODGE IS A COMMITMENT, so it counts from the press, not from when his feet arrive. Judging him
// on his live position instead let a dodge started late in the tell still read as `center` at the
// commit - the chimp would throw the face-eat at a man who was already leaving, and close its jaws
// on the air he used to be in. Pressing a direction takes you off the middle immediately.
const committedSlot = () => (P.state === 'dodge' ? P.slot : currentSlot());

// READING A TELL IS STICKY FOR THE WHOLE EXCHANGE. The slot used to be read at the instant the
// chimp commits, which is a single invisible frame at the end of the tell - and the dodge is an
// 0.87s round trip that puts him back on centre. So a player who pressed a little early, or pressed
// twice, or hopped at a fidget and mistook it for the wind-up, had his hop finish BEFORE that
// instant, was standing on centre when it was sampled, and got the face-eat for it. From the chair
// that is indistinguishable from dodging every attack and being grabbed anyway.
//
// So it is no longer a sample. Pressing a direction at any point from the start of the tell to the
// moment of impact books that slot for this exchange, whatever his feet are doing by then, and the
// last press before impact is the one that counts. Read the tell and you are out of the middle -
// full stop - and the timing lottery in between is gone.
const effectiveSlot = () => B.reacted || committedSlot();

// The punches and the kick, with the face-eat held back for the middle slot.
const PUNCHES = (ENEMY_ANIM.strikeSet || []).filter(n => n !== ENEMY_ANIM.bite);
const pickPunch = () => (PUNCHES.length ? PUNCHES : ENEMY_ANIM.strikeSet)[
  (Math.random() * (PUNCHES.length || ENEMY_ANIM.strikeSet.length)) | 0];

// WHICH WAY TO TURN FOR THE TELL. The direction comes from the geometry, so the chimp turns its
// real right for `close` and its real left for `far` however the camera has been dragged round;
// the SIZE comes from the slider, so the turn can be pushed well past life-size to read at a
// glance. `rear` deliberately gets nothing - staying square is itself the third tell.
const markProbe = new THREE.Vector3();
function markLookYaw(mark) {
  if (mark === 'rear' || !mark) return 0;
  slotPos(mark, markProbe);
  let d = Math.atan2(markProbe.x - bug.root.position.x, markProbe.z - bug.root.position.z)
        - bug.root.rotation.y;
  while (d >  Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return Math.sign(d) * FIGHT.look;
}

// THE DODGE IS ONE COMMITTED MOVE, not a position you hold. Held as a position it re-evaluated
// every frame, which is what kept restarting the hop. A press now buys a fixed trip: out, wait
// there long enough for a strike to miss, come back. Nothing during that reads the keys, and
// because a keydown only repeats while held (filtered) the key must be released and pressed again
// before the next one.
function requestDodge(key) {
  if (paused || phase !== 'fight' || P.dead) return;
  if (P.state === 'dodge' || P.state === 'attack' || P.state === 'hurt' || P.state === 'celebrate') return;
  const slot = KEY_SLOT[key];
  if (!slot) return;
  B.reacted = slot;                    // books it for this exchange, however the hop plays out
  P.state = 'dodge';
  P.slot = slot;
  P.dodgeT = dodgeDur();
  P.landed = false;
  P.dodgeFrom = (P.home || hero.root.position).clone();
  P.dodgeTo = slotPos(slot, new THREE.Vector3());
  hero.play(hero.has(HOP_CLIP) ? HOP_CLIP : A('jump'), { once:true, fade:0.06, rate:FIGHT.dodgeRate, force:true });
}
function runDodge(dt) {
  const dur = dodgeDur();
  P.dodgeT -= dt;
  const el = dur - P.dodgeT;
  if (!P.landed && el >= HOP_RAW / FIGHT.dodgeRate) {   // down on his feet, back on guard
    P.landed = true;
    hero.play(A('idle'), { fade:0.12 });
  }
  if (el < FIGHT.dodgeOut) {
    const k = el / FIGHT.dodgeOut, e = k*k*(3-2*k);
    hero.root.position.lerpVectors(P.dodgeFrom, P.dodgeTo, e);
  } else if (el < FIGHT.dodgeOut + FIGHT.dodgeHold) {
    hero.root.position.copy(P.dodgeTo);            // parked clear of the strike line
  } else {
    const k = Math.min(1, (el - FIGHT.dodgeOut - FIGHT.dodgeHold) / FIGHT.dodgeBack), e = k*k*(3-2*k);
    hero.root.position.lerpVectors(P.dodgeTo, P.dodgeFrom, e);
  }
  if (P.dodgeT <= 0) {
    hero.root.position.copy(P.dodgeFrom);
    P.state = 'idle'; P.slot = 'center';
    hero.play(A('idle'), { fade:0.18 });
  }
}


// ── the bug ───────────────────────────────────────────────────────────────────
// Hang him head-first from the mouth. Rather than positioning his ROOT by an assumed chest height,
// read where his chest actually is this frame and shift the root by the difference - his spine
// moves with whatever clip is on him, so a rest-pose offset left a visible gap between the jaws
// and his body. `k` eases the pull-in so he is dragged into the mouth rather than teleported.
function anchorToMouth(dt, k) {
  mouthPoint(mouth);
  P.grabPitch = THREE.MathUtils.lerp(P.grabPitch, GRAB.pitch, 1 - Math.pow(0.004, dt));
  hero.model.rotation.x = P.grabPitch;
  tmp.copy(bug.root.position).sub(hero.root.position); tmp.y = 0;
  if (tmp.lengthSq() > 1e-6) hero.root.rotation.y = Math.atan2(tmp.x, tmp.z) + GRAB.cross;
  hero.root.updateMatrixWorld(true);
  if (heroChest) {
    heroChest.getWorldPosition(vB);
    vA.copy(mouth).sub(vB);
    hero.root.position.addScaledVector(vA, k >= 1 ? 1 : 0.4 * k);
  }
}

function bugAI(dt) {
  if (B.hurtCd > 0) B.hurtCd -= dt;
  // CLAIM THE WIN HERE, not where the damage is dealt. Stephen can die inside any branch of the
  // switch below, and that branch then carries on to set its own next state - a lunge that lands
  // the killing blow still moves itself to 'return' on the same frame, which is exactly how the
  // chimp ended up fighting on over the body. Doing it before the switch covers every branch.
  if (P.dead && !B.dead && B.state !== 'victory') {
    B.state = 'victory'; B.lunged = true; B.victoryT = 0;
    bug.model.rotation.x = 0;
    B.kickYaw = 0; B.tellYaw = 0; B.tellPose = 0;
    if (B.act) { B.act.setEffectiveTimeScale(1); B.act = null; }
  }
  if (B.dead) { B.deadT += dt; liftBody(bug, opponent, bare(ENEMY_ANIM.death), B.deadT); return; }
  if (UNBEATABLE && B.hp < BUG.hp) {               // it knits itself back together
    B.hp = Math.min(BUG.hp, B.hp + BUG.regen * dt);
    ehp.style.width = (100*B.hp/BUG.hp) + '%';
  }
  if (B.hitFlash > 0) B.hitFlash -= dt;
  B.t -= dt;

  tmp.copy(hero.root.position).sub(bug.root.position); tmp.y = 0;
  const dist = tmp.length();
  const toHero = tmp.clone().normalize();

  const want = Math.atan2(toHero.x, toHero.z);
  let dY = want - bug.root.rotation.y;
  while (dY > Math.PI) dY -= Math.PI*2;
  while (dY < -Math.PI) dY += Math.PI*2;
  bug.root.rotation.y += Math.sign(dY) * Math.min(Math.abs(dY), 4.0 * dt);

  switch (B.state) {
    case 'hurt':
      if (B.t <= 0) { B.state = 'idle'; B.t = 0.5 + Math.random()*0.7; bug.play(ENEMY_ANIM.idle, { fade:0.15 }); }
      break;
    case 'victory': {
      // Walk over and dance on the spot where he fell. This has to be tighter than the 1.6 they
      // fight at, or the approach never happens and it just dances where it stood.
      const close = 1.05;
      if (dist > close) {
        bug.root.position.x += toHero.x * BUG.walk * 1.35 * dt;
        bug.root.position.z += toHero.z * BUG.walk * 1.35 * dt;
        bug.play(ENEMY_ANIM.walk, { fade:0.25, rate:1.35 });
      } else if (ENEMY_ANIM.victoryLoop) {
        bug.play(ENEMY_ANIM.victory, { fade:0.3, rate:1.0 });
      } else {
        // No celebration clip in the set: display once, then settle rather than loop a threat.
        B.victoryT += dt;
        const a = bug.play(ENEMY_ANIM.victory, { fade:0.3, rate:1.0, once:true });
        if (B.victoryT > (a ? a.getClip().duration : 1.5) + 0.2) bug.play(ENEMY_ANIM.idle, { fade:0.4 });
      }
      break;
    }
    case 'idle':
      if (B.fidgetT > 0) {
        B.fidgetT -= dt;
        const f = B.fidget;
        const k = 1 - Math.max(0, B.fidgetT) / f.dur;
        if (f.lateral) bug.root.position.copy(B.home)
          .addScaledVector(B.fidgetDir, f.lateral * Math.sin(k * Math.PI));
        if (B.fidgetT <= 0) { bug.root.position.copy(B.home); bug.play(ENEMY_ANIM.idle, { fade:0.22 }); }
      } else {
        bug.root.position.lerp(swayMark(B.home, 2.4, swayTarget), 1 - Math.pow(0.0006, dt));
        bug.play(ENEMY_ANIM.idle);
        B.fidgetCd -= dt;
        const f = B.fidgetCd <= 0 ? pickFidget(n => bug.has(n)) : null;
        // Only when the whole thing fits before the wind-up starts. A fidget that runs into the
        // tell either cuts the tell short or hides it, and the tell is the only warning there is.
        if (f && B.t > f.dur + FIDGET.lead) {
          B.fidget = f; B.fidgetT = f.dur;
          B.fidgetCd = FIDGET.gapMin + Math.random() * (FIDGET.gapMax - FIDGET.gapMin);
          const sgn = Math.random() < 0.5 ? 1 : -1;
          B.fidgetDir = new THREE.Vector3(toHero.z * sgn, 0, -toHero.x * sgn);
          const a = bug.play(f.clip, { once:true, fade:0.10, force:true });
          if (a) a.setEffectiveTimeScale(a.getClip().duration / f.dur);   // cut to fit
        }
      }
      if (B.t <= 0) {
        // Roll the second unsafe slot and start the tell. Center is unsafe regardless, so this is
        // always a choice between two safe slots and two that are not.
        B.mark = ['far', 'close', 'rear'][(Math.random() * 3) | 0];
        B.markYaw = markLookYaw(B.mark);
        B.tellYaw = 0;
        B.reacted = null;                  // and this exchange starts unanswered
        B.state = 'rear'; B.t = FIGHT.tell; B.fidgetT = 0; B.tellPose = 0;
        bug.play(ENEMY_ANIM.idle, { fade:0.10 });
      }
      break;
    case 'stalk': {
      // Compatibility state for older debug state. The chimp stays at its
      // mark instead of walking through Stephen.
      B.state='idle'; B.t = 1 + Math.random(); bug.play(ENEMY_ANIM.idle);
      break;
    }
    case 'rear': {
      // THE TELL. Fixed length, and it carries exactly one piece of information: which slot, on top
      // of center, is about to become unsafe. B.mark was chosen when this state was entered.
      //
      // The chimp turns toward the slot it has marked - its right for `close`, its left for `far` -
      // and stays square for `rear`. The turn is set ABSOLUTELY from the state every frame down in
      // tick(), never accumulated onto a bone, because a clip that is frozen or clamped stops
      // resetting what you added to it and the offset then compounds every frame. That is the bug
      // that made the arms helicopter; this cannot reproduce it.
      bug.root.position.lerp(B.home, 1 - Math.pow(0.002, dt));   // settle onto the mark
      const into = FIGHT.tell - Math.max(0, B.t);
      B.tellPose = Math.min(1, into / Math.max(0.02, FIGHT.poseIn));   // struck on, then held
      B.tellYaw = Math.sign(B.markYaw) * FIGHT.bodyTurn * B.tellPose;
      if (B.t <= 0) {
        // COMMIT. Read the slot he has booked, not the ground his feet happen to be over.
        const slot = effectiveSlot();
        B.jumpFrom = bug.root.position.clone();
        B.tellYaw = 0; B.tellPose = 0;

        // IT ATTACKS A PLACE, NOT A PERSON. Everything below aims at a slot the tell already named,
        // never at wherever Stephen happens to be standing - which is what makes a miss legible.
        // Tracking him meant the chimp lunged at the man, so a "miss" looked like a punch that
        // should plainly have connected. Thrown at the spot it telegraphed, the same punch reads as
        // him having got out of the way.
        const aimSlot = isUnsafe(slot) ? slot : (B.mark || 'center');
        const aim = slotPos(aimSlot, new THREE.Vector3());
        B.dir = aim.clone().sub(bug.root.position).setY(0).normalize();

        // reason: it ends with the jaws shut, so thrown at a man who is not there it closes on air
        // and hangs there. It used to ignore the slot rules entirely - below a third HP EVERY
        // attack became the grab wherever he was standing, so a clean dodge still got grabbed at
        // nothing. It needs the middle slot now; anywhere else and he gets punched instead.

          B.grabYaw = bug.root.rotation.y;
          B.finisher = true;
          B.grabHp = P.hp;

        // dodge far better than the chimp pulling up short does. Only the face-eat is withheld: it
        // ENDS on a hold with the jaws clamped shut, so thrown at a man who is not there it closes
        // on empty air and hangs there, and no amount of timing makes that read as a near miss.
        // So: the middle gets you eaten, the slot it named gets you hit, anywhere else gets you a
        // punch through the space you just left.
        const pick = slot === 'center' && ENEMY_ANIM.bite ? ENEMY_ANIM.bite : pickPunch();
        B.bite = pick === ENEMY_ANIM.bite;
        B.strike = STRIKE[opponent][bare(pick)] || { ext: 1.2, peak: 0.3 };

        if (B.bite) {

          // the clip is played at whatever rate puts its measured peak exactly on the end of it.

          B.act = bug.play(pick, { once:true, fade:0.06, rate: BITE.peak / BITE.spring, force:true });

        // 0.58s spread they used to have.

          B.phase = 'hold';

          B.lunged = true;

        bug.model.rotation.x = BITE.lean;

        const k = Math.min(1, (el - BITE.spring - BITE.hold) / BITE.recoil), e = k*k*(3-2*k);

      const arc = opponent !== 'chimp' ? 1.35 : B.bite ? 0.55 : 0;
      bug.root.position.y = Math.sin(progress * Math.PI) * arc;

        B.lunged = true;

        // read taken at commit, so a dodge that starts late still saves him - he is judged on where
        // he is when it lands, which is what the player can see.
        if (isUnsafe(effectiveSlot())) damageHero(DMG[B.bite ? 'biteDamage' : 'lungeDamage']);
      }
      if (B.t <= 0) {
        B.kickYaw = 0;
        bug.root.position.copy(B.jumpTo).setY(0);
        B.returnFrom = bug.root.position.clone();
        B.returnTo = B.home.clone();
        B.state='return'; B.t = 0.5;
      }
      break;
    }
    case 'return': {
      const progress = Math.min(1, 1 - B.t / 0.5);
      bug.root.position.lerpVectors(B.returnFrom, B.returnTo, progress);
      if (B.t <= 0) {
        bug.root.position.copy(B.home);
        B.state='idle'; B.t = attackGap();
      }

    }

}

const camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3();
// The camera used to take its axis from the LIVE line between the two. They stand 1.6 apart and a
// dodge moves 2.0, so that line could swing more than 50 degrees in a fifth of a second - and
// during the bite, at a 0.82 gap, further still. The camera whipped round its own orbit, which
// reads as a violent zoom. Take the axis from their marks instead, which do not move, and let the
// aim point follow the live midpoint only part of the way.
const camLine = new THREE.Vector3(), camMid = new THREE.Vector3(), liveMid = new THREE.Vector3();

// Midpoint of the two jaw bones, in world space, as they are this frame.
function mouthPoint(out) {

}
function fightCam(dt) {
  const homeA = P.home || hero.root.position, homeB = B.home || bug.root.position;
  camMid.copy(homeA).add(homeB).multiplyScalar(0.5);
  liveMid.copy(hero.root.position).add(bug.root.position).multiplyScalar(0.5);
  const mid = tmp.copy(camMid).lerp(liveMid, 0.35);

  const side = new THREE.Vector3(-line.z, 0, line.x);

  camGoal.copy(mid).addScaledVector(side, cameraDistance).setY(tall ? 3.5 : 2.8);
  lookGoal.set(mid.x, tall ? 1.45 : 1.25, mid.z);

  camera.lookAt(lookGoal);

  // and compare; a right-drag that spins the camera past them flips the pair.
  camera.updateMatrixWorld();

}

    // Anything that deliberately closes the distance is exempt. The grab in particular holds him
    // inside the jaws, and the push was quietly shoving the bug off him every frame.
    const CLOSING = ['lunge','rear','return','bite','grab'].includes(B.state)
                 || P.state === 'grabbed' || P.state === 'thrown';
    if (!CLOSING && gap > 1e-4 && gap < MIN) {
      const push = tmp.normalize().multiplyScalar((MIN - gap) * 0.5);
      if (!B.dead) bug.root.position.sub(push);
    }
    fightCam(dt);
  }
  if (debris.length) stepDebris(dt);
  clearTellPose();            // hand the bones back before the mixer writes them
  hero.mixer.update(dt);
  bug.mixer.update(dt);
  applyTellPose();            // and lay the tell back on top of what it wrote
  // KICK YAW IS ABSOLUTE. Some attacks strike sideways, so the model is turned to aim them at the
  // target. That used to be done by adding to the rotation on the way in and subtracting on the
  // way out, across seven different places - and any path that skipped its subtraction, or ran it
  // twice, left the fighter permanently turned. Setting it outright from the state each frame
  // cannot drift, and clearing the state snaps the facing back on the very next frame.
  hero.model.rotation.y = hero.baseYaw + P.kickYaw;
  bug.model.rotation.y  = bug.baseYaw  + B.kickYaw + B.tellYaw;
  updateTuneReadout();
  window.__dbg = { phase, round, unbeatable:UNBEATABLE, mark:B.mark, slot:phase==='fight'?currentSlot():null, bhp:B.hp, bmax:BUG.hp, php:P.hp, bdead:B.dead, dist:cameraDistance, aspect:camera.aspect, bstate:B.state, bt:B.t, bhit:B.hitAt, blen:B.lungeDur, pstate:P.state, pt:P.t, phit:P.hitAt, patk:P.atk, gap:Math.hypot(hero.root.position.x-bug.root.position.x, hero.root.position.z-bug.root.position.z),
    heroZ:hero.root.position.z, bugZ:bug.root.position.z,
    cam:[camera.position.x, camera.position.y, camera.position.z] };
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  if (!zoomedByUser) cameraDistance = fitDistance();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
