<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boxing Demo</title>
<style>
  @font-face { font-family: nasa; src: url("../../fonts/nasalization-rg.ttf"); font-display: swap; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#05070a; }
  canvas { display:block; touch-action:none; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; opacity:0; transition:opacity .8s ease; }
  #hud.on { opacity:1; }
  /* Each bar sits on its own fighter's side and drains toward the outside edge. The camera is
     side-on with Stephen on the right, but a right-drag can spin past them, so #hud.swap flips
     both bars when that happens. */
  .bar { position:absolute; top:22px; width:34%; }
  .bar.p { right:22px; } .bar.e { left:22px; }
  #hud.swap .bar.p { left:22px; right:auto; } #hud.swap .bar.e { right:22px; left:auto; }
  .bar .who {
    font:12px/1 nasa, ui-monospace, monospace; letter-spacing:.16em; text-transform:uppercase;
    color:#c7d4dd; margin-bottom:6px; text-shadow:0 2px 6px #000;
  }
  .bar.p .who { text-align:right; } #hud.swap .bar.p .who { text-align:left; }
  #hud.swap .bar.e .who { text-align:right; }
  .bar .track {
    height:13px; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.28); border-radius:3px;
    overflow:hidden;
  }
  .bar .fill { height:100%; width:100%; transition:width .18s ease; }
  .bar.p .fill { background:linear-gradient(90deg,#3ee07d,#8ff0b4); }
  .bar.e .fill { background:linear-gradient(90deg,#e0563e,#f0a23e); }
  .bar.p .track { direction:rtl; } #hud.swap .bar.p .track { direction:ltr; }
  #hud.swap .bar.e .track { direction:rtl; }

  #keys {
    position:absolute; left:22px; bottom:20px;
    font:11px/1.75 ui-monospace,"Courier New",monospace; letter-spacing:.08em; color:#8fa0ad;
    text-shadow:0 1px 4px #000;
  }
  #keys b { color:#e0c07a; font-weight:600; }
  #centre {
    position:absolute; left:0; right:0; top:42%; text-align:center;
    font:26px/1.3 nasa, sans-serif; letter-spacing:.14em; color:#fff;
    text-shadow:0 3px 18px #000; opacity:0; transition:opacity .5s ease;
  }
  #centre.on { opacity:1; }
  #centre small { display:block; font:13px ui-monospace,monospace; letter-spacing:.1em; opacity:.75; margin-top:10px; }
  #boot {
    position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    background:#05070a; color:#b9c8d2; font:13px nasa, "Courier New", monospace; letter-spacing:4px;
    transition:opacity .6s ease;
  }
  #boot.gone { opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div id="boot">LOADING…</div>
<div id="hud">
  <div class="bar p"><div class="who">Stephen</div><div class="track"><div class="fill" id="php"></div></div></div>
  <div class="bar e"><div class="who" id="enemy-name">Warrior Bug</div><div class="track"><div class="fill" id="ehp"></div></div></div>
  <div id="keys"></div>
  <div id="centre"></div>
</div>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
} }
</script>

<script type="module">
// BOXING DEMO — Stephen versus a selectable opponent.
//
// three 0.158.0 ON PURPOSE: r159 rewrote the skinning shader to use textureSize()/texelFetch(),
// which are WebGL 2 only, so every skinned mesh goes invisible on a WebGL 1 machine. Both fighters
// here are skinned. ?gl1 forces a WebGL 1 context so that stays testable.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const A = n => 'preset:biped:' + n + '.001';     // both models carry the Blender suffix now
const C = n => 'preset:biped:' + n + '.001';      // Chimpanzee clips have a Blender suffix
const Q = new URLSearchParams(location.search);
// TWO ROUNDS. The chimp is round 1 and can be beaten; the warrior bug is round 2 and cannot -
// it regenerates faster than anyone can cut it down and will not drop below a floor, so the round
// is a question of how long you last, not whether you win. `?fair` makes it killable.
const round = Q.get('round') === '2' ? 2 : 1;
const opponent = round === 2 ? 'insect' : 'chimp';
const UNBEATABLE = round === 2 && !Q.has('fair');
const HP_FLOOR = 0.09;                             // fraction of max the bug never falls below
const ARENA = 11;
// INTRO BEATS. He used to walk for 7s and reach his mark in about 4, so the last three were spent
// marching on the spot. WALK_T is now the whole walk-on, CELEBRATE the beat where he cheers and
// the opponent shows off, and INTRO_DURATION is just their sum.
const INTRO_START_Z = -11, INTRO_END_Z = -0.8;
// FOUR BEATS, introducing the two of them the way a broadcast would.
//   WALK    a camera running backwards ahead of Stephen as he comes out
//   MEET    it settles onto his face for the wave
//   REVEAL  it sweeps around him to find his opponent, and holds on its face
//   SETTLE  it pulls back to the fighting shot
const WALK_T = 3.2, CELEBRATE = 1.3, REVEAL = 1.6, SETTLE = 0.8;
const INTRO_DURATION = WALK_T + CELEBRATE + REVEAL + SETTLE;
// Walk rates are set from the ground speed each one covers, not picked by eye: Stephen crosses
// 10.2 units in WALK_T (2.83 a second against his 2.4 walk) and the opponent 9.2 (2.56 against
// 1.7), so their feet keep up with the floor.
const HERO_WALK_RATE = 1.18, FOE_WALK_RATE = 1.5;
// `greet_01` is 3.54s and runs walk-up into a raised-arm wave, so at this rate the whole clip
// plays inside the beat and ends where the fight starts.
const CHEER_RATE = 3.54 / CELEBRATE;
// The opponent walks on from its own side rather than being planted there from frame one.
// The chimp squares up at a 1.6 gap, derived from its punch reach below; the insect is a much
// longer body and keeps the 3.2 it was tuned at.
const ENEMY_START_Z = 10, ENEMY_END_Z = opponent === 'chimp' ? 0.8 : 2.4;
const MIN_GAP = opponent === 'chimp' ? 0.9 : 2.7;   // bodies touch at 0.47 for the chimp
// MEASURED CONTACT GEOMETRY. For each strike: how far the fist or foot travels from the root at
// full extension (game units, model scale applied), where in the clip that peak sits, and for the
// kicks the direction they actually go - the front_kick clips extend along local +X (kick_01) or
// 48 degrees off forward (kick_02), so the model is turned by `yaw` for the swing. These numbers
// come from stepping the clips and reading the end-effector positions; the gap, the drive and the
// hit test are all derived from them rather than tuned by eye.
const STRIKE = {
  // Re-measured on the replacement model: its punches are shorter than the old one's (0.68
  // against 1.13) and front_kick_02 is now a back kick - its foot peaks behind him, so the yaw
  // that points it at the target is most of a half turn.
  stephen: { box_01:{ext:0.68, peak:0.28}, box_03:{ext:0.68, peak:0.25, yaw:-0.73},
             front_kick_01:{ext:0.78, peak:0.40, yaw:-1.67}, front_kick_02:{ext:0.90, peak:0.50, yaw:-2.86} },
  chimp:   { box_01:{ext:1.28, peak:0.30}, box_03:{ext:1.14, peak:0.27},
             front_kick_02:{ext:0.83, peak:0.63, yaw:-0.85}, 'press-up':{ext:0.42, peak:0.60} },
  insect:  { Strike:{ext:2.61, peak:0.5} },          // keeps the insect's landing spot where it was
};
const HALF_DEPTH = { stephen:0.20, chimp:0.26, insect:1.1 };   // root to chest surface (insect estimated)
const LATERAL    = { stephen:0.7,  chimp:0.75, insect:1.2 };   // how far off the line still connects
const PEN = 0.1;                                               // how deep a landed blow sinks in
const bare = n => n.replace(/^preset:biped:/, '').replace(/\.001$/, '');
// Did a strike from `from` along `dir`, reaching `ext`, land on a body at `to`?
function contact(from, dir, ext, to, targetHalf, lateral) {
  const d = new THREE.Vector3().subVectors(to, from); d.y = 0;
  const along = d.dot(dir);
  const off = Math.hypot(d.x - dir.x*along, d.z - dir.z*along);
  return along > 0 && along < ext + targetHalf + 0.15 && off < lateral;
}
const PLAYER = {
  scale: 1.8, walk: 2.4, run: 5.6, back: 1.8, side: 3.8,
  hp: 100, reach: 3.6, damage: [12, 20],
};
const BUG = {
  scale: 2.2, walk: 1.7, hp: 420, lungeSpeed: 9.5, lungeDamage: 16, biteDamage: 22, reach: 3.2,
  // Round 2: it hits for more and knits itself back together. Regen sits BELOW what a player can
  // land (Stephen averages 16 a hit, about one a second), so pressing the attack really does
  // drive the bar down - it just stops at HP_FLOOR and climbs back the moment you breathe.
  // Hope, then the floor: that reads as a boss, where out-regenerating the player reads as a
  // health bar that ignores you.
  regen: 11, boss: { lungeDamage: 27, biteDamage: 27 },
};
// The chimp has biped clips, but not the insect-specific names.
const CHIMP_ANIM = {
  idle: C('idle'), walk: C('walk'),
  rear: C('box_02'),                              // the low crouching wind-up
  strike: C('box_01'),                            // default; strikeSet cycles
  strikeSet: ['box_01','box_03','front_kick_02','press-up'].map(C),
  bite: C('press-up'),                            // jumps at the face, grabs and pulls
  taunt: C('dance_05'),                           // a quick strut while Stephen waves
  // `dance_05` is the threat display it winds up with, so using it over the body read as the
  // chimp still fighting. `jump` is a bounce on the spot - that reads as celebrating.
  victory: C('jump'), victoryLoop: true,          // a bounce on the spot
  hurt: [C('hit_to_body_02'), C('hit_to_head')],  // it flinches when it is hit
  death: C('defeat_03'),
};
const INSECT_ANIM = {idle:'Idle', walk:'Walk', rear:'RearUp', strike:'Strike', strikeSet:['Strike'], taunt:'RearUp', victory:'RearUp', victoryLoop:false, hurt:null, canGrab:true, death:'Death'};
const ENEMY_ANIM = opponent === 'chimp' ? CHIMP_ANIM : INSECT_ANIM;
const ENEMY_FILE = opponent === 'chimp' ? 'chimpanzee.glb' : 'insect_animated.glb';
const ENEMY_TAUNT = ENEMY_ANIM.taunt;
const FOE_NAME = opponent === 'chimp' ? 'Chimpanzee' : 'Warrior Bug';
document.getElementById('enemy-name').textContent = FOE_NAME;
const nextRound = () => { location.search = '?round=2' + (FORCE_GL1 ? '&gl1' : ''); };
// Losing sends you back to the start of the run - the chimp - whichever round you lost on. Keep
// the debug flags across the restart, and reload rather than navigate when the target is the URL
// we are already on, since assigning an identical location does nothing.
const restartRun = () => {
  const keep = ['gl1', 'probe', 'fair'].filter(k => Q.has(k));
  const target = location.pathname + (keep.length ? '?' + keep.join('&') : '');
  if (location.pathname + location.search === target) location.reload();
  else location.href = target;
};
const DMG = UNBEATABLE ? BUG.boss : BUG;
// MEASURED: sampling the skinned surface through defeat_03 at game scale, Stephen's lowest vertex
// ends 0.246 below the floor and the chimp's 0.274 - they lie in the concrete. The clip sinks
// gradually to its lowest at the very end, so the lift ramps in over the fall rather than popping
// the body up on the first frame.
// THE BITE, measured at game scale. The clip already does the move: at its midpoint (t=1.0 of
// 2.0) the feet are 0.347 off the ground, the hands are furthest forward (0.492) AND closest
// together (spread 0.712 against 0.805 at rest) - the jump and the squeeze are both in there.
// Two things stopped it reading. The head at that moment sits at z -0.204, a fifth of a unit
// BEHIND the chimp's root while its hands reach half a unit in front, so the face can never get
// near Stephen without the bodies interpenetrating. Pitching the model 25 degrees forward swings
// the head to z +0.463 and drops it to y 1.474, which is Stephen's head height (1.451) - so the
// faces meet with the bodies still a clear 0.74 apart. And the move had no hold: it lerped
// straight through the contact. It is phased now - spring in, hold, snap back.
const BITE = {
  spring: 0.34, hold: 0.95, recoil: 0.26,
  gap: 0.74,               // root to root at the hold; bodies touch at 0.47
  lean: THREE.MathUtils.degToRad(25),
  peak: 1.0,               // seconds into the clip where the squeeze is
};
BITE.dur = BITE.spring + BITE.hold + BITE.recoil;
// MEASURED per death clip: the lowest skinned vertex at game scale, and how long the clip takes
// to get there. `fall` lies deeper than `defeat_03` (0.254 against 0.222) and drops more than
// twice as fast - lowest at 1.75s against 3.77 - so one lift and one ramp for both would either
// pop the body up early or leave it in the concrete while it settles.
const DEATH = {
  stephen: { 'defeat_03': {lift:0.24, ramp:2.6}, 'fall': {lift:0.27, ramp:1.2} },
  chimp:   { 'defeat_03': {lift:0.30, ramp:2.6} },
  insect:  { 'Death':     {lift:0,    ramp:1.0} },
};
const STEPHEN_DEATHS = ['defeat_03', 'fall'];
function liftBody(rig, who, clip, elapsed) {
  const d = DEATH[who] && DEATH[who][clip];
  if (!d) return;
  rig.root.position.y = d.lift * Math.min(1, elapsed / d.ramp);
}
const ATTACKS = ['box_01','box_03','front_kick_01','front_kick_02'];
const HURTS = ['hit_to_body_01','hit_to_body_02','hit_to_side','hit_to_head'];
const HOP_CLIP = '__hop';
// Between attacks it used to stand perfectly still, which reads as waiting rather than circling.
// A single hop and a small step off the line and back, on a random cadence.
const BOB_CLIP = '__bob', STRUT_CLIP = '__strut';
// STANDING STILL BETWEEN ATTACKS READS AS WAITING FOR INPUT, not as a fighter picking its moment.
// There was already a shuffle here, but it only fired when more than 1.15s of the gap was left and
// the gap is now 0.9-1.8s, so it had quietly stopped happening at all. This is a small table of
// things to do instead, each one cut to a fixed length and played at whatever rate fills it.
//
// `lateral` steps off the line and back on a half-sine, so he always finishes on his mark - the
// tell has to start from a known place or the slot geometry stops meaning anything. It is kept far
// smaller than the 1.0 a dodge covers: this is weight-shifting, not repositioning.
const FIDGETS = [
  { clip: HOP_CLIP,   dur: 0.55, lateral: 0.34, weight: 3 },   // hop off the line and back
  { clip: HOP_CLIP,   dur: 0.42, lateral: 0.00, weight: 2 },   // bounce on the spot
  { clip: BOB_CLIP,   dur: 0.60, lateral: 0.00, weight: 3 },   // dip at the knees
  { clip: STRUT_CLIP, dur: 0.95, lateral: 0.18, weight: 2 },   // a roll of the shoulders
];
const FIDGET = { gapMin: 0.08, gapMax: 0.50, lead: 0.25 };     // `lead`: never eat the wind-up
function pickFidget(have) {
  const ok = FIDGETS.filter(f => have(f.clip));
  const total = ok.reduce((n, f) => n + f.weight, 0);
  if (!total) return null;
  let r = Math.random() * total;
  for (const f of ok) if ((r -= f.weight) <= 0) return f;
  return ok[ok.length - 1];
}
// THE BUG'S GRAB. Measured at game scale off the Strike clip, its jaws thrust to z 1.19 at head
// height 0.98, and the mouth - the midpoint of Upper_Jaw and Lower_Jaw - is the anchor. Stephen is
// pitched 75 degrees so he hangs head-first from it: a point at chest height h then sits h*sin(75)
// ahead of his root and h*cos(75) above it, which is the offset that puts his chest IN the mouth.
// Everything is recomputed per frame from the live bone, so he goes wherever the jaws go.
// MEASURED on the squeeze frame: adding to the upper arms' X takes the hand gap from 0.713 to
// 0.280 at 0.35rad while keeping the hands forward, so X is the axis that crushes inward.
//
// This is BAKED INTO THE CLIP, not applied at runtime. Doing it per frame meant adding to the
// bone rotation and trusting the mixer to have reset it first - and at the hold the clip is
// frozen with timeScale 0, so it does not reset, and 0.42rad accumulated every frame. That is
// four rotations a second: the arms helicoptered. Baked, the pose is simply correct.
const SQUEEZE = { upper: 0.42, fore: 0.26 };

const GRAB = { reach:0.42, latch:0.20, shake:1.95, release:0.55,
               // Held ACROSS the jaws, not pointing into them. Head-first drove his whole body
               // through the inside of the skull; crosswise he sticks out either side, which is
               // both what a bug carrying prey looks like and free of clipping.
               pitch: THREE.MathUtils.degToRad(90), cross: Math.PI/2,
               dmg: 7, tick: 0.33, finishAt: 1/3 };
GRAB.dur = GRAB.reach + GRAB.latch + GRAB.shake + GRAB.release;
// The preset clips are performed at a leisurely pace; a fight wants them snappy. Rate scales the
// playback AND the state timer together, otherwise the state outlasts the animation and he stands
// frozen at the end of a swing.
const ATTACK_RATE = 1.7, HURT_RATE = 1.5;
// THE JUMP CLIP IS FIVE HOPS. Measured off the foot height, `jump` runs 2.25s and bounces at
// 0.13, 0.61, 1.13, 1.57 and 1.99 - which is why a dodge looked like a kangaroo however the
// trigger behaved. Hop 1 is the tallest, so the dodge uses a subclip cut from just after hop 0
// lands to just before hop 2 leaves: one arc, with its take-off and landing.
const HOP = { from: 0.42, to: 1.04 };   // 1.13 caught the start of hop 2 lifting again
// Scaling the hop to fill the whole dodge played it at 0.72x, which is why it looked slow and why
// he was still in the air when the dodge ended. It runs faster than life now and finishes early;
// he lands and stands on guard for the rest of the trip.
// The raw length of the one-arc hop subclip. The time he is airborne is this over the dodge rate,
// recomputed at use rather than cached, so the tuning slider takes effect immediately.
let HOP_RAW = 0.62;

// ── renderer ──────────────────────────────────────────────────────────────────
const FORCE_GL1 = Q.has('gl1');
let renderer;
if (FORCE_GL1) {
  const cv = document.createElement('canvas');
  renderer = new THREE.WebGLRenderer({ canvas: cv, context: cv.getContext('webgl', { antialias:true }) });
} else {
  renderer = new THREE.WebGLRenderer({ antialias:true });
}
// The models looked soft and washed out next to the same asset in Tripo's own viewer, and none of
// it was the mesh. Three things were missing here:
//   - no tone mapping, so the whole image sat flat with the highlights clipping
//   - no anisotropy on the model textures, so a 4K map blurred at every glancing angle, which is
//     most of a body; only the canvas textures for the stage were getting it
//   - nothing in the environment, so a roughness-0.9 material with two lights has nothing to pick
//     up. Tripo lights with an environment, which is where its surface detail comes from.
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090d14);
scene.fog = new THREE.Fog(0x0a0e15, 26, 120);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 300);

// The environment below supplies ambient of its own, so the hemisphere is only a top-up now.
// Left at its old strength the two stacked, and a black fleece jacket rendered almost white.
scene.add(new THREE.HemisphereLight(0x8ea8bd, 0x1c242e, 0.52));
const key = new THREE.DirectionalLight(0xfff2de, 1.7);
key.position.set(8, 14, 6); key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
const S = 16;
key.shadow.camera.left=-S; key.shadow.camera.right=S;
key.shadow.camera.top=S; key.shadow.camera.bottom=-S; key.shadow.camera.far=48;
key.shadow.bias=-0.0016;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6f9ac6, 1.5);
rim.position.set(-8,5,-7); scene.add(rim);
// A soft fill from the camera side so faces are not left to the ambient term alone.
// Key and fill both come from the camera side, so whatever faces us takes both. Keep the fill
// low or it doubles the key on exactly the surfaces the player is looking at.
// Bounce off the concrete, from below. Everything else comes from above, which leaves the eye
// sockets and the underside of the brow in shadow - this lifts them without touching the jacket
// much, since it strikes upward-facing surfaces at a glance.
const bounce = new THREE.DirectionalLight(0xc2cfdc, 0.5);
bounce.position.set(2, -3.5, 4); scene.add(bounce);
const fill = new THREE.DirectionalLight(0xbcd2e6, 0.22);
fill.position.set(6, 3, -2); scene.add(fill);

// THE SPOT OVER THE RING. The directionals above light the fighters but they light the whole
// rooftop equally, so nothing said where the fight was - the canvas read as floor rather than as
// the lit circle everyone is watching. This hangs one lamp over the middle and lets its falloff
// draw the edge of the arena for us.
//
// `decay` is left at 1 rather than the physical 2 on purpose: at 2 the intensity needed to reach
// the canvas from 18 units up blows the fighters' heads out long before the floor is lit, because
// they are a third of the way up the cone.
const SPOT_H = 18, SPOT_ANGLE = 0.20;      // tight enough to sit on the fight and nothing else
// 130 by eye against 0 / 70 / 130 / 220 rendered side by side: enough to draw the pool and let the
// canvas fall away into the dark at the rim, without flattening the night out of the rest of it.
// PENUMBRA 0.30: an edge you can see, with enough softness left that it does not alias along the
// rim as the camera turns. 0.55, where this started, was gradual enough that the pool had no edge
// at all and simply read as ambient light.
const spot = new THREE.SpotLight(0xffeccd, 130, 46, SPOT_ANGLE, 0.30, 1);
spot.position.set(0, SPOT_H, 1.5);          // just off the camera side of centre, so faces are lit
spot.target.position.set(0, 0, 0); scene.add(spot.target);
spot.castShadow = true;
spot.shadow.mapSize.set(1024, 1024);
spot.shadow.camera.near = 2; spot.shadow.camera.far = SPOT_H + 14;
spot.shadow.bias = -0.0022;
scene.add(spot);

// The beam itself. A cone of haze, additive and never writing depth, brightest where we are looking
// along its surface rather than through it - which is what makes a shaft of light read as a volume
// instead of as a grey ice cream cone. It fades out before it reaches the canvas so the beam and
// the pool of light meet instead of the geometry ending in a visible rim.
const beamGeo = new THREE.ConeGeometry(SPOT_H * Math.tan(SPOT_ANGLE) * 1.02, SPOT_H, 48, 1, true);
const beam = new THREE.Mesh(beamGeo, new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  uniforms: { uColor: { value: new THREE.Color(0xffe3b4) }, uStrength: { value: 0.26 } },
  vertexShader: `
    varying vec3 vN; varying vec3 vV; varying float vH;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vN = normalize(normalMatrix * normal);
      vV = normalize(-mv.xyz);
      vH = clamp(position.y / ${SPOT_H.toFixed(1)} + 0.5, 0.0, 1.0);   // 0 at the floor, 1 at the lamp
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform vec3 uColor; uniform float uStrength;
    varying vec3 vN; varying vec3 vV; varying float vH;
    void main() {
      float graze = 1.0 - abs(dot(normalize(vN), normalize(vV)));
      float a = pow(graze, 2.0) * uStrength;
      // THE ONLY VIEW THAT MATTERS IS THE LOW ONE. This used to fade out below 0.42 of the way up
      // and get denser toward the lamp, which is a perfectly good shaft of light from across the

// Everything here is drawn into canvases at load time. No external images: the page already pulls
// two multi-megabyte models, and a fighting stage is mostly grime, windows and silhouettes, which
// a few dozen lines of 2D drawing does as well as a download would. Every canvas is a power of two
// so the textures still mipmap on WebGL 1.
function canvasTex(w, h, draw, repX = 1, repY = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX, repY);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

  g.fillStyle = '#242a31'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26000; i++) {
    const v = Math.random();
    g.fillStyle = v > 0.5 ? 'rgba(210,225,240,0.035)' : 'rgba(0,0,0,0.10)';
    g.fillRect(Math.random()*w, Math.random()*h, 1 + (v > 0.97 ? 1 : 0), 1);
  }
  for (let i = 0; i < 16; i++) {                      // damp patches
    const x = Math.random()*w, y = Math.random()*h, r = rand(26, 90);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(10,13,17,0.42)'); gr.addColorStop(1, 'rgba(10,13,17,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.lineWidth = 3; g.strokeStyle = 'rgba(8,10,13,0.85)';    // slab joints
  for (const p of [0, 256]) { g.beginPath(); g.moveTo(p, 0); g.lineTo(p, h); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
  g.lineWidth = 1; g.strokeStyle = 'rgba(0,0,0,0.35)';      // hairline cracks
  for (let i = 0; i < 7; i++) {
    let x = Math.random()*w, y = Math.random()*h;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 6; k++) { x += rand(-34, 34); y += rand(-34, 34); g.lineTo(x, y); }

// STRIP ROOT MOTION. Tripo's clips travel: Stephen's walk moves the Hip 1.53 units over one
// cycle and his run 3.53, monotonically — and when the clip loops the Hip snaps back to the start,
// which is the teleport. The chimp's walk does the same (1.12). Attacks are fine; box_01 and
// box_03 return to where they began.
//
// The game decides where a character is, so a clip should only pose the bones. Hip translation is
// in the rig's own Z-up space — index 0 sideways, 1 forward/back, 2 height — so pin 0 and 1 to
// their first-frame value and leave 2 alone, which keeps bob, crouch, jump height and the fall in
// defeat_03.
// THE REST POSE IS A GUARD, NOT ARMS AT THE SIDES. Both fighters ship with a generic standing idle
// - hands hanging - which reads as two men queuing rather than two men about to fight. box_01 ends
// on a real stance: rendered the last frame of every boxing clip on both models and looked at them,
// and box_02 ends mid-reach while box_03 reads as covering up, but box_01 ends hands-up and weight
// forward on Stephen and the chimp alike. Its final keyframe is lifted and laid over the idle.
//
// APPLIED AS A DELTA from the idle's own first frame, not as a replacement: the difference between
// the two poses is added to every idle keyframe, so the idle's breathing and weight shift carry
// through the arms instead of freezing them into a mannequin.
//
// Arms only. The legs, hips and spine are left to the idle, which owns the ground contact - posing
// the hips out of a clip whose root sits elsewhere is what floated the feet last time.
const STANCE_BONE = /^(?:L|R)_(?:Clavicle|Upperarm|Forearm|Hand|UpperarmTwist\d*|ForearmTwist\d*)$/;
function stanceFrom(anims) {
  const src = anims.find(a => a.name === A('box_01'));
  if (!src) return null;                           // the insect has no biped clips; it keeps its own
  const pose = new Map();
  for (const tr of src.tracks) {
    const m = /^(.+)\.quaternion$/.exec(tr.name);
    if (!m || !STANCE_BONE.test(m[1]) || tr.values.length < 4) continue;
    pose.set(m[1], tr.values.slice(tr.values.length - 4));      // the last keyframe
  }
  return pose.size ? pose : null;
}
const stWant = new THREE.Quaternion(), stHave = new THREE.Quaternion();
const stDelta = new THREE.Quaternion(), stQ = new THREE.Quaternion();
function applyStance(clip, pose) {
  if (!pose) return clip;
  for (const tr of clip.tracks) {
    const m = /^(.+)\.quaternion$/.exec(tr.name);
    if (!m || !pose.has(m[1]) || tr.values.length < 4) continue;
    stWant.fromArray(pose.get(m[1]));
    stHave.fromArray(tr.values, 0);                // where the idle starts this bone
    stDelta.copy(stWant).multiply(stHave.invert());
    for (let i = 0; i < tr.times.length; i++)
      stQ.fromArray(tr.values, i * 4).premultiply(stDelta).toArray(tr.values, i * 4);
  }
  return clip;
}

function stripTravel(clip) {
  for (const tr of clip.tracks) {
    if (!/\.position$/.test(tr.name)) continue;
    if (!/(^|\.)(Hip|Root)\.position$/.test(tr.name)) continue;
    const v = tr.values;
    if (v.length < 6) continue;
    const x0 = v[0], y0 = v[1];
    for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i+1] = y0; }
  }
  return clip;
}

class Rig {
  constructor(gltf, scale, yaw) {
    this.root = new THREE.Group(); this.root.scale.setScalar(scale); scene.add(this.root);
    this.model = gltf.scene;
    this.baseYaw = yaw;
    this.model.rotation.y = yaw;
    this.model.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true; o.receiveShadow = true;
      o.frustumCulled = false;                       // skinned bounds go stale mid-clip
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      const maxAniso = renderer.capabilities.getMaxAnisotropy();
      for (const m of ms) {
        if (!m) continue;
        if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
        // Every map on the material, not just the colour one.
        for (const slot of ['map','normalMap','roughnessMap','metalnessMap','aoMap','emissiveMap']) {
          const t = m[slot];
          if (t) { t.anisotropy = maxAniso; t.needsUpdate = true; }
        }
        m.envMapIntensity = 0.22;
        m.needsUpdate = true;
      }
    });
    this.root.add(this.model);
    this.mixer = new THREE.AnimationMixer(this.model);
    this.clips = {};
    const stance = stanceFrom(gltf.animations);
    for (const c of gltf.animations) {
      const corrected = c.name === C('press-up');
      const entrance = c.name === A('walk');
      const clip = c.clone();          // always clone: stripTravel edits track values in place
      if (entrance) clip.tracks = clip.tracks.filter(track => track.name !== 'Root.position');
      if (c.name === A('idle')) applyStance(clip, stance);   // stand him up in a guard
      if (corrected) {
        // STAND THE PUSH-UP UP. Measured raw: the body lies horizontal with the Hip at its normal
        // standing height (0.305), head 0.29 forward of it, feet 0.27 behind, hands under the chest.
        // Pitching it 90 degrees about the HIP keeps the hip where it is, so the feet come down to
        // the floor and the hands swing out in front - the grab. An earlier version pitched the
        // Root instead, whose pivot is on the floor: that dropped the hip to ground level, put the
        // feet 0.27 under it and slid the whole body 0.3 back from its mark.
        const hip = clip.tracks.find(track => track.name === 'Hip.quaternion');
        if (hip) {
          const turn = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -Math.PI/2);
          const q = new THREE.Quaternion();
          for (let i = 0; i < hip.times.length; i++) {
            q.fromArray(hip.values, i * 4).premultiply(turn).toArray(hip.values, i * 4);
          }
        }
        // Crush the arms further in, weighted by a half-sine over the clip so the extra fold is
        // zero at both ends and strongest in the middle - which is where the clip's own squeeze
        // already peaks, so the two add rather than fight.
        const dur = clip.duration || 1;
        const axis = new THREE.Vector3(1, 0, 0), extra = new THREE.Quaternion(), q2 = new THREE.Quaternion();
        for (const [names, amount] of [[['L_Upperarm','R_Upperarm'], SQUEEZE.upper],
                                       [['L_Forearm','R_Forearm'], SQUEEZE.fore]]) {
          for (const n of names) {
            const tr = clip.tracks.find(track => track.name === n + '.quaternion');
            if (!tr) continue;
            for (let i = 0; i < tr.times.length; i++) {
              const w = Math.sin(Math.PI * (tr.times[i] / dur));
              extra.setFromAxisAngle(axis, amount * w);
              q2.fromArray(tr.values, i * 4).premultiply(extra).toArray(tr.values, i * 4);
            }
          }
        }
      }
      this.clips[clip.name] = this.mixer.clipAction(stripTravel(clip));
    }
    this.cur = null; this.curName = null;
  }
  has(n){ return !!this.clips[n]; }
  play(n, { fade=0.22, rate=1, once=false, force=false } = {}) {
    const a = this.clips[n];
    if (!a) return null;
    a.setEffectiveTimeScale(rate);
    if (this.cur === a && !force) return a;
    a.reset();
    // A REVERSED CLIP MUST START AT ITS END. reset() puts the playhead at 0, so with a negative
    // rate the very first update steps to -0.04 and wraps round to the end — meaning one frame
    // posed at the START of the walk (mid-stride, weight forward) before it snaps back. That one
    // frame is what reads as lurching forward before he backs up.
    if (rate < 0) a.time = a.getClip().duration;
    a.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, once ? 1 : Infinity);
    a.clampWhenFinished = once;
    a.setEffectiveWeight(1); a.play();
    if (this.cur) this.cur.crossFadeTo(a, fade, false);
    this.cur = a; this.curName = n;
    return a;
  }
  get dur(){ return this.cur ? this.cur.getClip().duration : 0; }
  freeze(){ this.mixer.stopAllAction(); this.cur = null; this.curName = null; }
}

const loader = new GLTFLoader();
const load = f => new Promise((res, rej) => loader.load(f, res, undefined, rej));
let hero, bug, clock, heroHead, foeHead, jawU, jawL, heroChest, foeArms = null, foeClav = [];

Promise.all([load('../../models/stephen.glb'), load('../../models/' + ENEMY_FILE)])
.then(([s, i]) => {
  hero = new Rig(s, PLAYER.scale, 0);            // faces +Z after the glTF axis swap
  heroHead = hero.model.getObjectByName('Head');
  // The bone the jaws close on.
  heroChest = hero.model.getObjectByName('Spine02') || hero.model.getObjectByName('Spine01');
  const jc = s.animations.find(c => c.name === A('jump'));
  if (jc) {
    const hop = THREE.AnimationUtils.subclip(
      stripTravel(jc.clone()), 'hop', Math.round(HOP.from * 60), Math.round(HOP.to * 60), 60);
    hero.clips[HOP_CLIP] = hero.mixer.clipAction(hop);
    HOP_RAW = hop.duration;                       // airborne time is this over FIGHT.dodgeRate
  }
  bug  = new Rig(i, BUG.scale, opponent === 'chimp' ? 0 : Math.PI/2);
  foeHead = bug.model.getObjectByName('Head');
  jawU = bug.model.getObjectByName('Upper_Jaw');
  jawL = bug.model.getObjectByName('Lower_Jaw');
  const ua = ['L_Upperarm','R_Upperarm'].map(n => bug.model.getObjectByName(n));
  const fa = ['L_Forearm','R_Forearm'].map(n => bug.model.getObjectByName(n));
  if (ua[0] && ua[1]) foeArms = { upper: ua, fore: fa[0] && fa[1] ? fa : null, applied: 0 };
  foeClav = ['L_Clavicle','R_Clavicle'].map(n => bug.model.getObjectByName(n)).filter(Boolean);
  // IDLE BUSINESS. box_02 used to be the tell and dance_05 the victory strut; the tell is a pose
  // now, so both clips are free, and the front of each is cut out to fidget with between attacks.
  // Only the FRONT: box_02's dip reads on its own, but its follow-through is a committed crouch,
  // and a full 2.9s of dance_05 between attacks looks like the fight has stopped for a routine.
  const subcut = (name, secs, into) => {
    const c = i.animations.find(a => a.name === name);
    if (!c || c.duration < secs * 1.05) return;
    bug.clips[into] = bug.mixer.clipAction(THREE.AnimationUtils.subclip(
      stripTravel(c.clone()), into, 0, Math.round(secs * 60), 60));
  };
  subcut(ENEMY_ANIM.rear,  0.85, BOB_CLIP);      // box_02: a quick dip at the knees
  subcut(ENEMY_ANIM.taunt, 1.30, STRUT_CLIP);    // dance_05: a shoulder roll

  // Same cut for the opponent, which shuffles between attacks. Its own victory bounce keeps the
  // full clip, because there a string of hops is the point.
  const bj = i.animations.find(c => c.name === ENEMY_ANIM.victory);
  if (bj && bj.duration > HOP.to) {
    const bhop = THREE.AnimationUtils.subclip(
      stripTravel(bj.clone()), 'bhop', Math.round(HOP.from * 60), Math.round(HOP.to * 60), 60);
    bug.clips[HOP_CLIP] = bug.mixer.clipAction(bhop);
  }
  hero.root.position.set(0, 0, INTRO_START_Z);   // off-platform, walks on during the intro
  hero.root.rotation.y = 0;
  bug.root.position.set(0, 0, ENEMY_START_Z);
  B.home = new THREE.Vector3(0, 0, ENEMY_END_Z);
  bug.root.rotation.y = Math.PI;
  hero.play(A('swagger'));
  bug.play(ENEMY_ANIM.idle);
  document.getElementById('boot').classList.add('gone');
  setTimeout(()=>document.getElementById('boot').remove(), 700);
  clock = new THREE.Clock(true);
  renderer.setAnimationLoop(tick);
}).catch(e => { document.getElementById('boot').textContent = 'LOAD FAILED — ' + e.message; });

const php = document.getElementById('php'), ehp = document.getElementById('ehp');

const keysEl = document.getElementById('keys');
let inputMode = null;

setInput(matchMedia('(hover: none) and (pointer: coarse)').matches ? 'touch' : 'keys');

const P = { hp: PLAYER.hp, state:'intro', t:0, atk:null, dead:false, invuln:0, home:null, kickYaw:0, dodgeT:0, dodgeFrom:null, dodgeTo:null, landed:false, slot:'center', bounceT:0, bounceCd:1.0, deadT:0, deathClip:'defeat_03', grabPitch:0, throwFrom:null, throwPitch:0, torn:false };
const B = { hp: BUG.hp, state:'idle', t:2.2, dead:false, hitFlash:0, lunged:false, home:null, bite:false, lungeDur:0.55, hurtCd:0, deadT:0, kickYaw:0, phase:null, act:null, victoryT:0, fidgetT:0, fidgetCd:0.6, fidgetDir:null, fidget:null, caught:false, grabYaw:0, finisher:false, grabHp:0, mark:null, markYaw:0, tellYaw:0, tellPose:0, reacted:null };

// THE TUNING PANEL HOLDS THE FIGHT STILL. Dialling a reaction window in while being punched is not
// really dialling it in, and worse, dying reloads the page (restartRun) - so the panel a player had
