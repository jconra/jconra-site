<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boxing Demo</title>
<style>
  @font-face { font-family: nasa; src: url("../../fonts/nasalization-rg.ttf"); font-display: swap; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#05070a; }
  canvas { display:block; touch-action:none; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; opacity:0; transition:opacity .8s ease; }
  #hud.on { opacity:1; }
  /* Each bar sits on its own fighter's side and drains toward the outside edge. The camera is
     side-on with Stephen on the right, but a right-drag can spin past them, so #hud.swap flips
     both bars when that happens. */
  .bar { position:absolute; top:22px; width:34%; }
  .bar.p { right:22px; } .bar.e { left:22px; }
  #hud.swap .bar.p { left:22px; right:auto; } #hud.swap .bar.e { right:22px; left:auto; }
  .bar .who {
    font:12px/1 nasa, ui-monospace, monospace; letter-spacing:.16em; text-transform:uppercase;
    color:#c7d4dd; margin-bottom:6px; text-shadow:0 2px 6px #000;
  }
  .bar.p .who { text-align:right; } #hud.swap .bar.p .who { text-align:left; }
  #hud.swap .bar.e .who { text-align:right; }
  .bar .track {
    height:13px; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.28); border-radius:3px;
    overflow:hidden;
  }
  .bar .fill { height:100%; width:100%; transition:width .18s ease; }
  .bar.p .fill { background:linear-gradient(90deg,#3ee07d,#8ff0b4); }
  .bar.e .fill { background:linear-gradient(90deg,#e0563e,#f0a23e); }
  .bar.p .track { direction:rtl; } #hud.swap .bar.p .track { direction:ltr; }
  #hud.swap .bar.e .track { direction:rtl; }

  #keys {
    position:absolute; left:22px; bottom:20px;
    font:11px/1.75 ui-monospace,"Courier New",monospace; letter-spacing:.08em; color:#8fa0ad;
    text-shadow:0 1px 4px #000;
  }
  #keys b { color:#e0c07a; font-weight:600; }
  #centre {
    position:absolute; left:0; right:0; top:42%; text-align:center;
    font:26px/1.3 nasa, sans-serif; letter-spacing:.14em; color:#fff;
    text-shadow:0 3px 18px #000; opacity:0; transition:opacity .5s ease;
  }
  #centre.on { opacity:1; }
  #centre small { display:block; font:13px ui-monospace,monospace; letter-spacing:.1em; opacity:.75; margin-top:10px; }
  #boot {
    position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    background:#05070a; color:#b9c8d2; font:13px nasa, "Courier New", monospace; letter-spacing:4px;
    transition:opacity .6s ease;
  }
  #boot.gone { opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div id="boot">LOADING…</div>
<div id="hud">
  <div class="bar p"><div class="who">Stephen</div><div class="track"><div class="fill" id="php"></div></div></div>
  <div class="bar e"><div class="who" id="enemy-name">Warrior Bug</div><div class="track"><div class="fill" id="ehp"></div></div></div>
  <div id="keys"></div>
  <div id="centre"></div>
</div>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
} }
</script>

<script type="module">
// BOXING DEMO — Stephen versus a selectable opponent.
//
// three 0.158.0 ON PURPOSE: r159 rewrote the skinning shader to use textureSize()/texelFetch(),
// which are WebGL 2 only, so every skinned mesh goes invisible on a WebGL 1 machine. Both fighters
// here are skinned. ?gl1 forces a WebGL 1 context so that stays testable.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const A = n => 'preset:biped:' + n;              // Stephen's clips carry this prefix
const C = n => 'preset:biped:' + n + '.001';      // Chimpanzee clips have a Blender suffix
const Q = new URLSearchParams(location.search);
// TWO ROUNDS. The chimp is round 1 and can be beaten; the warrior bug is round 2 and cannot -
// it regenerates faster than anyone can cut it down and will not drop below a floor, so the round
// is a question of how long you last, not whether you win. `?fair` makes it killable.
const round = Q.get('round') === '2' ? 2 : 1;
const opponent = round === 2 ? 'insect' : 'chimp';
const UNBEATABLE = round === 2 && !Q.has('fair');
const HP_FLOOR = 0.09;                             // fraction of max the bug never falls below
const ARENA = 11;
// INTRO BEATS. He used to walk for 7s and reach his mark in about 4, so the last three were spent
// marching on the spot. WALK_T is now the whole walk-on, CELEBRATE the beat where he cheers and
// the opponent shows off, and INTRO_DURATION is just their sum.
const INTRO_START_Z = -11, INTRO_END_Z = -0.8;
const WALK_T = 3.6, CELEBRATE = 1.7, INTRO_DURATION = WALK_T + CELEBRATE;
const WALK_RATE = 1.45, CHEER_RATE = 2.3;
// The opponent walks on from its own side rather than being planted there from frame one.
// The chimp squares up at a 1.6 gap, derived from its punch reach below; the insect is a much
// longer body and keeps the 3.2 it was tuned at.
const ENEMY_START_Z = 10, ENEMY_END_Z = opponent === 'chimp' ? 0.8 : 2.4;
const MIN_GAP = opponent === 'chimp' ? 0.9 : 2.7;   // bodies touch at 0.47 for the chimp
// MEASURED CONTACT GEOMETRY. For each strike: how far the fist or foot travels from the root at
// full extension (game units, model scale applied), where in the clip that peak sits, and for the
// kicks the direction they actually go - the front_kick clips extend along local +X (kick_01) or
// 48 degrees off forward (kick_02), so the model is turned by `yaw` for the swing. These numbers
// come from stepping the clips and reading the end-effector positions; the gap, the drive and the
// hit test are all derived from them rather than tuned by eye.
const STRIKE = {
  stephen: { box_01:{ext:1.13, peak:0.28}, box_03:{ext:0.96, peak:0.27},
             front_kick_01:{ext:1.65, peak:0.55, yaw:-1.55}, front_kick_02:{ext:0.93, peak:0.63, yaw:-0.85} },
  chimp:   { box_01:{ext:1.28, peak:0.30}, box_03:{ext:1.14, peak:0.27},
             front_kick_02:{ext:0.83, peak:0.63, yaw:-0.85}, 'press-up':{ext:0.42, peak:0.60} },
  insect:  { Strike:{ext:2.61, peak:0.5} },          // keeps the insect's landing spot where it was
};
const HALF_DEPTH = { stephen:0.21, chimp:0.26, insect:1.1 };   // root to chest surface (insect estimated)
const LATERAL    = { stephen:0.7,  chimp:0.75, insect:1.2 };   // how far off the line still connects
const PEN = 0.1;                                               // how deep a landed blow sinks in
const bare = n => n.replace(/^preset:biped:/, '').replace(/\.001$/, '');
// Did a strike from `from` along `dir`, reaching `ext`, land on a body at `to`?
function contact(from, dir, ext, to, targetHalf, lateral) {
  const d = new THREE.Vector3().subVectors(to, from); d.y = 0;
  const along = d.dot(dir);
  const off = Math.hypot(d.x - dir.x*along, d.z - dir.z*along);
  return along > 0 && along < ext + targetHalf + 0.15 && off < lateral;
}
const PLAYER = {
  scale: 1.8, walk: 2.4, run: 5.6, back: 1.8, side: 3.8,
  hp: 100, reach: 3.6, damage: [12, 20],
};
const BUG = {
  scale: 2.2, walk: 1.7, hp: 420, lungeSpeed: 9.5, lungeDamage: 16, biteDamage: 22, reach: 3.2,
  // Round 2: it hits for more and knits itself back together. Regen sits BELOW what a player can
  // land (Stephen averages 16 a hit, about one a second), so pressing the attack really does
  // drive the bar down - it just stops at HP_FLOOR and climbs back the moment you breathe.
  // Hope, then the floor: that reads as a boss, where out-regenerating the player reads as a
  // health bar that ignores you.
  regen: 11, boss: { lungeDamage: 27, biteDamage: 27 },
};
// The chimp has biped clips, but not the insect-specific names.
const CHIMP_ANIM = {
  idle: C('idle'), walk: C('walk'),
  rear: C('box_02'),                              // the low crouching wind-up
  strike: C('box_01'),                            // default; strikeSet cycles
  strikeSet: ['box_01','box_03','front_kick_02','press-up'].map(C),
  bite: C('press-up'),                            // jumps at the face, grabs and pulls
  taunt: C('dance_05'),                           // a quick strut while Stephen cheers
  hurt: [C('hit_to_body_02'), C('hit_to_head')],  // it flinches when it is hit
  death: C('defeat_03'),
};
const INSECT_ANIM = {idle:'Idle', walk:'Walk', rear:'RearUp', strike:'Strike', strikeSet:['Strike'], taunt:'RearUp', hurt:null, death:'Death'};
const ENEMY_ANIM = opponent === 'chimp' ? CHIMP_ANIM : INSECT_ANIM;
const ENEMY_FILE = opponent === 'chimp' ? 'chimpanzee.glb' : 'insect_animated.glb';
const ENEMY_TAUNT = ENEMY_ANIM.taunt;
const FOE_NAME = opponent === 'chimp' ? 'Chimpanzee' : 'Warrior Bug';
document.getElementById('enemy-name').textContent = FOE_NAME;
const nextRound = () => { location.search = '?round=2' + (FORCE_GL1 ? '&gl1' : ''); };
const DMG = UNBEATABLE ? BUG.boss : BUG;
// MEASURED: sampling the skinned surface through defeat_03 at game scale, Stephen's lowest vertex
// ends 0.246 below the floor and the chimp's 0.274 - they lie in the concrete. The clip sinks
// gradually to its lowest at the very end, so the lift ramps in over the fall rather than popping
// the body up on the first frame.
const DEATH_LIFT = { stephen: 0.27, chimp: 0.30, insect: 0 };
const DEATH_RAMP = 1.6;
function liftBody(rig, who, elapsed) {
  rig.root.position.y = DEATH_LIFT[who] * Math.min(1, elapsed / DEATH_RAMP);
}
const ATTACKS = ['box_01','box_03','front_kick_01','front_kick_02'];
// The preset clips are performed at a leisurely pace; a fight wants them snappy. Rate scales the
// playback AND the state timer together, otherwise the state outlasts the animation and he stands
// frozen at the end of a swing.
const ATTACK_RATE = 1.7, HURT_RATE = 1.5;

// ── renderer ──────────────────────────────────────────────────────────────────
const FORCE_GL1 = Q.has('gl1');
let renderer;
if (FORCE_GL1) {
  const cv = document.createElement('canvas');
  renderer = new THREE.WebGLRenderer({ canvas: cv, context: cv.getContext('webgl', { antialias:true }) });
} else {
  renderer = new THREE.WebGLRenderer({ antialias:true });
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090d14);
scene.fog = new THREE.Fog(0x0a0e15, 26, 120);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 300);

scene.add(new THREE.HemisphereLight(0x8ea8bd, 0x10161d, 0.62));
const key = new THREE.DirectionalLight(0xfff2de, 2.5);
key.position.set(8, 14, 6); key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
const S = 16;
key.shadow.camera.left=-S; key.shadow.camera.right=S;
key.shadow.camera.top=S; key.shadow.camera.bottom=-S; key.shadow.camera.far=48;
key.shadow.bias=-0.0016;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6f9ac6, 1.5);
rim.position.set(-8,5,-7); scene.add(rim);

// platform
const plat = new THREE.Mesh(
  new THREE.CylinderGeometry(ARENA, ARENA*1.04, 0.7, 72),
  new THREE.MeshStandardMaterial({ color:0x2b333d, roughness:0.95 })
);
plat.position.y = -0.35; plat.receiveShadow = true; scene.add(plat);
const lip = new THREE.Mesh(
  new THREE.TorusGeometry(ARENA, 0.09, 10, 80).rotateX(Math.PI/2),
  new THREE.MeshStandardMaterial({ color:0x3b4a57, roughness:0.7, metalness:0.3 })
);
scene.add(lip);

// ── the stage ─────────────────────────────────────────────────────────────────
// Everything here is drawn into canvases at load time. No external images: the page already pulls
// two multi-megabyte models, and a fighting stage is mostly grime, windows and silhouettes, which
// a few dozen lines of 2D drawing does as well as a download would. Every canvas is a power of two
// so the textures still mipmap on WebGL 1.
function canvasTex(w, h, draw, repX = 1, repY = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX, repY);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const rand = (a, b) => a + Math.random() * (b - a);

// Poured concrete: slab seams, aggregate speckle, and stains that pool toward the joints.
const concrete = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#242a31'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26000; i++) {
    const v = Math.random();
    g.fillStyle = v > 0.5 ? 'rgba(210,225,240,0.035)' : 'rgba(0,0,0,0.10)';
    g.fillRect(Math.random()*w, Math.random()*h, 1 + (v > 0.97 ? 1 : 0), 1);
  }
  for (let i = 0; i < 16; i++) {                      // damp patches
    const x = Math.random()*w, y = Math.random()*h, r = rand(26, 90);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(10,13,17,0.42)'); gr.addColorStop(1, 'rgba(10,13,17,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.lineWidth = 3; g.strokeStyle = 'rgba(8,10,13,0.85)';    // slab joints
  for (const p of [0, 256]) { g.beginPath(); g.moveTo(p, 0); g.lineTo(p, h); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
  g.lineWidth = 1; g.strokeStyle = 'rgba(0,0,0,0.35)';      // hairline cracks
  for (let i = 0; i < 7; i++) {
    let x = Math.random()*w, y = Math.random()*h;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 6; k++) { x += rand(-34, 34); y += rand(-34, 34); g.lineTo(x, y); }
    g.stroke();
  }
}, 5, 5);

const platMat  = new THREE.MeshStandardMaterial({ map: concrete, color: 0x9aa3ad, roughness: 0.99 });
const platSide = new THREE.MeshStandardMaterial({ color: 0x232a31, roughness: 0.9 });
plat.material = [platSide, platMat, platSide];             // cylinder groups: side, top, bottom

// A worn paint ring where the two of them square up, sized to the stances.
const paint = new THREE.Mesh(
  new THREE.RingGeometry(3.9, 4.25, 96),
  new THREE.MeshStandardMaterial({ color:0x9a7d2c, roughness:1, transparent:true, opacity:0.55 })
);
paint.rotation.x = -Math.PI/2; paint.position.y = 0.012; scene.add(paint);

// Crowd: silhouettes on the inside of a cylinder. A ring of heads and shoulders reads as a packed
// crowd from every angle at a fraction of the cost of even one low-poly spectator.
const crowdTex = canvasTex(1024, 256, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  for (let row = 0; row < 3; row++) {
    const base = h + 8, shade = 11 + row * 9;                 // back rows lighter = further away
    for (let x = -30; x < w + 30; x += 21) {
      const cx = x + rand(-7, 7), hd = rand(9, 13);
      const sy = base - rand(86, 128) + row * 22;            // ragged heights, back rows shorter
      g.fillStyle = `rgb(${shade},${shade+2},${shade+6})`;
      g.beginPath(); g.arc(cx, sy, hd, 0, 7); g.fill();                           // head
      g.fillRect(cx - hd*0.5, sy, hd, hd*1.1);                                    // neck
      g.beginPath();                                                              // shoulders + torso
      g.moveTo(cx - hd*2.3, base);
      g.quadraticCurveTo(cx - hd*2.0, sy + hd*1.5, cx, sy + hd*1.4);
      g.quadraticCurveTo(cx + hd*2.0, sy + hd*1.5, cx + hd*2.3, base);
      g.fill();
      if (Math.random() < 0.10) {                                                 // a raised phone
        g.fillStyle = 'rgba(150,200,245,0.8)';
        g.fillRect(cx + rand(-18, 18), sy - rand(26, 44), 4, 7);
      }
    }
  }
}, 14, 1);
const crowd = new THREE.Mesh(
  new THREE.CylinderGeometry(21, 21, 5.6, 72, 1, true),
  new THREE.MeshBasicMaterial({ map:crowdTex, transparent:true, alphaTest:0.45, side:THREE.BackSide, fog:true })
);
crowd.position.y = 1.9; scene.add(crowd);

// Asphalt apron. Without it the drums and poles outside the deck stand in the void.
const apron = new THREE.Mesh(
  new THREE.CircleGeometry(46, 56).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({ map: concrete.clone(), color:0x4a5158, roughness:1 })
);
apron.material.map.repeat.set(20, 20); apron.material.map.needsUpdate = true;
apron.position.y = -0.72; scene.add(apron);

// City behind it. Lit windows are the whole effect, so they go straight in the colour map on an
// unlit material — the skyline is meant to be a backdrop, not something the key light touches.
const windows = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = '#070a10'; g.fillRect(0, 0, w, h);
  for (let y = 12; y < h - 10; y += 26) for (let x = 12; x < w - 10; x += 22) {
    const r = Math.random();
    if (r < 0.52) continue;
    g.fillStyle = r > 0.93 ? '#e8c777' : r > 0.78 ? '#9dbcd8' : '#4e6a86';
    g.globalAlpha = rand(0.35, 1);
    g.fillRect(x, y, 11, 15);
  }
  g.globalAlpha = 1;
});
const skyline = new THREE.Group(); scene.add(skyline);
for (let i = 0; i < 64; i++) {
  const back = i % 2 === 1;                       // two rings, so no gap opens onto bare sky
  const a = (i / 64) * Math.PI * 2 + rand(-0.06, 0.06);
  const r = back ? rand(84, 112) : rand(52, 72);
  const hgt = back ? rand(22, 60) : rand(11, 34), wid = back ? rand(12, 22) : rand(8, 15);
  const tex = windows.clone(); tex.needsUpdate = true;
  tex.repeat.set(Math.max(1, Math.round(wid / 7)), Math.max(1, Math.round(hgt / 14)));
  tex.offset.set(Math.random(), Math.random());
  const b = new THREE.Mesh(new THREE.BoxGeometry(wid, hgt, wid),
    new THREE.MeshBasicMaterial({ map: tex }));
  b.position.set(Math.sin(a) * r, hgt/2 - 3, Math.cos(a) * r);
  b.rotation.y = a;
  skyline.add(b);
}

// Floodlights, drums and crates crowded up against the platform edge.
const glowTex = canvasTex(64, 64, (g, w) => {
  const gr = g.createRadialGradient(w/2, w/2, 0, w/2, w/2, w/2);
  gr.addColorStop(0, 'rgba(255,238,200,0.95)'); gr.addColorStop(0.4, 'rgba(255,205,120,0.35)');
  gr.addColorStop(1, 'rgba(255,190,90,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
});
const steel = new THREE.MeshStandardMaterial({ color:0x2e363e, roughness:0.72, metalness:0.45 });
const rust  = new THREE.MeshStandardMaterial({ color:0x6d4028, roughness:0.95 });
const wood  = new THREE.MeshStandardMaterial({ color:0x4e3c26, roughness:1 });
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2 + 0.03, r = 20;     // beyond the crowd, so never in the way
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 13, 8), steel);
  pole.position.set(Math.sin(a)*r, 5.8, Math.cos(a)*r); scene.add(pole);
  const head = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.1, 0.6), steel);
  head.position.set(Math.sin(a)*r, 12, Math.cos(a)*r); head.rotation.y = a; scene.add(head);
  const lamp = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
  lamp.scale.setScalar(5.5); lamp.position.copy(head.position); scene.add(lamp);
}
for (let i = 0; i < 26; i++) {
  const a = Math.random() * Math.PI * 2, r = rand(14.5, 19.5);
  const drum = Math.random() < 0.55;
  const m = drum
    ? new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 1.15, 12), Math.random() < 0.5 ? rust : steel)
    : new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.1), wood);
  m.position.set(Math.sin(a)*r, -0.72 + (drum ? 0.58 : 0.55), Math.cos(a)*r);
  m.rotation.y = Math.random() * Math.PI;
  if (!drum && Math.random() < 0.4) { m.position.y += 1.1; m.rotation.y += 0.3; }
  m.castShadow = m.receiveShadow = true; scene.add(m);
}

// ── animation helper ──────────────────────────────────────────────────────────
// Add a distal mitten joint in the bind pose. Existing animation continues to
// control the knuckles; this extra joint curls the fingertips into the palm.
// The curl joints added below are held at -120 degrees so he makes a fist. That is right for
// punching and wrong for waving, which is why the celebration clips looked broken - so the angle
// is driven rather than fixed.
const curlTips = [];
function fistCurl(k) {
  const a = THREE.MathUtils.degToRad(-120 * k);
  for (const t of curlTips) t.rotation.x = a;
}
function closeStephenFists(model) {
  model.updateMatrixWorld(true);
  const fingers = ['L_Fingers', 'R_Fingers'].map(name => model.getObjectByName(name));
  for (const finger of fingers) {
    if (!finger) continue;
    const meshes = [];
    model.traverse(mesh => {
      if (mesh.isSkinnedMesh && mesh.skeleton.bones.includes(finger)) meshes.push(mesh);
    });
    const inverse = finger.matrixWorld.clone().invert();
    const point = new THREE.Vector3();
    let length = 0;
    for (const mesh of meshes) {
      const {position, skinIndex, skinWeight} = mesh.geometry.attributes;
      const index = mesh.skeleton.bones.indexOf(finger);
      for (let v = 0; v < position.count; v++) {
        let weight = 0;
        for (let k = 0; k < 4; k++) if (skinIndex.getComponent(v, k) === index) weight += skinWeight.getComponent(v, k);
        if (weight < 0.25) continue;
        point.fromBufferAttribute(position, v).applyMatrix4(mesh.matrixWorld).applyMatrix4(inverse);
        length = Math.max(length, point.y);
      }
    }
    if (length <= 0) continue;
    const tip = new THREE.Bone();
    tip.name = finger.name + '_Curl';
    tip.position.y = length * 0.5;
    finger.add(tip);
    model.updateMatrixWorld(true);
    const tipInverse = tip.matrixWorld.clone().invert();
    for (const mesh of meshes) {
      mesh.geometry = mesh.geometry.clone();
      const {position, skinIndex, skinWeight} = mesh.geometry.attributes;
      const skeleton = mesh.skeleton, index = skeleton.bones.indexOf(finger);
      const tipIndex = skeleton.bones.length;
      for (let v = 0; v < position.count; v++) {
        point.fromBufferAttribute(position, v).applyMatrix4(mesh.matrixWorld).applyMatrix4(inverse);
        const blend = THREE.MathUtils.smoothstep(point.y, length * 0.25, length * 0.62);
        const influences = [];
        let tipWeight = 0;
        for (let k = 0; k < 4; k++) {
          const bone = skinIndex.getComponent(v, k), weight = skinWeight.getComponent(v, k);
          const split = bone === index ? weight * blend : 0;
          tipWeight += split;
          influences.push({bone, weight:weight - split});
        }
        influences.push({bone:tipIndex, weight:tipWeight});
        influences.sort((a, b) => b.weight - a.weight);
        const total = influences.slice(0, 4).reduce((sum, item) => sum + item.weight, 0);
        if (!total) continue;
        for (let k = 0; k < 4; k++) {
          skinIndex.setComponent(v, k, influences[k].bone);
          skinWeight.setComponent(v, k, influences[k].weight / total);
        }
      }
      mesh.skeleton = new THREE.Skeleton([...skeleton.bones, tip], [...skeleton.boneInverses, tipInverse]);
      skinIndex.needsUpdate = skinWeight.needsUpdate = true;
    }
    tip.rotation.x = THREE.MathUtils.degToRad(-120);
    curlTips.push(tip);
  }
}

// STRIP ROOT MOTION. Tripo's clips travel: Stephen's walk moves the Hip 1.53 units over one
// cycle and his run 3.53, monotonically — and when the clip loops the Hip snaps back to the start,
// which is the teleport. The chimp's walk does the same (1.12). Attacks are fine; box_01 and
// box_03 return to where they began.
//
// The game decides where a character is, so a clip should only pose the bones. Hip translation is
// in the rig's own Z-up space — index 0 sideways, 1 forward/back, 2 height — so pin 0 and 1 to
// their first-frame value and leave 2 alone, which keeps bob, crouch, jump height and the fall in
// defeat_03.
function stripTravel(clip) {
  for (const tr of clip.tracks) {
    if (!/\.position$/.test(tr.name)) continue;
    if (!/(^|\.)(Hip|Root)\.position$/.test(tr.name)) continue;
    const v = tr.values;
    if (v.length < 6) continue;
    const x0 = v[0], y0 = v[1];
    for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i+1] = y0; }
  }
  return clip;
}

class Rig {
  constructor(gltf, scale, yaw) {
    this.root = new THREE.Group(); this.root.scale.setScalar(scale); scene.add(this.root);
    this.model = gltf.scene;
    this.model.rotation.y = yaw;
    this.model.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true; o.receiveShadow = true;
      o.frustumCulled = false;                       // skinned bounds go stale mid-clip
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of ms) if (m && m.map) m.map.colorSpace = THREE.SRGBColorSpace;
    });
    this.root.add(this.model);
    this.mixer = new THREE.AnimationMixer(this.model);
    this.clips = {};
    for (const c of gltf.animations) {
      const corrected = c.name === C('press-up');
      const entrance = c.name === A('swagger');
      const clip = c.clone();          // always clone: stripTravel edits track values in place
      if (entrance) clip.tracks = clip.tracks.filter(track => track.name !== 'Root.position');
      if (corrected) {
        // STAND THE PUSH-UP UP. Measured raw: the body lies horizontal with the Hip at its normal
        // standing height (0.305), head 0.29 forward of it, feet 0.27 behind, hands under the chest.
        // Pitching it 90 degrees about the HIP keeps the hip where it is, so the feet come down to
        // the floor and the hands swing out in front - the grab. An earlier version pitched the
        // Root instead, whose pivot is on the floor: that dropped the hip to ground level, put the
        // feet 0.27 under it and slid the whole body 0.3 back from its mark.
        const hip = clip.tracks.find(track => track.name === 'Hip.quaternion');
        if (hip) {
          const turn = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -Math.PI/2);
          const q = new THREE.Quaternion();
          for (let i = 0; i < hip.times.length; i++) {
            q.fromArray(hip.values, i * 4).premultiply(turn).toArray(hip.values, i * 4);
          }
        }
      }
      this.clips[clip.name] = this.mixer.clipAction(stripTravel(clip));
    }
    this.cur = null; this.curName = null;
  }
  has(n){ return !!this.clips[n]; }
  play(n, { fade=0.22, rate=1, once=false, force=false } = {}) {
    const a = this.clips[n];
    if (!a) return null;
    a.setEffectiveTimeScale(rate);
    if (this.cur === a && !force) return a;
    a.reset();
    // A REVERSED CLIP MUST START AT ITS END. reset() puts the playhead at 0, so with a negative
    // rate the very first update steps to -0.04 and wraps round to the end — meaning one frame
    // posed at the START of the walk (mid-stride, weight forward) before it snaps back. That one
    // frame is what reads as lurching forward before he backs up.
    if (rate < 0) a.time = a.getClip().duration;
    a.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, once ? 1 : Infinity);
    a.clampWhenFinished = once;
    a.setEffectiveWeight(1); a.play();
    if (this.cur) this.cur.crossFadeTo(a, fade, false);
    this.cur = a; this.curName = n;
    return a;
  }
  get dur(){ return this.cur ? this.cur.getClip().duration : 0; }
  freeze(){ this.mixer.stopAllAction(); this.cur = null; this.curName = null; }
}

// FIT THE PAIR TO THE VIEWPORT. A phone held upright has a horizontal field of view less than half
// a desktop's, so a distance that frames both fighters on a laptop puts them off the sides of a
// phone. Solve for the distance that fits their separation plus a margin in the HORIZONTAL fov,
// which is what actually constrains a side-on shot.
function fitDistance() {
  camera.fov = camera.aspect < 1 ? 62 : 48;
  camera.updateProjectionMatrix();
  const sep = Math.abs(ENEMY_END_Z - INTRO_END_Z) + 1.8;   // they close the gap, never widen it
  const vFov = camera.fov * Math.PI / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  return THREE.MathUtils.clamp((sep / 2) / Math.tan(hFov / 2) + 1.2, 4, 14);
}

function tryAttack(index) {
  if (phase !== 'fight' || P.dead || P.state === 'attack' || P.state === 'hurt') return;
  const n = ATTACKS[index];
  if (!n) return;
  const st = STRIKE.stephen[n];
  P.kickYaw = st.yaw || 0;
  if (P.kickYaw) hero.model.rotation.y += P.kickYaw;
  P.state = 'attack'; P.atk = n;
  const a = hero.play(A(n), { once:true, fade:0.07, rate:ATTACK_RATE, force:true });
  P.t = (a ? a.getClip().duration : 0.8) / ATTACK_RATE;
  P.dur = P.t;
  P.hitAt = P.t - P.t * st.peak;                   // fires when the fist is furthest out
  P.didHit = false;
  // DRIVE. The blow has to arrive at the other body, not at a radius. From the actual gap right
  // now, how much further than this swing's extension is the chest surface? Step that far in
  // on the way to the peak and back out afterwards, like a lunging jab.
  tmp.copy(bug.root.position).sub(hero.root.position); tmp.y = 0;
  P.drive = THREE.MathUtils.clamp(tmp.length() - HALF_DEPTH[opponent] + PEN - st.ext, 0, 1.4);
  P.driveDir = tmp.normalize().clone();
  P.driveFrom = hero.root.position.clone();
}

function damageBug(d) {
  if (B.dead) return;
  B.hp = Math.max(0, B.hp - d);
  B.hitFlash = 0.16;
  bug.model.traverse(o => { if (o.isMesh && o.material && o.material.emissive) {
    o.material.emissive.setHex(0x883322); o.material.emissiveIntensity = 1;
    setTimeout(()=>o.material.emissive.setHex(0x000000), 130); } });
  if (UNBEATABLE) B.hp = Math.max(B.hp, BUG.hp * HP_FLOOR);
  ehp.style.width = (100*B.hp/BUG.hp) + '%';
  // FLINCH. A hit interrupts whatever it was doing, including a committed swing, so trading blows
  // beats standing off. It does NOT interrupt a rear that is already past its tell - otherwise a
  // fast enough player denies the attack outright - and the cooldown is longer than the flinch
  // plus a wind-up, so a flurry cannot stun-lock it into a statue that never swings back.
  const committed = B.state === 'rear' && B.t < 0.32;
  if (B.hp > 0 && ENEMY_ANIM.hurt && B.hurtCd <= 0 && !committed && B.state !== 'victory') {
    if (B.kickYaw) { bug.model.rotation.y -= B.kickYaw; B.kickYaw = 0; }
    const n = ENEMY_ANIM.hurt[(Math.random() * ENEMY_ANIM.hurt.length) | 0];
    const a = bug.play(n, { once:true, fade:0.07, rate:HURT_RATE, force:true });
    B.state = 'hurt';
    B.t = (a ? a.getClip().duration * 0.45 : 0.4) / HURT_RATE;
    B.hurtCd = 2.0;
  }
  if (B.hp <= 0) {
    B.dead = true; B.state = 'dead';
    bug.play(ENEMY_ANIM.death, { once:true, fade:0.15 });
    setTimeout(()=>{ if (!P.dead) {
      if (round === 1) { say('ROUND 1 CLEARED', 'something worse is coming'); setTimeout(nextRound, 2600); }
      else say('BUG DOWN', 'you actually did it');
    } }, 900);
  }
}
function damageHero(d) {

  if (P.kickYaw) { hero.model.rotation.y -= P.kickYaw; P.kickYaw = 0; }
  P.hp = Math.max(0, P.hp - d);

    say('DEFEATED', UNBEATABLE ? 'nothing beats the bug' : 'reload to try again');

}

// ── the intro ─────────────────────────────────────────────────────────────────
function cine(dt) {
  cineT += dt; window.__cineT = cineT;
  const t = cineT;
  // He walks on from the very start and the camera keeps him in frame throughout — an opening
  // that orbits the bug alone reads as spinning around an empty patch of floor.
  const walkK = Math.min(1, t/WALK_T), we = walkK*walkK*(3-2*walkK);
  if (t < WALK_T) {
    hero.root.position.z = THREE.MathUtils.lerp(INTRO_START_Z, INTRO_END_Z, we);
    // the opponent squares up from the far side on the same beat
    bug.root.position.z = THREE.MathUtils.lerp(ENEMY_START_Z, ENEMY_END_Z, we);
    bug.root.rotation.y = Math.PI;
    bug.play(ENEMY_ANIM.walk, { fade:0.3, rate:WALK_RATE });
    hero.play(A('swagger'), { fade:0.3, rate:WALK_RATE });
  } else {
    // ON THE MARK. He cheers, the opponent shows off, and neither keeps walking on the spot.
    hero.root.position.z = INTRO_END_Z;
    bug.root.position.z = ENEMY_END_Z;
    // `cheer` is 12s of arm-waving; at this rate the beat shows only its opening lift.
    hero.play(A('cheer'), { fade:0.18, rate:CHEER_RATE, once:true });
    fistCurl(0);                                   // open hands to wave, fists for the fight
    bug.play(ENEMY_TAUNT, { fade:0.2, rate:1.5, once:true });
  }

  const between = tmp.copy(bug.root.position).add(hero.root.position).multiplyScalar(0.5);
  const line = new THREE.Vector3().subVectors(hero.root.position, bug.root.position);
  line.y = 0; line.normalize();
  const side = new THREE.Vector3(-line.z, 0, line.x);
  const behind = bug.root.position.clone().addScaledVector(line, -6).setY(2.9);
  const br = Math.hypot(behind.x, behind.z);
  if (br > ARENA + 2) { behind.x *= (ARENA+2)/br; behind.z *= (ARENA+2)/br; }
  const sideView = between.clone().addScaledVector(side, cameraDistance).setY(2.8);
  if (t < WALK_T * 0.55) {
    // Approach from behind the chimp, with the camera looking down the line
    // between the fighters as Stephen walks into the arena.
    camera.position.copy(behind);
    camera.lookAt(between.x, 1.2, between.z);
    if (t < 0.1) say('ROUND ' + round, FOE_NAME);
    if (t > WALK_T*0.45) hide();
  } else if (t < INTRO_DURATION) {
    // Move to a side-on position and aim directly at the space between them.
    const k = Math.min(1,(t - WALK_T*0.55)/(WALK_T*0.45)), e = k*k*(3-2*k);
    camera.position.lerpVectors(behind, sideView, e);
    camera.lookAt(between.x, 1.2, between.z);
  } else {
    endCine();
  }
}
function endCine() {
  if (phase !== 'cine') return;
  phase = 'fight';
  hide(); hud.classList.add('on');
  // Let the walk-on finish where it stands if it ran to the end; if the intro was skipped part
  // way, put both on their marks. (Resetting unconditionally made Stephen teleport backward at
  // the handoff when the intro played out.)
  if (cineT < INTRO_DURATION) {
    hero.root.position.set(0, 0, INTRO_END_Z);
    bug.root.position.set(0, 0, ENEMY_END_Z);
    bug.root.rotation.y = Math.PI;
    bug.play(ENEMY_ANIM.idle, { fade:0.15 });
    cameraDistance = fitDistance();
  }
  hero.root.rotation.y = 0;
  fistCurl(1);                                     // back to fists for the fight
  hero.play(A('idle'), { fade:0.2 });
  P.home = hero.root.position.clone();
  P.state = 'idle';
  say('FIGHT', '');
  setTimeout(hide, 1100);
}

// ── the player ────────────────────────────────────────────────────────────────
const ndc = new THREE.Vector3();
const fwd = new THREE.Vector3(), tmp = new THREE.Vector3(), dodgeAxis = new THREE.Vector3(), dodgeTarget = new THREE.Vector3();
function player(dt) {
  if (P.dead) { P.deadT += dt; liftBody(hero, 'stephen', P.deadT); return; }
  if (P.invuln > 0) P.invuln -= dt;

  // This is a one-dimensional fighter: the opponents stay squared up instead
  // of turning away while moving around the arena.
  if (!B.dead) {
    tmp.copy(bug.root.position).sub(hero.root.position); tmp.y = 0;
    const want = Math.atan2(tmp.x, tmp.z);
    let dY = want - hero.root.rotation.y;
    while (dY > Math.PI) dY -= Math.PI * 2;
    while (dY < -Math.PI) dY += Math.PI * 2;
    hero.root.rotation.y += Math.sign(dY) * Math.min(Math.abs(dY), 5.0 * dt);
  }

  if (P.state === 'attack' || P.state === 'hurt') {
    P.t -= dt;
    if (P.state === 'attack' && P.drive > 0) {
      // in to the peak, out over the rest
      const peakT = P.dur - P.hitAt, el = P.dur - P.t;
      const k = el < peakT ? el / peakT : Math.max(0, 1 - (el - peakT) / Math.max(0.05, P.hitAt));
      hero.root.position.copy(P.driveFrom).addScaledVector(P.driveDir, P.drive * k);
    }
    if (P.state === 'attack' && !P.didHit && P.t <= P.hitAt) {
      P.didHit = true;
      fwd.set(0,0,1).applyQuaternion(hero.root.quaternion);
      if (contact(hero.root.position, fwd, STRIKE.stephen[P.atk].ext, bug.root.position, HALF_DEPTH[opponent], LATERAL.stephen)) {
        damageBug(PLAYER.damage[0] + Math.random()*(PLAYER.damage[1]-PLAYER.damage[0]));
      }
    }
    if (P.t <= 0) {
      if (P.kickYaw) hero.model.rotation.y -= P.kickYaw;
      P.kickYaw = 0;
      P.state = 'idle';
    }
    return;
  }

  dodgeAxis.set(0,0,0);
  const midpoint = tmp.copy(hero.root.position).add(bug.root.position).multiplyScalar(0.5);
  const dodgeKey = keys['KeyW'] ? 'KeyW' : keys['KeyS'] ? 'KeyS' : keys['KeyD'] ? 'KeyD' :
    performance.now() < P.dodgeUntil ? P.dodgeKey : null;
  if (dodgeKey === 'KeyW' || dodgeKey === 'KeyS') {
    dodgeAxis.copy(midpoint).sub(camera.position).setY(0).normalize();
    if (dodgeKey === 'KeyS') dodgeAxis.negate();
  } else if (dodgeKey === 'KeyD') {
    dodgeAxis.copy(hero.root.position).sub(bug.root.position).setY(0).normalize();
  }
  if (dodgeAxis.lengthSq() > 0) {
    dodgeTarget.copy(P.home).addScaledVector(dodgeAxis, 2.1);
    hero.root.position.lerp(dodgeTarget, 1 - Math.pow(0.0001, dt));
    if (P.state !== 'dodge') {
      const jump = hero.play(A('jump'), { once:true, fade:0.1 });
      P.dodgeAnimT = jump ? jump.getClip().duration : 0;
    } else if (P.dodgeAnimT > 0) {
      P.dodgeAnimT -= dt;
    } else {
      hero.play(A('idle'), { fade:0.2 });
    }
    P.state = 'dodge';
  } else {
    hero.root.position.lerp(P.home, 1 - Math.pow(0.0001, dt));
    if (P.state === 'dodge' && P.dodgeAnimT > 0) {
      P.dodgeAnimT -= dt;
    } else {
      P.dodgeAnimT = 0;
      hero.play(A('idle'), { fade:0.2 }); P.state = 'idle';
    }
  }
}

// ── the bug ───────────────────────────────────────────────────────────────────
function bugAI(dt) {
  if (B.hurtCd > 0) B.hurtCd -= dt;
  if (B.dead) { B.deadT += dt; liftBody(bug, opponent, B.deadT); return; }
  if (UNBEATABLE && B.hp < BUG.hp) {               // it knits itself back together
    B.hp = Math.min(BUG.hp, B.hp + BUG.regen * dt);
    ehp.style.width = (100*B.hp/BUG.hp) + '%';
  }
  if (B.hitFlash > 0) B.hitFlash -= dt;
  B.t -= dt;

  tmp.copy(hero.root.position).sub(bug.root.position); tmp.y = 0;
  const dist = tmp.length();
  const toHero = tmp.clone().normalize();

  const want = Math.atan2(toHero.x, toHero.z);
  let dY = want - bug.root.rotation.y;
  while (dY > Math.PI) dY -= Math.PI*2;
  while (dY < -Math.PI) dY += Math.PI*2;
  bug.root.rotation.y += Math.sign(dY) * Math.min(Math.abs(dY), 4.0 * dt);

  switch (B.state) {
    case 'hurt':
      if (B.t <= 0) { B.state = 'idle'; B.t = 0.5 + Math.random()*0.7; bug.play(ENEMY_ANIM.idle, { fade:0.15 }); }
      break;
    case 'victory': {
      // Walk over and dance on the spot where he fell. This has to be tighter than the 1.6 they
      // fight at, or the approach never happens and it just dances where it stood.
      const close = 1.05;
      if (dist > close) {
        bug.root.position.x += toHero.x * BUG.walk * 1.35 * dt;
        bug.root.position.z += toHero.z * BUG.walk * 1.35 * dt;
        bug.play(ENEMY_ANIM.walk, { fade:0.25, rate:1.35 });
      } else {
        bug.play(ENEMY_ANIM.taunt, { fade:0.3, rate:1.0 });
      }
      break;
    }
    case 'idle':
      bug.play(ENEMY_ANIM.idle);
      if (B.t <= 0) { B.state='rear'; B.t = 0.85; bug.play(ENEMY_ANIM.rear, { once:true, fade:0.12, rate:1.45 }); }
      break;
    case 'stalk': {
      // Compatibility state for older debug state. The chimp stays at its
      // mark instead of walking through Stephen.
      B.state='idle'; B.t = 1 + Math.random(); bug.play(ENEMY_ANIM.idle);
      break;
    }
    case 'rear':
      // Late in the tell, glide half a step toward the hero — a visible commit
      // that gives the player a beat to move.
      if (B.t < 0.30) {
        const step = 0.83 * dt;             // ~0.25u over the final 0.3s
        bug.root.position.x += toHero.x * step;
        bug.root.position.z += toHero.z * step;
      }
      if (B.t <= 0) {
        const set = ENEMY_ANIM.strikeSet;
        const pick = set[(Math.random() * set.length) | 0];
        B.bite = pick === ENEMY_ANIM.bite;
        B.strike = STRIKE[opponent][bare(pick)];
        const rate = B.bite ? 1.3 : 1.55;
        const a = bug.play(pick, { once:true, fade:0.08, rate, force:true });
        // The blow registers at the clip's measured peak; the state lasts just past it.
        B.hitAt = (a ? a.getClip().duration : 1) / rate * B.strike.peak;
        B.lungeDur = B.hitAt + 0.12;
        B.state='lunge'; B.t = B.lungeDur; B.lunged = false;
        B.dir = toHero.clone();
        B.jumpFrom = bug.root.position.clone();
        // Land where this strike's extension meets Stephen's chest - never backing up to do it.
        const gapNow = dist, want = B.strike.ext - PEN + HALF_DEPTH.stephen;
        B.jumpTo = hero.root.position.clone().addScaledVector(B.dir, -Math.min(gapNow, want));
        B.kickYaw = B.strike.yaw || 0;
        if (B.kickYaw) bug.model.rotation.y += B.kickYaw;
      }
      break;
    case 'lunge': {
      // arrive by the peak, then hold
      const progress = Math.min(1, (B.lungeDur - B.t) / B.hitAt);
      bug.root.position.lerpVectors(B.jumpFrom, B.jumpTo, progress);
      // Punches stay on the ground; the insect leaps; the chimp's bite is a low jump at the face.
      const arc = opponent !== 'chimp' ? 1.35 : B.bite ? 0.55 : 0;
      bug.root.position.y = Math.sin(progress * Math.PI) * arc;
      if (!B.lunged && B.lungeDur - B.t >= B.hitAt) {
        B.lunged = true;
        // it connects only if the player is still on the line - stepping aside beats it
        if (contact(bug.root.position, B.dir, B.strike.ext, hero.root.position, HALF_DEPTH.stephen, LATERAL[opponent]))
          damageHero(DMG[B.bite ? 'biteDamage' : 'lungeDamage']);
      }
      if (B.t <= 0) {
        if (B.kickYaw) { bug.model.rotation.y -= B.kickYaw; B.kickYaw = 0; }
        bug.root.position.copy(B.jumpTo).setY(0);
        B.returnFrom = bug.root.position.clone();
        B.returnTo = B.home.clone();
        B.state='return'; B.t = 0.5;
      }
      break;
    }
    case 'return': {
      const progress = Math.min(1, 1 - B.t / 0.5);
      bug.root.position.lerpVectors(B.returnFrom, B.returnTo, progress);
      if (B.t <= 0) {
        bug.root.position.copy(B.home);
        B.state='idle'; B.t = 1.1 + Math.random()*1.4;
      }
      break;
    }
  }
  const r = Math.hypot(bug.root.position.x, bug.root.position.z);
  if (r > ARENA-1.2) { bug.root.position.x *= (ARENA-1.2)/r; bug.root.position.z *= (ARENA-1.2)/r; }


}

// ── camera during the fight ───────────────────────────────────────────────────
const camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3();
function fightCam(dt) {
  const mid = tmp.copy(hero.root.position).add(bug.root.position).multiplyScalar(0.5);
  const line = new THREE.Vector3().subVectors(hero.root.position, bug.root.position);
  line.y = 0;
  if (line.lengthSq() < 1e-4) line.set(0,0,1);
  line.normalize();
  // Keep the camera beside the line between them, aimed at their midpoint.
  const side = new THREE.Vector3(-line.z, 0, line.x);
  side.applyAxisAngle(new THREE.Vector3(0,1,0), camYaw);
  const tall = camera.aspect < 1;
  camGoal.copy(mid).addScaledVector(side, cameraDistance).setY(tall ? 3.5 : 2.8);
  lookGoal.set(mid.x, tall ? 1.45 : 1.25, mid.z);
  camera.position.lerp(camGoal, 1 - Math.pow(0.0016, dt));
  camera.lookAt(lookGoal);

  // Put each health bar on the side of the screen its fighter is actually on. Project both roots
  // and compare; a right-drag that spins the camera past them flips the pair.
  camera.updateMatrixWorld();
  ndc.copy(hero.root.position).project(camera);
  const heroX = ndc.x;
  ndc.copy(bug.root.position).project(camera);
  hud.classList.toggle('swap', heroX < ndc.x);
}

window.__heroPos = () => hero ? {
  x:+hero.root.position.x.toFixed(3), z:+hero.root.position.z.toFixed(3),
  yaw:+hero.root.rotation.y.toFixed(3), st:P.state, clip:hero.curName,
  bx:+bug.root.position.x.toFixed(2), bz:+bug.root.position.z.toFixed(2), bst:B.state,
  ct: hero.cur? +hero.cur.time.toFixed(3):null, ts: hero.cur? hero.cur.timeScale:null,
  w: hero.cur? +hero.cur.getEffectiveWeight().toFixed(2):null
} : null;
// Headless test hook: ?probe lets a harness drive damage directly.
if (Q.has('probe')) Object.assign(window, { damageBug, damageHero, P, B, BUG, rigs:()=>({hero,bug}) });

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (phase === 'cine') cine(dt);
  else {
    player(dt); bugAI(dt);
    // SEPARATION, both ways. The bug is 2.2 across and Stephen 1.8, so anything under ~3 has them
    // standing inside each other. Pushing only the bug (as a first pass did) lets the player walk
    // straight through it.
    tmp.copy(hero.root.position).sub(bug.root.position); tmp.y = 0;
    const gap = tmp.length(), MIN = MIN_GAP;
    if (B.state !== 'lunge' && B.state !== 'rear' && B.state !== 'return' && gap > 1e-4 && gap < MIN) {
      const push = tmp.normalize().multiplyScalar((MIN - gap) * 0.5);
      if (!B.dead) bug.root.position.sub(push);
    }
    fightCam(dt);
  }
  hero.mixer.update(dt);
  bug.mixer.update(dt);
  window.__dbg = { phase, round, unbeatable:UNBEATABLE, bhp:B.hp, bmax:BUG.hp, php:P.hp, bdead:B.dead, dist:cameraDistance, aspect:camera.aspect, bstate:B.state, bt:B.t, bhit:B.hitAt, blen:B.lungeDur, pstate:P.state, pt:P.t, phit:P.hitAt, patk:P.atk, gap:Math.hypot(hero.root.position.x-bug.root.position.x, hero.root.position.z-bug.root.position.z),
    heroZ:hero.root.position.z, bugZ:bug.root.position.z,
    cam:[camera.position.x, camera.position.y, camera.position.z] };
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  if (!zoomedByUser) cameraDistance = fitDistance();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
