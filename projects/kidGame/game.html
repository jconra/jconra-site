function newImg(src) {
    var img = document.createElement("img");
    img.src = src;
    return img;
  }

function init() {
  if (levels[currentLevel].data.length < ch)
    can.height = ch = levels[currentLevel].data.length*32;
  fixObjImgs();
  animate();
}

function fixObjImgs() {
  for (var i=0, len=objects.length; i<len; i++) {
    for (var j=0, jlen=objects[i].sequences.length; j<jlen; j++) {
      var seq = objects[i].sequences[j];
      for (var k=0, klen=seq.frames.length; k<klen; k++) {
        seq.frames[k] = document.createElement("img");
        seq.frames[k].src = seq.src[k];
      }
    }
  }
}

function animate() {
  var key, obj;
  window.requestAnimationFrame(animate);
  for (var i=0, len=objects.length; i<len; i++) {
    obj = objects[i];
    if (keys.length > 0 && counter == 0)
      obj.cFrame = (obj.cFrame +1)%obj.sequences[obj.cSeq].frames.length;
    for (var j=0, jlen=obj.keys.length; j<jlen; j++) {
      key = obj.keys[j];
      if (keys.indexOf(key.code) > -1) {
        if (key.field === "vx") {
          if (key.op === "+") flip = false;
          else flip = true;
        }
      }
      if (keys.indexOf(key.code) > -1) {
        if (key.amount == "jump") {
          if (repeat == key.code) continue;
          repeat = key.code;
          if ((solid(obj, 0, 1, 1, 20)) || (solid(obj, 1, 1, -1, 20)))
            obj.jumpPower = obj.jump*2;
          else continue;
        } 
        switch (key.op) {
          case ("+"): obj[key.field] += obj[key.amount]; break;
          case ("-"): obj[key.field] -= obj[key.amount]; break;
        }
      }
      processMovement(obj,key);
    }
  }
  draw();
}

function processMovement(obj,key) {
  obj.x += obj.vx;
  obj.y += obj.vy;
  if (obj.jumpPower > 0) {
    obj.vy -= obj.jumpPower;
    obj.jumpPower -= 5;
    console.log(obj.jumpPower);
  }
  if (levels[currentLevel].gravity) obj.vy += obj.gravity
  obj.vx *= obj.friction;
  if (Math.abs(obj.vx) > obj.speed) obj.vx = Math.abs(obj.vx)/obj.vx*obj.speed;
  if (Math.abs(obj.vy) > obj.speed) obj.vy = Math.abs(obj.vy)/obj.vy*obj.speed;

    if (obj.vy > 0 && (solid(obj, 0, 1, 4, 0) || solid(obj, 1, 1, -4, 0))) {

      obj.vy = 0;
    }
    if (obj.vx < 0 && (solid(obj, 0, 0, 0, 4) || solid(obj, 0, 1, 0, -4)) || obj.x < 2) {
      obj.x -= obj.vx;
      obj.vx = 0;
    }
    if (obj.vx > 0 && (solid(obj, 1, 0, 0, 4) || solid(obj, 1, 1, 0, -4) || 
                      obj.x > levels[currentLevel].data[0].length*32 -32)) {
      obj.x -= obj.vx;
      obj.vx = 0;
    }
  } catch(err) {}
  var lvl = levels[currentLevel];
  var xpos = obj.x - lvl.xScroll;
  if (xpos > cw*3/4 && lvl.xScroll < (lvl.data[0].length*32 - cw)) lvl.xScroll += xpos - cw*3/4;
  else if (xpos < cw/4 && lvl.xScroll > 0) lvl.xScroll -= cw/4 - xpos;
}

function solid(obj,x,y,mx,my) {
  try {
  var g = {"x":Math.floor((obj.x+mx)/32),"y":Math.floor((obj.y+my)/32)};
  var brushIndex = levels[currentLevel].data[g.y+y][g.x+x]-1;
  if (brushIndex < 0) return false;
  if (brushes[brushIndex].solid) return true;
  return false;
  } catch(e) {}
}

function draw() {
  var lvl = levels[currentLevel];
  var gridHeight = lvl.data.length;
  var gridWidth = lvl.data[0].length;
  var heightDiff = ch-gridHeight*32;
  var grd = ctx.createLinearGradient(0,heightDiff,0,ch);
  grd.addColorStop(0,lvl.bgColor1);
  grd.addColorStop(1,lvl.bgColor2);
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,cw,ch);
  for (var i=0; i<gridHeight; i++) {
    for (var j=0; j<gridWidth; j++) {
      brushIndex = lvl.data[i][j];
      if (brushIndex > 0)
      ctx.drawImage(brushes[brushIndex-1].img,j*32-lvl.xScroll,i*32+heightDiff);
    }
  }
  var o;
  for (var i=0, len=objects.length; i<len; i++) {
    o = objects[i];
    drawImage(o.sequences[o.cSeq].frames[o.cFrame],o.x-lvl.xScroll,o.y+heightDiff,32,32,0,flip);
  }
}

function drawImage(img, x, y, width, height, deg, flip, flop, center) {
  ctx.save();

  if(typeof width === "undefined") width = img.width;
  if(typeof height === "undefined") height = img.height;
  if(typeof center === "undefined") center = false;

  // Set rotation point to center of image, instead of top/left
  if(center) {
    x -= width/2;
    y -= height/2;
  }

  // Set the origin to the center of the image
  ctx.translate(x + width/2, y + height/2);

  // Rotate the canvas around the origin
  var rad = 2 * Math.PI - deg * Math.PI / 180;   
  ctx.rotate(rad);

  // Flip/flop the canvas
  if(flip) flipScale = -1; else flipScale = 1;
  if(flop) flopScale = -1; else flopScale = 1;
  ctx.scale(flipScale, flopScale);

  // Draw the image    
  ctx.drawImage(img, -width/2, -height/2, width, height);
  ctx.restore();
}

init();

window.addEventListener( "keydown", function(e){
  if (keys.indexOf(e.keyCode) == -1) keys.push(e.keyCode);
  }, false );

window.addEventListener( "keyup", function(e){
  if (repeat == e.keyCode) repeat = 0;
  keys.splice(keys.indexOf(e.keyCode),1);
  }, false );

</script>
