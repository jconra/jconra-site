<!DOCTYPE html>
<html lang="en">
<head>
<style>
body {background-color:#69b5d5;}
svg {position:fixed; top:0px; left:0px; z-index:10;}
#msg {position:fixed; width:100%; z-index:8200; font-family: 'Comic Sans MS'; font-size: 50px; border-radius:10px;}
.text {position:fixed; top:5px; right:150px; color:yellow; z-index:9; font-family:'Comic Sans MS'; font-size:20px; z-index:999;}
#vBar {top:5px; right:220px; z-index:1000;
  position: fixed;
  transform: scale(2.5);
  transform-origin: 0 0;
}
</style>
</head>
<body style="margin:0px; overflow:hidden;" onload="init()">
<div id="msg"></div>
<div id="vol" class="text" style="right:30px; top:50px;">Volume</div>
<input type="range" id="vBar" min="0" max="0.2" step="0.01" value="0.05"/>
<div id="score" class="text" style="left:20px;">Score: 0</div>
<div id="bonusscore" class="text" style="left:45%; color:blue;">Bonus: 200</div>
<svg width="100%" height="100%" style="z-index:0;">
  <rect x="0" y="50%" width="100%" height="50%" fill="white">
</svg>
<script>
let w = window.innerWidth;
let h = window.innerHeight;
const BOX = 100;
const svgNS = "http://www.w3.org/2000/svg";
const characters = [];
const dirtySnow = [];
const mouse = {x:0, y:0};
const start = (new Date()).getTime();
const msg = {text:"", clear:9999999999999};
const keys = [];
const answers = [];
const NUM_OF_ANSWERS = 5;
const SPEED = 10;
const BPM = 0.5
let lastScheduled = -1;
let audioCtx;
let volume = 0.05;
let ufo, beam = undefined;
let selected = -1;
let snow = undefined;
let gameStep = 0;
let bonusScore = 200;
let score = 0;

function animate() {
  if (bonusScore > 0) {
    if (answers.length > 0 && beam == undefined) bonusScore -= 0.5;
    document.getElementById("bonusscore").innerHTML = "Bonus: " + Math.floor(bonusScore);
  } else document.getElementById("bonusscore").innerHTML = "";
  processCharacterMovement();
  processGameActions();
  if (audioCtx && volume > 0) playSong();
  requestAnimationFrame(animate);
}

function processGameActions() {
  if (msg.text.length == 0) {
    if (gameStep == 0 && selected == -1)
      sendMessage({y:50, text:"Pick Your Character", len:99000, size:70, color:"yellow"});
    else if (gameStep == 1)
      sendMessage({x:w/2,y:70,text:"Do you see any intelligent life?",len:1500,size:30,color:'black'});
    else if (gameStep == 2)
      sendMessage({x:w/2-400,y:70,text:"I don't see any.",len:1000,size:30,color:'black'});
    else if (gameStep == 3)
      sendMessage({x:w/2,y:70,text:"Mark this world for destruction.",len:1500,size:30,color:'black'});
    else if (gameStep == 4)
      sendMessage({x:w/2-400,y:70,text:"Wait. I will test these creatures.",len:1500,size:30,color:'black'});
    else if (gameStep == 5)
      createQuestions();
    else if (gameStep == 6)
      sendMessage({x:w/2-200,y:70,text:"This human is showing signs of intelligence.",len:2000,size:30,color:'black'});
    else if (gameStep == 7)
      sendMessage({x:w/2-400,y:70,text:"I will give them more questions",len:2000,size:30,color:'black'});
    else if (gameStep == 8)
      createQuestions();
    if (ufo.z > 0.5) gameStep += 1;
  }
  moveUFO();
  if (msg.text.length > 0 && (new Date()).getTime() > msg.clear) sendMessage({});
}

function createQuestions() {
  const colors = shuffleArray(["red", "purple", "magenta", "blue", "orange"]);
  for (answer of answers) removeAnswer();
  const tempNums = [];
  while (tempNums.length < NUM_OF_ANSWERS) {
    const n1 = rn(2,9);
    const n2 = rn(2,9);
    if (tempNums.indexOf(n1*n2) == -1) {
      let index = answers.length;
      tempNums.push(n1*n2);
      answers.push(createAnswer(n1*n2, n1+" x "+n2, colors[index%colors.length]));
    }
  }
  sendMessage({x:20,y:20,text:answers[0].text,size:60});
}

//Returns a potential answer location (not hidden by trees or other numbers). It checks to
//Make sure the character is not standing on one and gets it wrong right away.
function getLocation() {
  let count = 0;
  const svgs = document.querySelectorAll('svg');
  while (count++ < 1000) {
    let x = 50 + Math.floor(Math.random() * (w-100));
    let z = 0.7 + Math.random()* 0.8;
    let s = 150 * z;
    if (isPointUnderSVG(x, z * 1000, s, svgs) == false) return [x, z];
  }
  console.log(count);
  return [w / 6 * answers.length, 1];
}

//This checks a random point by looping through the list of trees and checking thier
//bounding rectangle to see if it is covered by the tree. If not then it can be used
function isPointUnderSVG(x, z, s, svgs) {
  for (let i = 0; i < svgs.length; i++) {
	  if (svgs[i].id == "dirtysnow") continue;
    let b = svgs[i].children[0].getBoundingClientRect();
    //If spot is not in the same x coordinates it is good, so continue to the next
    if (b.x > (x + s/2) || (b.x + b.width) < (x - s/2)) continue
		//If the svg is another number (and has show x-overlap) it is no good
    if (svgs[i].id == 'num') return true;
      //If spot is behind the tree (this allows the point to be in front of trees)
    if (z - 50 < svgs[i].style["z-index"]) return true;
  }
  return false;
}

function createAnswer(n, text, color) {
  const loc = getLocation();
  const num = new SVG3d({'num':[]}, loc[0], 0, loc[1], 150, 150);
  num.svg.innerHTML='<text x="50" y="100" text-anchor="middle" dominant-baseline="middle" fill="'+color+'" font-family="Comic Sans MS" font-size="100" style="cursor: pointer">'+n+'</text>';
  num.update();
  num.value = n;
  num.text = text;
  return num;
}

function removeAnswer() {
  removeSVG(answers[0].svg);
  answers.splice(0,1);
}

function removeSVG(svg) {svg.parentElement.removeChild(svg);}

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    array.push(array.splice(Math.floor(Math.random()*array.length),1)[0])
  }
  return array;
}

function sendMessage(options) {
  const msgBox = document.getElementById('msg');
  if ('x' in options) {
    msgBox.style['left'] = options.x+'px';
    msgBox.style['text-align'] = 'left';
  } else {
    msgBox.style['left'] = '0px';
    msgBox.style['text-align'] = 'center';
  }
  if ('y' in options) msgBox.style['top'] = options.y+'px';
  msgBox.innerHTML = msg.text = ('text' in options)? options.text:"";
  msg.clear = (new Date()).getTime() + (('len' in options)? options.len : 9999999);
  if ('size' in options) msgBox.style['font-size'] = options.size + 'px';
  if ('color' in options) msgBox.style['color'] = options.color;
  if ('back' in options) msgBox.style['background-color'] = options.back;
  else msgBox.style['background-color'] = 'transparent';
  msgBox.style['width'] = ('width' in options)? options.width+"px":"100%";
}

function characterPicked(n) {
  for (let i=0; i<characters.length; i++) {
    characters[i].speed = 15;
    if (i != n) {
      const newX = (characters[i].x < w/2)? -200 : w + 200;
      characters[i].goal = {x:newX, z:0.68};
    }
  }
  selected = n;
  if (gameStep == 0) sendMessage({});
}

function processCharacterMovement() {
  for (let i=0; i<characters.length; i++) {
    const c = characters[i];
    if (i == selected) {
      const answer = isOnAnswer(c)
      if (answer) characterOnAnswer(c, answer);
      else characterNotOnAnswer(c);
    }
    c.process();
  }
  
  if (keys.length > 0 && selected > -1 && characters[selected].enabled) {
    let c = characters[selected];
    if (keys.indexOf('w') > -1) {if (c.z > 0.5) c.z -= c.speed/2000;}
    if (keys.indexOf('a') > -1) {if (c.x > 0) c.x -= c.speed/2;}
    if (keys.indexOf('s') > -1) {if (c.z < 1.5) c.z += c.speed/2000;}
    if (keys.indexOf('d') > -1) {if (c.x < w) c.x += c.speed/2;}
    c.goal = {x:c.x, y:c.y, z:c.z};
		c.svg.setAttribute('transform', "rotate("+((c.counter/2)%3 - 1)+",0,0)");
    c.update();
    if (Math.random() > 0.8) dropDirtySnow(c);
  }
}

function dropDirtySnow(c) {
  const rand = Math.floor(230 + Math.random()*20);
  const color = 'rgba('+ rand + ',' + rand + ',' + rand + ', 0.3'
  const x = c.x + Math.random()*30-15;
  const y = 320 * c.z - 90;
  dirtySnow.push(new SVG3d({'dirtysnow':[color]}, x, y, c.z - 0.05, 300, 300));
}

function characterOnAnswer(c, answer) {
  characters[selected].frown();
  if (c.parts[2][0].indexOf('body') > -1) {
    c.parts[2][0] = (c.parts[2][0].indexOf('fat') == 0)? "fatarmsup":"armsup";
    c.draw();
    answer.y -= 150 * answer.z;
    answer.update();
  } else {
    if (beam == undefined)
      beam = new SVG3d({'beam':[]}, ufo.x, ufo.y-32, ufo.z-0.002, 300, h*0.5);
    if (distance({x:c.x, y:c.z*1000},{x:ufo.x,y:ufo.z*1000}) < 50) {
      checkAnswer(answer);
		}
  }
}

function characterNotOnAnswer(c) {
  if (c.parts[2][0].indexOf('armsup') > -1) {
    c.parts[2][0] = (c.parts[2][0].indexOf('fat') == 0)? "fatbody":"body";
    c.draw();
    for (let ans of answers) {
      ans.y = 0;
      ans.update();
    }
    if (beam) removeBeam();
  }
}

function removeBeam() {
  removeSVG(beam.svg);
  beam = undefined;
}

function isOnAnswer(c) {
  if (distance({x:c.x, y:c.z*1000}, {x:c.goal.x, y:c.goal.z*1000}) > 50) return false;
  for (let answer of answers) {
    if (distance({x:c.x, y:c.z*1000},{x:answer.x,y:answer.z*1000}) < 50)
      return answer;
  }
  return false;
}

function checkAnswer(answer) {
  const question = msg.text.split(" x ");
  const rightAns = question[0] * question[1];
  const ufo_bottom = ufo.svg.style['height'].split("px")[0] * 0.25 + 100;
  //If the correct answer is picked it is raised to the ufo. Then it is removed and a
  //new question will be asked. If it is the last one, new questions are generated
  if (answer.value == rightAns) {
    answer.y -= 10;
		const answer_top = answer.svg.style['top'].split('px')[0];
    if (answer_top < ufo_bottom) {
      characters[selected].smile();
      score += 50 + bonusScore;
      bonusScore = 200;
      document.getElementById("score").innerHTML = "Score: " + Math.floor(score);
      removeAnswer();
      removeBeam(); 
      if (answers.length > 0)
        sendMessage({x:20,y:20,text:answers[0].text,size:60});
      else {
        gameStep = 6;
        sendMessage({});
      }
    }
    answer.update();
  }
  //If the wrong answer is picked the character is disabled so they can't escape the beam
  //The character will be raised and rotated. Once they are high enough they are removed
  //Then the other characters will return so they can be selected.
  else {
    const c = characters[selected];
    c.frown();
    c.y -= 10;
    c.enabled = false;
		const c_height = characters[selected].svg.style['height'].split("px")[0];
    c.svg.setAttribute('transform', "rotate("+(c.counter*10)%360+",0,"+(c_height*0.2)+")");
		const c_top = c.svg.style['top'].split('px')[0];
    if (c_top < ufo_bottom) {
      removeBeam();
      removeSVG(c.svg);
      characters.splice(selected, 1);
      selected = -1;
      if (characters.length == 0) gameStep = 9;
      for (let i=0; i<characters.length; i++) {
        const space = w/characters.length;
        characters[i].goal = {x:(i+1)*space-space/2, z:1};
        characters[i].speed = 30;
      }
    }
  }
}

function moveUFO() {
  if (selected > -1 && beam) {
    const c = characters[selected];
    ufo.x += (c.x - ufo.x) * 0.05;
    ufo.z += (c.z - ufo.z) * 0.05;
  } else {
	  ufo.x += (w/2 - ufo.x) * 0.01;
		ufo.z += (0.8 - ufo.z) * 0.01;
	}
  const width = ufo.width * Math.pow(ufo.z, 1.3);
  const height = ufo.height * Math.pow(ufo.z, 1.3);
	ufo.svg.style['left'] = ufo.x - width/2 + 'px';
	ufo.svg.style['top'] = '100px';
	ufo.svg.style['width'] = width + 'px';
	ufo.svg.style['height'] = height + 'px';
	ufo.svg.style['z-index'] = Math.floor(ufo.z * 1000);
	
	if (beam) {
	  beam.svg.style['left'] = ufo.x - width/4 + 'px';
    beam.svg.style['top'] = (100 + height * 0.25) + 'px';
		beam.svg.style['width'] = width/2 + 'px';
		beam.svg.style['height'] = ufo.z * 800 + 'px';
		beam.svg.style['z-index'] = Math.floor(ufo.z * 1000 - 1);
	}
}

window.addEventListener('resize', function () {
  w = window.innerWidth;
  h = window.innerHeight;
  const svgs = document.querySelectorAll('svg');
  svgs.forEach(svg => {
    if (svg.parentNode) {
      if (svg.id == "mountain" || svg.id == "tree" || svg.id == "farTrees")
        svg.parentNode.removeChild(svg);
    }
  });
  createBackground();
  ufo.goal.x = w/2;
});

function init() {
  vBar.addEventListener("input", function() {
    volume = Number(document.getElementById("vBar").value);
  });
  createBackground();
  createCharacters();
  createUFO();
  animate();
}

function createCharacters() {
  characters.push(new Character({x:0, name:'stan', 'parts':{'legs':['#353f84'], 'feet':[],  'body':['#924531','#b0171c','#900000'], 'buttons1':[], 'collar':['#b0171c'], 'head':['#f9d6ae'], 'eyes':[], 'frown':[], 'stanhat':['#353f84', '#b0171c', '#900000']}}));
  
  characters.push(new Character({x:170, name:'kyle', 'parts':{'legs':['#186757'], 'feet':[], 'body':['#df5f24','#128c58','#027c48'], 'pockets':[], 'collar':['#0e875a'], 'head':['#f9d6ae'], 'eyes':[], 'frown':[], 'kylehat':['#66b564', '#0e875a']}}));
  
  characters.push(new Character({x:370, width:200, name:'eric', 'parts':{'fatlegs':['#72382c'], 'fatfeet':[], 'fatbody':['#ca2f35','#eac91e'], 'buttons2':[], 'head':['#f9d6ae'], 'eyes':[], 'frown':[], 'erichat':['#53b2c8', '#f3cd20']}}));
  
  characters.push(new Character({x:570, name:'kenny', 'parts':{'legs':['#e05f24'], 'feet':[], 'body':['#e05f24','#582919','#380900'], 'head':['#f9d6ae'], 'eyes':[], 'frown':[], 'kennyhat':['#582919', '#e05f24']}}));
  
  characters.push(new Character({x:740, name:'butters', 'parts':{'legs':['#175536'], 'feet':[], 'body':['#32dbbd','#f9d6ae','#d9b69e'],'head':['#f9d6ae'], 'eyes':[], 'frown':[], 'buttershat':['#f1f42e']}}));
}

function createBackground() {
  createMountains();
  createTrees();
  createFarTrees();
}

function createUFO() {
  ufo = new SVG3d({'ufo':[]}, w/2, -75, 0.3, 700, 800);
  ufo.speed = 20;
  ufo.goal.z = 0.6;
}

function createMountains() {
  for (let x = 0; x < w + 150; x += 200 + Math.random() * 100) {
    let z = Math.random() * 0.03 + 0.1;
    let darken = (0.13-z) * 1000;
		let width = 8000 + darken * 500;
		let height = 4000 + darken * 100;
    let color = "rgb("+(9 + Math.floor(Math.random()*20 - darken)) + ","+
                       (85 + Math.floor(Math.random()*20 - darken)) + ","+
                       (73 + Math.floor(Math.random()*20 - darken)) + ")";
    new SVG3d({'mountain':[color]}, x, 0, z, width, height);
  }
}

function createTrees() {
  for (let x = 0; x < w + 150; x += 100 + Math.random() * 50) {
    let z = Math.pow(1 - Math.random() * 0.8, 1.3);
    let darken = (1-z) * 100;
    let color = "rgb("+(9 + Math.floor(Math.random()*20 - darken)) + ","+
                       (130 + Math.floor(Math.random()*20 - darken)) + ","+
                       (73 + Math.floor(Math.random()*20 - darken)) + ")";
    new SVG3d({'tree':[color]}, x, 0, z, 250, 600);
  }
}

function createFarTrees() {
  for (let x = 0; x < w + 150; x += 100 + Math.random() * 100) {
    new SVG3d({'farTrees':[]}, x, 0, 0.15, 8000, 2000);
  }
}

class SVG3d{
  constructor(parts, x, y, z, width, height) {
    this.parts = Object.entries(parts);
    this.x = x;
    this.y = y;
    this.z = z;
    this.width = width;
    this.height = height;
    this.counter = rn(1,20);
    this.speed = SPEED / w;
    this.goal = {x:x, y:y, z:z};
    this.svg = document.createElementNS(svgNS, "svg");
    this.svg.setAttribute("viewBox", "0 0 "+BOX+" "+BOX*2);
    document.body.appendChild(this.svg);
    if (this.width != this.height)
      this.svg.setAttribute('preserveAspectRatio', 'none');
    this.draw();
    this.update();
  }
  
  draw() {
    this.svg.innerHTML = '';
    for (let i=0; i<this.parts.length; i++) {
      let partSVG = svgLib[this.parts[i][0]];
      for (let j=0; j<this.parts[i][1].length; j++) {
        partSVG = partSVG.replaceAll("color"+j,this.parts[i][1][j]);
      }
      this.svg.innerHTML += partSVG;
      this.svg.id = this.parts[i][0];
    }
  }
  
  update() {
    if (distance({x:this.x, y:this.z*1000}, {x:this.goal.x, y:this.goal.z*1000}) > this.speed)
      this.move();
    const width = this.width * Math.pow(this.z, 1.5);
    const height = this.height * Math.pow(this.z, 1.5);
    this.svg.style.top = (h/2 - height + this.z * h * 0.3 + this.y)+ "px";
    this.svg.style.left = (this.x - width/2) + "px";
    this.svg.style.width =  width + "px";
    this.svg.style.height = height + "px";
    this.svg.style['z-index'] = Math.floor(this.z * 1000); 
  }
  
  move() {
    if (Math.random() > 0.8) dropDirtySnow(this);
    this.svg.setAttribute('transform', "rotate("+((this.counter/4)%3 - 1)+",0,0)");
    if (this.goal.x > this.x + this.speed/4) this.x += this.speed/2;
    else if (this.goal.x < this.x - this.speed/4) this.x -= this.speed/2;
    if (this.goal.z > this.z + 0.005) this.z += this.speed/4000;
    else if (this.goal.z < this.z - 0.005) this.z -= this.speed/4000;
  }
}

class Character extends SVG3d {
  constructor(data) {
    super(data.parts, w/2 - 370 + data.x, 0, 1.1, ('width' in data)? data.width:150, 300);
    this.svg.id = data.name + "-" + characters.length;
    this.enabled = true;
  }
  
  //Process is to tick character animation and change the mouth depending on mouse distance
  process() {
    this.counter += 1;
    this.y += Math.sin(this.counter/5) * h * 0.0001;
    if (selected == -1) this.changeMouthOnMouseHover();
    this.update();
  }
  
  changeMouthOnMouseHover() {
    const mPos = this.parts.length - 2;
    if (distance({x:this.x, y:window.innerHeight * 0.75}, mouse) < 90) {
      if (this.parts[mPos][0] == 'frown') {
        this.smile();
      }      
    } else if (this.parts[mPos][0] == 'grin') {
      this.frown();
    }
  }
  
  smile() {
    this.parts[this.parts.length - 2][0] = 'grin';
    this.draw();
  }
  
  frown() {
    this.parts[this.parts.length - 2][0] = 'frown';
    this.draw();
  }
}

document.addEventListener('mousedown', function(event) {
  if (audioCtx == undefined) audioCtx = new AudioContext();
});

document.addEventListener('mouseup', function(event) {
  if (selected == -1) {
    for (let i=0; i<characters.length; i++) {
     if (characters[i].svg === event.target.parentElement)
       characterPicked(i);
    }
  } else if (event.target.nodeName == "text") {
    for (let i=0; i<answers.length; i++) {
      if (answers[i].value == event.target.innerHTML) {
        characters[selected].goal = {x:answers[i].x, y:0, z:answers[i].z};
      }
    }
  }
});


document.addEventListener('mousemove', function(event) {
  mouse.x = event.clientX;
  mouse.y = event.clientY;
});

document.addEventListener('keydown', function(event) {
  if (keys.indexOf(event.key) < 0) {
    keys.push(event.key);
    playFootSteps();
  }
});

document.addEventListener('keyup', function(event) {
  keys.splice(keys.indexOf(event.key),1);
});

function rn(min,max){return Math.floor(Math.random()*(max-min+1)+min)}

function distance(p1, p2) {
  return Math.sqrt(Math.pow(p1.x-p2.x, 2) + Math.pow(p1.y-p2.y, 2));
}

//Library with the SVG images to be used in the scene
const svgLib = {

//  S        O    O    U     U   N  N  N   D   D    S
//   SSSS    O    O    U     U   N   N N   D    D    SSSSS
//       S   O    O    U     U   N    NN   D   D          S
//  SSSSS     OOOO      UUUUU    N     N   DDDD     SSSSSS
//                                                  
//Creates and repeats a footstep noise
function playFootSteps() {
  if (keys.length != 1 || volume == 0) return;
  const bufferSize = audioCtx.sampleRate * 0.2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  
  for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
  }
  
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 2000;
  filter.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.2);
  
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(volume*10, audioCtx.currentTime + 0.1);
  gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.2);
  
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start(audioCtx.currentTime);
  setTimeout(playFootSteps, 300);
}

//playSong will get called each frame and schedule notes to be played for the next
//second. If it finds notes to play, it will call pluck and bass to schedule them.
function playSong() {
  const time = audioCtx.currentTime%(64*BPM);
  const second = Math.floor(time)
  if (second == lastScheduled) return;
  lastScheduled = second;
  for (let s of song) {
    if (Math.floor(s.time*BPM) != second) continue;
    let time = audioCtx.currentTime+s.time*BPM-second+1;
    if (s.sound == 1) pluck(time, s.note, s.length*BPM);
    else bass(time, s.note, s.length*BPM);
  }
  
}

//Creates a plucky sound with a sawtooth oscillator
function pluck(time, frequency, length) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = 'sawtooth';
  osc.frequency.value = frequency;
  
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(volume, time + length * 0.05);
  gain.gain.exponentialRampToValueAtTime(0.01, time + length);
  
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1000;
  
  osc.connect(gain);
  gain.connect(filter);
  filter.connect(audioCtx.destination);
  
  osc.start(time);
  osc.stop(time + length);
}

//creates a bassy sound with a sine oscillator
function bass(time, frequency, length) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = 'sine';
  osc.frequency.value = frequency;
  
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(volume + 0.2, time + length * 0.1);
  gain.gain.linearRampToValueAtTime(volume + 0.05, time + length * 0.33);
  gain.gain.linearRampToValueAtTime(volume + 0.05, time + length * 0.66);
  gain.gain.linearRampToValueAtTime(0.001, time + length);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  osc.start(time);
  osc.stop(time + length);
}
