<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Earth</title>
<script src="lib/three.js" type="text/javascript"></script>
<script src="lib/OrbitControls.js"></script>
<style>
body {margin:0px; overflow:hidden;}
#controls {
  position:absolute; 
  top:0px; 
  left:0px; 
  height:150px; 
  width:150px;
  background-color:#222222;
  color:white;
  z-index:5;
  }
</style>
</head>
<body onload="init()">
<canvas id="canvas"></canvas>
<div id="controls">
<input type="submit" id="lines" value="Toggle Lines" onclick="toggleLines()"/><br>
<input type="submit" id="lines" value="Toggle Sun" onclick="toggleSun()"/><br>
<input type="radio" name="click" value="vertex" id="vertex">Add Vertex<br>
<input type="radio" name="click" value="elv" id="elv" checked>Elevation<br>
Elevation Multiplier
<input type="text" id="elvMulti" value="1.02" size=10><br>
<input type="radio" name="click" value="paint" id="paint">Paint<br>

</div>
<script>

var canvas, mtx, cw, ch;
var renderer, camera, scene, controls;
var earth, wires, wireMaterial;
var showLines=true;
var mouseDown={x:0,y:0,down:false};
var sun, glow, sunOn=true;

function init() {
  canvas = document.getElementById('canvas');
  cw = canvas.width = window.innerWidth;
  ch = canvas.height = window.innerHeight;
  renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
  camera = new THREE.PerspectiveCamera(75, cw/ch, 1, 10000);
  camera.position.z = 10;
  scene = new THREE.Scene();
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  drawEarth();
  lights();
  starBox();
  animate();
}


function starBox(){
  var stars = document.createElement("canvas");
  var stx = stars.getContext('2d');
  stars.width=2000; stars.height=1500;
  stx.fillStyle="white";

  for (var i=0; i<100; i++) {
    stx.beginPath();
    stx.arc(rn(1,2000),rn(1,1500),rn(1,3),0,Math.PI*2);
    stx.fill();
  }
  var starTexture = new THREE.Texture( stars );
  starTexture.needsUpdate = true;
  var starMaterial = new THREE.MeshBasicMaterial( {map: starTexture, side: THREE.BackSide} );
  var starGeometry = new THREE.CubeGeometry(100,100,100);
  var starCube = new THREE.Mesh( starGeometry, starMaterial);
  scene.add(starCube);
}

function drawEarth() {
  var img = new Image(2400,1200);
  var mapTexture = new THREE.Texture( img );
  mapTexture.needsUpdate = true;
  var geometry = new THREE.SphereGeometry( 5, 96, 64 );
  var material = new THREE.MeshPhongMaterial( {
    map: mapTexture,
    color: 0xffffff,
    shading: THREE.SmoothShading});
  earth = new THREE.Mesh( geometry, material);
  scene.add( earth );
  
  wireMaterial = new THREE.MeshPhongMaterial( {
    wireframe: true,
    color: 0x000000});
  wires = new THREE.Mesh( geometry, wireMaterial);
  scene.add( wires );
  img.src='textures/map.svg';
}

// Let there be light
function lights() {
  var light1 = new THREE.AmbientLight( 0xffffff , 0.055); 
  scene.add( light1 );
  
  glow = new THREE.AmbientLight( 0xffffff, 0.5);
  
  sun = new THREE.Object3D();
  var geometry = new THREE.SphereGeometry( .5, 8, 8 );
  var material = new THREE.MeshBasicMaterial( {color:"white"});
  var orb = new THREE.Mesh( geometry, material);
  light2 = new THREE.DirectionalLight( 0xffffff, 0.6 );
  sun.add(orb);
  sun.add(light2);
  sun.position.set( 10, 10, 10 );
  scene.add( sun );
}






window.addEventListener( 'mousedown', onMouseDown, false );
window.addEventListener( 'mouseup', mouseUp, false );

function onMouseDown(event) {
  x = ( event.clientX / window.innerWidth ) * 2 - 1;
  y = -( event.clientY / window.innerHeight ) * 2 + 1
  mouseDown = {x:x, y:y, down:true};  
}

function mouseUp(event) {
  var x = ( event.clientX / window.innerWidth ) * 2 - 1;
  var y = -( event.clientY / window.innerHeight ) * 2 + 1
  mouseDown.down = false;
  if (Math.abs(mouseDown.x-x)<.02 && Math.abs(mouseDown.y-y)<50)
    raycast(x,y);
  dragVertex = -1;
}

function raycast(x, y) {
  var mouse = new THREE.Vector2()
  mouse.x = x; mouse.y = y;
  var raycaster = new THREE.Raycaster();
  raycaster.setFromCamera( mouse, camera );
  var intersects = raycaster.intersectObjects( scene.children );
  if (document.getElementById("vertex").checked) splitFace(intersects[0]);
  else if (document.getElementById("elv").checked) elevation(intersects[0]);
  else if (document.getElementById("paint").checked) paint(intersects[0]);
}

function paint( click ) {
  
}

function elevation( click ) { 
  var geo = click.object.geometry;
  var v1 = geo.vertices[click.face.a];
  var v2 = geo.vertices[click.face.b];
  var v3 = geo.vertices[click.face.c];
  var ab = v1.distanceTo(click.point);
  var bc = v2.distanceTo(click.point);
  var ca = v3.distanceTo(click.point);
  var choosen = v3; 
  if (ab < bc && ab < ca) choosen = v1;
  else if (bc < ca)       choosen = v2;
  var multi = document.getElementById("elvMulti").value
  choosen.multiplyScalar(multi);
  if (showLines) cloneLines();
  geo.computeVertexNormals();
  geo.elementsNeedUpdate = true;  
}

function splitFace( click ) {
  var geo = click.object.geometry;
  var face = click.face
  var v1 = geo.vertices[face.a];
  var v2 = geo.vertices[face.b];
  var v3 = geo.vertices[face.c];
  var ab = v1.clone().add(v2).divideScalar(2).distanceTo(click.point);
  var bc = v2.clone().add(v3).divideScalar(2).distanceTo(click.point);
  var ca = v3.clone().add(v1).divideScalar(2).distanceTo(click.point);
  var vert1, vert2;
  if (ab < bc && ab < ca) {vert1=face.a; vert2=face.b;}
  else if (bc < ca)       {vert1=face.b; vert2=face.c;}
  else                    {vert1=face.c; vert2=face.a;}
  var tan = findFace(vert1, vert2, click);

  var newVertex = geo.vertices[vert1].clone()
  newVertex.add(geo.vertices[vert2]).divideScalar(2);
  geo.vertices.push(newVertex);
  var vI = geo.vertices.length-1;

  var uvC;
  var uv = geo.faceVertexUvs[0][click.faceIndex];
  if (vert1 == face.a) uvC = uv[0].clone().add(uv[1]).divideScalar(2);
  else if (vert1 == face.b) uvC = uv[1].clone().add(uv[2]).divideScalar(2);
  else uvC = uv[2].clone().add(uv[0]).divideScalar(2);

  newFace(click.faceIndex, vert1, vert2, vI, geo, uvC);
  newFace(tan, vert1, vert2, vI, geo, uvC);
 
  if (showLines) cloneLines();
  geo.elementsNeedUpdate = true;  
}

function newFace(faceIndex, v1, v2, vI, geo, uvC) {
  var face = geo.faces[faceIndex];
  var newFace = face.clone();
  
  var uvs = geo.faceVertexUvs[0][faceIndex];
  var newUV = [uvs[0].clone(),uvs[1].clone(),uvs[2].clone()];
  
  if (v1 == face.a || v2 == face.a) {
    {face.a = vI; uvs[0] = uvC;}
    if (v1 == face.b || v2 == face.b) {newFace.b = vI; newUV[1] = uvC;}
    else if (v1 == face.c || v2 == face.c) {newFace.c = vI; newUV[2] = uvC;}
  }
  else {face.b = vI; newFace.c = vI; uvs[1] = uvC; newUV[2] = uvC;}
  geo.faces.push(newFace);
  geo.faceVertexUvs[0].push(newUV);
}

function findFace(v1, v2, click) {
  var faces = click.object.geometry.faces;
  for (var i=0, len=faces.length; i<len; i++) {
    if ((faces[i].a == v1 || faces[i].b == v1 || faces[i].c == v1) &&
        (faces[i].a == v2 || faces[i].b == v2 || faces[i].c == v2))
        if (i != click.faceIndex) return i;
  }
}

function animate() {
  if (sunOn) {
    var sunA = Math.atan2(sun.position.x, sun.position.z);
    sun.position.set(Math.sin(sunA+.007)*30,0,Math.cos(sunA+.007)*30);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

function cloneLines() {
  scene.remove(wires);
  wires = new THREE.Mesh( earth.geometry.clone(), wireMaterial);
  scene.add(wires);
}

function toggleLines() {
  if (showLines) { showLines=0;
    scene.remove(wires);
  }
  else { showLines=1;
    scene.add(wires);
  }
}

function toggleSun() {
  if (sunOn) { sunOn=0;
    scene.remove(sun);
    scene.add(glow);
  }
  else { sunOn=1;
    scene.add(sun);
    scene.remove(glow);
  }
}

function rn(min,max) {return Math.floor( Math.random()*((max+1)-min)+min);}

</script>
</body>
</html>
