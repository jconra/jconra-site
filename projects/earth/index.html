<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Earth</title>
<script src="lib/three.min.js" type="text/javascript"></script>
<script src="lib/OrbitControls.js"></script>
<style>
body {margin:0px; overflow:hidden;}
.inFront {
  position:absolute; 
  background-color:#222222;
  color:white;
  z-index:5;
}
#controls {
  top:0px;
  left:0px;
  height:150px;
  width:150px;
}
#popup {
  top:50%;
  left:50%;
  margin-top:-100px;
  margin-left:-200px;
  height:200px;
  width:400px;
  text-align:center;
}
input {width:150px;}
</style>
</head>
<body onload="init()">
<canvas id="canvas"></canvas>
<div id="controls" class="inFront">
<input type="submit" id="lines" value="Toggle Lines" onclick="toggleLines()"/><br>
<input type="submit" id="sun" value="Toggle Sun" onclick="toggleSun()"/><br>
<input type="submit" id="clouds" value="Toggle Clouds" onclick="toggleClouds()"/><br>
<input type="submit" id="moon" value="Toggle Moon" onclick="toggleMoon()"/><br>
<input type="submit" id="sat" value="Toggle Satellites" onclick="toggleSat()"/><br>
<input type="submit" id="plane" value="Toggle Plane" onclick="togglePlane()"/><br>
<input type="submit" id="ride" value="Ride Satellite" onclick="toggleRide()"/><br>
</div>
<div id="popup" class="inFront">
<font size="9"><br>Scene Loading</font>
</div>
<script src="textures/heights.js"></script>
<script>

var canvas, img, cw, ch;
var renderer, camera, scene, controls;
var earth, wires, clouds, moon, sun, glow, sat1, sat2, airplane;
var showLines=false, cloudsOn=true, sunOn=false, moonOn=true, satOn=true, planeOn=false;
var mouseDown = {x:0, y:0, down:false};  
var path=[];

function init() {
  canvas = document.getElementById('canvas');
  cw = canvas.width = window.innerWidth;
  ch = canvas.height = window.innerHeight;
  renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
  camera = new THREE.PerspectiveCamera(75, cw/ch, .1, 10000);
  camera.position.z = 10;
  scene = new THREE.Scene();
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  drawEarth();
  lights();
  starBox();
  drawClouds();
  drawMoon();
  drawSatellite();
  drawAirplane();
  animate();
}


function starBox(){
  var stars = document.createElement("canvas");
  var stx = stars.getContext('2d');
  stars.width=2048; stars.height=2048;
  stx.fillStyle="white";

  for (var i=0; i<100; i++) {
    stx.beginPath();
    stx.arc(rn(1,2048),rn(1,2048),rn(1,3)/2,0,Math.PI*2);
    stx.fill();
  }
  var starTexture = new THREE.Texture( stars );
  starTexture.needsUpdate = true;
  var starMaterial = new THREE.MeshBasicMaterial( {map: starTexture, side: THREE.BackSide} );
  var starGeometry = new THREE.CubeGeometry(300,300,300);
  var starCube = new THREE.Mesh( starGeometry, starMaterial);
  scene.add(starCube);
}

function drawEarth() {
  img = new Image(4096,2048);
  img.src='textures/earthmap.jpg';
  img.onload = function () {
    var face;
    var mapTexture = new THREE.Texture( img );
    mapTexture.needsUpdate = true;
    var geometry = new THREE.SphereGeometry( 5, 384, 512 );
    for (var i=0, len=heightArray.length/2; i<len; i++) {
      face = geometry.faces[heightArray[i*2]];
      height = heightArray[i*2+1]/1000+1;
      geometry.vertices[face.a].multiplyScalar(height);
      geometry.vertices[face.b].multiplyScalar(height);
      geometry.vertices[face.c].multiplyScalar(height);
    }
    geometry.computeVertexNormals();
    var material = new THREE.MeshLambertMaterial( {
      map: mapTexture,
      color: 0xffffff,
      shading: THREE.SmoothShading
      });
    earth = new THREE.Mesh( geometry, material);
    scene.add( earth ); 
    
    wireMaterial = new THREE.MeshBasicMaterial( {
      wireframe: true,
      color: 0x000000});
    wires = new THREE.Mesh( geometry, wireMaterial);
    document.getElementById("popup").style.display = "none";
  }
}

function drawClouds() {
  var cloudGeometry = new THREE.IcosahedronGeometry(5.2,4);
  var cloudMaterial = new THREE.MeshLambertMaterial( { color:"#FFF", transparent: true, alphaTest: 0.5, side: THREE.DoubleSide } );
  var alphaMap = new THREE.TextureLoader().load('textures/clouds.jpg');
  cloudMaterial.alphaMap = alphaMap;
  clouds = new THREE.Mesh( cloudGeometry, cloudMaterial );
  scene.add( clouds );  
}

function drawMoon() {
  var moonTexture = THREE.ImageUtils.loadTexture( 'textures/moon.jpg' );
  var moonMaterial = new THREE.MeshLambertMaterial( { map: moonTexture } );
  var moonGeometry = new THREE.SphereGeometry(.5, 16, 16);
  moon = new THREE.Mesh( moonGeometry, moonMaterial );
  moon.position.set(20, 0, 20);
  scene.add( moon );  
}

function drawSatellite() {
  sat1 = new THREE.Object3D();
  var bodyGeometry = new THREE.CylinderGeometry(.1,.1,1,8);
  var bodyTexture = THREE.ImageUtils.loadTexture( 'textures/body.jpg' );
  var bodyMaterial = new THREE.MeshLambertMaterial( { map: bodyTexture } );
  var body = new THREE.Mesh( bodyGeometry, bodyMaterial );
  body.position.set(0,2,0);
  sat1.add(body);
  body = body.clone();
  body.position.set(0,-2,0);
  sat1.add(body);
  body = body.clone();
  body.scale.set(5,3,5);
  body.position.set(0,0,0);
  sat1.add(body);
  var panelGeometry = new THREE.BoxGeometry(.1,2,4);
  var panelTexture = THREE.ImageUtils.loadTexture( 'textures/panel.jpg' );
  var panelMaterial = new THREE.MeshLambertMaterial( { map: panelTexture } );
  var panel = new THREE.Mesh( panelGeometry, panelMaterial );
  panel.position.set(0,3,0);
  sat1.add(panel);
  panel = panel.clone();
  panel.position.set(0,-3,0);
  sat1.add(panel);
  sat1.scale.multiplyScalar(.1);
  sat2 = sat1.clone();
  sat1.position.set(7,0,0);
  sat2.position.set(0,7,0);
  sat2.rotateZ(Math.PI/2);
  scene.add(sat1);
  scene.add(sat2);
}

function drawAirplane() {
  var loader = new THREE.JSONLoader();
  loader.load('textures/airplane.json', function(geometry, materials){
    var material = new THREE.MeshFaceMaterial(materials);
    airplane = new THREE.Mesh(geometry, materials);
    airplane.scale.set(.02,.02,.02);
    airplane.position.set(0.012, 3.11, 4.391);
    //airplane.rotateX(Math.PI/2);
    //scene.add(airplane);
    planeOn=true;
  });
}

// Let there be light
function lights() {
  var light1 = new THREE.AmbientLight( 0xffffff , 0.055); 
  scene.add( light1 );
  
  glow = new THREE.AmbientLight( 0xffffff, 0.7);
  scene.add( glow );
  
  sun = new THREE.Object3D();
  var geometry = new THREE.SphereGeometry( .5, 8, 8 );
  var material = new THREE.MeshBasicMaterial( {color:"white"});
  var orb = new THREE.Mesh( geometry, material);
  light2 = new THREE.DirectionalLight( 0xffffff, 0.6 );
  sun.add(orb);
  sun.add(light2);
  sun.position.set( 10, 10, 10 );
}

function animate() {
  if (sunOn) {
    var sunA = Math.atan2(sun.position.x, sun.position.z);
    sun.position.set(Math.sin(sunA-.007)*30,0,Math.cos(sunA-.007)*30);
  }
  if (cloudsOn) clouds.rotateY(.0004);
  if (moonOn) {
    var moonA = Math.atan2(moon.position.x, moon.position.z);
    moon.position.set(Math.sin(moonA+.0007)*10,0,Math.cos(moonA+.0007)*10);
  }
  if (satOn) {
    var satA = Math.atan2(sat1.position.x, sat1.position.y);
    sat1.position.set(Math.sin(satA+.005)*6.5,Math.cos(satA+.005)*6.5,0);
    sat1.rotateZ(-.005);
    
    var satA = Math.atan2(sat2.position.y, sat2.position.z);
    sat2.position.set(0,Math.sin(satA+.007)*6,Math.cos(satA+.007)*6);
    sat2.rotateY(.007);
  }

  if (planeOn) {
    //var planeA = Math.atan2(airplane.position.x, airplane.position.z);
    //airplane.position.set(Math.sin(planeA+.002)*5.2,0, Math.cos(planeA+.002)*5.2);
    //airplane.rotateZ(-.002);
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.addEventListener( 'mousedown', onMouseDown, false );
window.addEventListener( 'mouseup', mouseUp, false );
 
function onMouseDown(event) {
  x = ( event.clientX / window.innerWidth ) * 2 - 1;
  y = -( event.clientY / window.innerHeight ) * 2 + 1
  mouseDown = {x:x, y:y, down:true};  
}
 
function mouseUp(event) {
  var x = ( event.clientX / window.innerWidth ) * 2 - 1;
  var y = -( event.clientY / window.innerHeight ) * 2 + 1
  mouseDown.down = false;
  if (Math.abs(mouseDown.x-x)<.02 && Math.abs(mouseDown.y-y)<50)
    raycast(x,y);
}

function raycast(x, y) {
  var mouse = new THREE.Vector2()
  mouse.x = x; mouse.y = y;
  var raycaster = new THREE.Raycaster();
  raycaster.setFromCamera( mouse, camera );
  var objects = [earth];
  var intersects = raycaster.intersectObjects( objects );
  console.log(intersects[0].point);
}

function toggleLines() {
  if (showLines) { showLines=0;scene.remove(wires);}
  else { showLines=1;scene.add(wires);}
}

function toggleClouds() {
  if (cloudsOn) { cloudsOn=0; scene.remove(clouds);}
  else { cloudsOn=1; scene.add(clouds);}
}

function toggleMoon() {
  if (moonOn) { moonOn=0; scene.remove(moon);}
  else { moonOn=1; scene.add(moon);}
}

function toggleSat() {
  if (satOn) { satOn=0; scene.remove(sat1); scene.remove(sat2)}
  else { satOn=1; scene.add(sat1); scene.add(sat2) }
}

function togglePlane() {
  if (planeOn) { planeOn=0; scene.remove(airplane);}
  else { planeOn=1; scene.add(airplane);}
}

function toggleRide() {
  if (sat1.children.length == 5) sat1.add(camera);
  else sat1.remove(camera);
}

function toggleSun() {
  if (sunOn) { sunOn=0;
    scene.remove(sun);
    scene.add(glow);
  }
  else { sunOn=1;
    scene.add(sun);
    scene.remove(glow);
  }
}

function rn(min,max) {return Math.floor( Math.random()*((max+1)-min)+min);}

</script>
</body>
</html>
