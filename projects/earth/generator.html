<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Earth</title>
<script src="lib/three.js" type="text/javascript"></script>
<script src="lib/OrbitControls.js"></script>
<style>
body {margin:0px; overflow:hidden;}
#controls {
  position:absolute; 
  top:0px; 
  left:0px; 
  height:150px; 
  width:150px;
  background-color:#222222;
  color:white;
  z-index:5;
  }
</style>
</head>
<body onload="init()">
<canvas id="canvas"></canvas>
<div id="controls">
<input type="submit" id="sun" value="Toggle Sun" onclick="toggleSun()"/><br>
<input type="submit" id="bump" value="Compute Bumps" onclick="bumps()"/><br>
<input type="submit" id="export" value="Export Object" onclick="exportObj()"/><br>
</div>
<script>

var canvas, img, cw, ch;
var renderer, camera, scene, controls;
var earth;
var showLines=true;
var mouseDown={x:0,y:0,down:false};
var sun, glow, sunOn=false;
var eMap = new Image();
eMap.src="textures/earthmap.jpg";
var heightArray = [];

function init() {
  canvas = document.getElementById('canvas');
  cw = canvas.width = window.innerWidth;
  ch = canvas.height = window.innerHeight;
  renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
  camera = new THREE.PerspectiveCamera(75, cw/ch, 1, 10000);
  camera.position.z = 10;
  scene = new THREE.Scene();
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  drawEarth();
  lights();
  starBox();
  animate();
}


function starBox(){
  var stars = document.createElement("canvas");
  var stx = stars.getContext('2d');
  stars.width=2048; stars.height=2048;
  stx.fillStyle="white";

  for (var i=0; i<200; i++) {
    stx.beginPath();
    stx.arc(rn(1,2048),rn(1,2048),rn(1,3)/2,0,Math.PI*2);
    stx.fill();
  }
  var starTexture = new THREE.Texture( stars );
  starTexture.needsUpdate = true;
  var starMaterial = new THREE.MeshBasicMaterial( {map: starTexture, side: THREE.BackSide} );
  var starGeometry = new THREE.CubeGeometry(300,300,300);
  var starCube = new THREE.Mesh( starGeometry, starMaterial);
  scene.add(starCube);
}

function drawEarth() {
  img = new Image(4096,2048);
  img.src='textures/heightmap.jpg';
  img.onload = function () {
    var mapTexture = new THREE.Texture( img );
    mapTexture.needsUpdate = true;
    var geometry = new THREE.SphereGeometry( 5, 384, 512 );
    //var geometry = new THREE.SphereGeometry( 5, 128, 192 );
    var material = new THREE.MeshPhongMaterial( {
      map: mapTexture,
      color: 0xffffff,
      shading: THREE.SmoothShading});
    earth = new THREE.Mesh( geometry, material);
    scene.add( earth );
  }
}

function bumps() {
  var hcan = document.createElement("canvas");
  var hctx = hcan.getContext('2d');
  hcan.width=4096;
  hcan.height=2048;
  hctx.drawImage(img,0,0);
  
  var ecan = document.createElement("canvas");
  var ectx = ecan.getContext('2d');
  ecan.width=4096;
  ecan.height=2048;
  ectx.drawImage(eMap,0,0);
  
  var geo = earth.geometry;
  var last = -1;
  var count=0;
  for (var i=0, len=geo.faces.length; i<len; i++) {
    if (i%400==0)console.log("HeightMap: "+Math.floor(i/len*100)+"%");
    var uv = geo.faceVertexUvs[0][i];
    var face = geo.faces[i];
    if (face.a == 0 || face.c == geo.vertices.length-1) continue;
    var pixel1 = hctx.getImageData(4096*uv[0].x, 2048-2048*uv[0].y, 1, 1);
    var pixel2 = ectx.getImageData(4096*uv[0].x, 2048-2048*uv[0].y, 1, 1);
    if (pixel1.data[0] < 30) count++;
    var height = pixel1.data[0]/24;
    if (pixel2.data[1] > pixel2.data[2]) height+=2;
    height = rd(height);
    if (height > 3) {heightArray.push(i); heightArray.push(height);}
    height=height/1000+1;
    geo.vertices[face.a].multiplyScalar(height);
    geo.vertices[face.b].multiplyScalar(height);
    geo.vertices[face.c].multiplyScalar(height);
  }
  console.log("ArraySize: "+heightArray.length);
  img.src="textures/earthmap.jpg";
  earth.material.map.needsUpdate = true;
  geo.elementsNeedUpdate = true;
  geo.computeVertexNormals();
}

// Let there be light
function lights() {
  var light1 = new THREE.AmbientLight( 0xffffff , 0.055); 
  scene.add( light1 );
  
  glow = new THREE.AmbientLight( 0xffffff, 0.7);
  scene.add( glow );
  
  sun = new THREE.Object3D();
  var geometry = new THREE.SphereGeometry( .5, 8, 8 );
  var material = new THREE.MeshBasicMaterial( {color:"white"});
  var orb = new THREE.Mesh( geometry, material);
  light2 = new THREE.DirectionalLight( 0xffffff, 0.6 );
  sun.add(orb);
  sun.add(light2);
  sun.position.set( 10, 10, 10 );
}

function animate() {
  if (sunOn) {
    var sunA = Math.atan2(sun.position.x, sun.position.z);
    sun.position.set(Math.sin(sunA+.007)*30,0,Math.cos(sunA+.007)*30);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

function toggleSun() {
  if (sunOn) { sunOn=0;
    scene.remove(sun);
    scene.add(glow);
  }
  else { sunOn=1;
    scene.add(sun);
    scene.remove(glow);
  }
}

function rn(min,max) {return Math.floor( Math.random()*((max+1)-min)+min);}

  output+='"specularCoef" : 50, "opacity" : 1.0, "vertexColors" ';
  output+=': "false" } ], "vertices":[';
  var geo = earth.geometry;
  var vertices = earth.geometry.vertices;
  var faces = earth.geometry.faces;
  var faceVertexUvs = earth.geometry.faceVertexUvs;
  var vertexRemap = [];
  var newVertices = [];
  */
  
  /*
  for (var i=0, len=geo.vertices.length; i<len; i++) {
    var v=geo.vertices[i];
    output += rd(v.x)+","+rd(v.y)+","+rd(v.z)+",";
  }
  output = output.slice(0,-1)+'],"faces":[';
  uvs=[];
  for (var i=0, len=geo.faces.length; i<len; i++) {
    var f=geo.faces[i];

    uvs[f.c*2+1]=fv[2].y;
  }
  output = output.slice(0,-1)+'],"uvs":[[';

    output+=rd(uvs[i])+","
  }
  output = output.slice(0,-1)+']]}';
  //var wnd = window.open("about:blank", "", "_blank");
  //wnd.document.write(output);
  */
  var output = heightArray.toString();
  var textToSaveAsBlob = new Blob([output], {type:"text/plain"});
  var textToSaveAsURL = window.URL.createObjectURL(textToSaveAsBlob);
  var downloadLink = document.createElement("a");
  downloadLink.download = "earth.json";
  downloadLink.innerHTML = "Download File";
  downloadLink.href = textToSaveAsURL;
  downloadLink.onclick = destroyClickedElement;
  downloadLink.style.display = "none";
  document.body.appendChild(downloadLink);
  downloadLink.click();
}

function destroyClickedElement(event) {document.body.removeChild(event.target);}

function rd(n) {
  return Math.floor(n*1000)/1000;
}

</script>
</body>
</html>
