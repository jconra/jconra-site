<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tower Defense</title>
<style>
body{margin: 0;padding: 0; background: #000; overflow:hidden;}
.top{
  background-color: rgba(0,0,0,0.6); 
  color: #FFF; 
  width:100%; 
  height:30px;
  position: fixed;
  text-align: center;
  border: 1px solid #222;
  top: 0px;
  }
table { width:100%; }
</style>
</head>
<body oncontextmenu="return false;">
<script src="lib/three.js"></script>
<canvas id="canvas" style="display:none;"></canvas>
<div id="menu" class="top">
<table><tr><td width="20%">Gem Tower Defense!</td>
<td id="step" width="25%"></td>
<td id="lives" width="10%">Lives: 30</td>
<td id="warn" width="25%"></td>
<td id="info" width="20%"></td>
</tr></table></div>
<script>

window.onload = init;

var width, height, scene, camera, renderer, terrain;
var loader = new THREE.JSONLoader();
var objects = []; 
var map = [];
var ondeck = [];
var towers = [];
var round = 0;
var size=.25, mouseDown;
var moveForward = moveBackward = moveLeft = moveRight = false;
var xmax=20, zmax=75;
var meshes = [];
var step=5;
var selection;
var mobs = [], mobPath = [];
var mapImg = new Image();
mapImg.src="textures/map.jpg";
var colors=["yellow","lime","blue","red","purple","silver","#222","orange"];
var attacking = false;
var lives = 30;
var objects = [];

var loader = new THREE.JSONLoader();

function init() {

  width  = window.innerWidth;
  height = window.innerHeight;
  scene  = new THREE.Scene();
  
  camera = new THREE.PerspectiveCamera( 75, width / height, 1, 10000 );
  camera.position.set( 15, 5, 10 );
  camera.rotation.set( -.8, 0, 0 );
  camera.rotation.order = 'YXZ';
  
  renderer = new THREE.WebGLRenderer();
  renderer.setSize( width, height );
  document.body.appendChild( renderer.domElement );

  // Lights
  var light1 = new THREE.AmbientLight( 0xffffff, .2 );
  scene.add( light1 );

  var light2 = new THREE.DirectionalLight( 0xffffff, 1);
  light2.position.set( 0,1,1).normalize();
  scene.add( light2 );

  // Build the Map
  for (var i=0; i<zmax; i++){
    map[i]=[];
    for (var j=0; j<xmax; j++){
      if (j==0 || j>18 || i<2) map[i].push({type:99});
      else map[i].push({type:-1});
    }
  }
  
  //Customize the map so that spots that have rock are considered wall and flat areas are empty.  
  var mkEmpty = [[1,2],[0,4],[1,5],[0,5],[1,6],[0,9],[1,14],[0,14],[1,15],[1,16],[1,17]];
  for (var i=0, len=mkEmpty.length; i<len; i++) {
    map[mkEmpty[i][0]][mkEmpty[i][1]].type = -1;
  }
  var mkWall = [[45,1],[43,1],[29,1],[27,1],[25,1],[11,1],[10,1],[9,1],[8,1],[7,1],[6,1],[5,1],[3,1],[2,7],[3,7],[4,7],[2,8],[3,8],[2,10],[2,11],[2,12],[2,13],[3,13],[2,17],[4,17],[6,17],[2,18],[3,18],[4,18],[5,18],[6,18],[7,18],[8,18],[10,18],[12,18],[14,18],[16,18],[22,18],[24,18],[26,18]];
  for (var i=0, len=mkWall.length; i<len; i++) {
    map[mkWall[i][0]][mkWall[i][1]].type = 99;
  }
  
  //Mob targets
  goals=[{z:21,x:3},{z:21,x:15}];
  for (var i=0,len=goals.length; i<len; i++) {
    map[goals[i].z][goals[i].x].type=98;
    var geometry = new THREE.SphereGeometry( .3 );
    var material = new THREE.MeshLambertMaterial( {color: 0xaaaaff} );
    goals[i].mesh = new THREE.Mesh( geometry, material );
    var p=coordToPos(goals[i].z, goals[i].x);
    goals[i].mesh.position.set(p.x, 0.6, p.z);
    scene.add( goals[i].mesh );
  }
 
  //Load models for use
  var models = ["rock","sGem","nGem","mGem"];
  for (var i=0; i<4; i++) { 
    loader.load( "textures/"+models[i]+".json", (function(index){
      return function(geometry, materials) {
      var mesh =  new THREE.Mesh(geometry, new THREE.MeshFaceMaterial( materials));
      if (index == 2) mesh.rotateY(Math.PI/2);
      meshes[index]=mesh;
    };})(i));
  }
  
  // Draw Land
  loader.load( "textures/td2.json", function(geometry, materials) {
    terrain = new THREE.Mesh(geometry, new THREE.MeshFaceMaterial( materials ));
    terrain.rotateY( -Math.PI/2);
    terrain.position.set(14.5,.4,13);  
    scene.add( terrain );
    objects.push(terrain);
  });
  drawSelector();
  
  //water
  var waterTexture = new THREE.ImageUtils.loadTexture('textures/water2.jpg');
  waterTexture.wrapS = waterTexture.wrapT = THREE.RepeatWrapping;
  waterTexture.repeat.set( 3, 1 );
  var waterMaterial = new THREE.MeshLambertMaterial( { map: waterTexture, transparent: true, opacity: 0.5} );
  var waterGeometry = new THREE.PlaneGeometry(30, 5, 2, 2);
  var bufferGeometry = new THREE.BufferGeometry().fromGeometry(waterGeometry);
  var water = new THREE.Mesh(bufferGeometry, waterMaterial);
  water.position.set(15,.30,27);
  water.rotation.x = -Math.PI / 2;

  scene.add(water);
   
  animate();
  updateGUI();
}

function pickTower(spot) {
  if (step == 0) {
    updateGUI();
    return;
  }
  map[spot.z][spot.x].type = 1;
  totalPath();
  map[spot.z][spot.x].type = -1;
  if (mobPath.length == 0) {
    document.getElementById("warn").innerHTML="Invalid Placement! No Path Exists!";
    return;
  }
  step--; 
  var pick=rn(0,7);
  ondeck.push({x:spot.x,z:spot.z});
  map[spot.z][spot.x]={type:pick, level:1};
  buildTower(spot);
  updateGUI();
}
 
function buildTower(coords) { 
  var m = map[coords.z][coords.x];
  if (m.type >79) var mesh = meshes[3].clone();
  else if (m.level == 2) var mesh = meshes[2].clone();
  else var mesh = meshes[1].clone();
  mesh.material = new THREE.MeshLambertMaterial( {color:colors[m.type%8]} );
  var p=coordToPos(coords.z, coords.x);
  mesh.position.set(p.x, 1.5*size, p.z);
  scene.add( mesh );
  map[coords.z][coords.x].mesh = mesh;
}
  
function buildWall(spot) { 
  var p=coordToPos(spot.z, spot.x)
  var newRock = meshes[0].clone();
  newRock.position.set(p.x, 2*size, p.z);
  scene.add( newRock );
  map[spot.z][spot.x]={type:99, level:1, mesh:newRock} 
}

window.addEventListener( 'mousedown', mDown, false );
window.addEventListener( 'mouseup', mUp, false );
window.addEventListener( 'mousemove', mMove, false );
  
function mUp(event) { 
  event.preventDefault();
  mouseDown.x = -1; 
}

function mDown(event) {
  mouseDown = {x:event.clientX, y:event.clientY};
  if (event.clientY < 30) return;
  if (event.button == 0) leftClick(event);
}

function leftClick(event) {
  selection.locked = false;
  if (attacking) return;
  selection.position.y=0;
  var intersects=raycast(event);
  if ( intersects.length > 0 ) { 
    var c = intersects[0];
    var p = posToCoord(c.point.x, c.point.z);
    var t = map[p.z][p.x].type;
    if (t == -1) pickTower(p);
    else if (t < 90) selector(p);
    else if (t == 99) wallClick(p);
  }
}

function wallClick(p) {
  var text = '<button onclick="destory('+p.z+','+p.x+')">Destroy Wall</button>';
  document.getElementById("step").innerHTML = text;
}

function destory(z,x) {
  scene.remove(map[z][x].mesh);
  map[z][x].type = -1;
}

//Function takes world coordinates and returns array coords
function posToCoord(x,z) {
  var guessX = Math.floor(x/(6*size));
  var guessZ = Math.floor(z/(1.5*size)); 
  for (var i=-2; i<3; i++) {
    if (i+guessZ < 0 || i+guessZ >= zmax) continue;
    for (var j=-2; j<3; j++) {
      if (j+guessX < 0 || j+guessX >= xmax) continue;
      var c = coordToPos(i+guessZ, j+guessX);
        if (hexBounds(x,z,c.x,c.z)) {
        if (selection.locked == false) 
          selection.position.set(c.x,.6,c.z);
        return {x: guessX+j, z: guessZ+i};
      }
    }
  }
  return {x:0,z:0} 
}

//Function takes mouse click and center of hex and determines
//if the click was inside the bounds of the hexagon
function hexBounds(x,y,cX,cY) {
  if (y > cY + 1.5*size) return false;
  if (y < cY - 1.5*size) return false;
  if (y > cY + 3*size - (x-cX)*1.5) return false;
  if (y < cY - 3*size - (x-cX)*1.5) return false;
  if (y > cY + 3*size + (x-cX)*1.5) return false;
  if (y < cY - 3*size + (x-cX)*1.5) return false;
  return true;
}

function coordToPos(z,x) {
  var posX=x*6*size;
  var posZ=z*1.5*size;
  if (z%2==0) posX+=3*size;
  return {x:posX,z:posZ};
}

function selector(coords) { 
  if (ondeck.length == 0) return;
  if (ondeck.length < 5) {
    document.getElementById("warn").innerHTML = "Pick all 5 Gems First!";
    return;
  }
  var p=coordToPos(coords.z, coords.x);
  selection.locked = true; 
  var text='<button onclick="keep('+coords.x+',';
  text +=coords.z+')">Keep this Gem</button>';
  if (canCombine(coords)) {
    text +='<button onclick="combine('+coords.x+','+coords.z+')">Combine</button>';
  }
  if (canCombineSpecial(coords).length > 0) {
    text+='<button onclick="combinSpecial('+coords.x+','+coords.z;
    text+=')">Combine Special</button>';
  }
  document.getElementById("step").innerHTML=text; 
}

function combine(x,z) {
  map[z][x].level += 1;
  scene.remove(map[z][x].mesh);
  keep(x,z);
  buildTower({x:x,z:z});
}

function combineSpecial(x,z) {
  var special = canCombineSpecial({x:x,z:z});
  scene.remove(map[z][x].mesh);
  map[z][x].type = special[0];
  for (var i=1; i<3; i++) {
    for (var j=0, jlen=towers.length; j<jlen; j++) {
      var t = towers[j];
      if (map[t.z][t.x].type = special[i]) {
        map[t.z][t.x].type = 99;
        scene.remove(map[t.z][t.x].mesh);
        buildWall(t);
      }
    }
  }
  buildTower({x:x,z:z});
}

function canCombine(coords) {
  for (var i=0, len=ondeck.length; i<len; i++) {
    if (coords.x == ondeck[i].x && coords.z == ondeck[i].z) continue;
    if (map[coords.z][coords.x].type == map[ondeck[i].z][ondeck[i].x].type)
      return true;
  }
  return false;
}

function canCombineSpecial(coords) {
  var tt = [];
  for (var i=0, len=towers.length; i<len; i++) {
    tt.push(map[towers[i].z][towers[i].x].type);
  }
  var my=map[coords.z][coords.x].type;
  if (my == 1 && tt.indexOf(6) >= 0 && tt.indexOf(7) >=0) return [80,6,7];
  if (my == 6 && tt.indexOf(1) >= 0 && tt.indexOf(7) >=0) return [80,1,7];
  if (my == 7 && tt.indexOf(1) >= 0 && tt.indexOf(6) >=0) return [80,1,6];
  
  if (my == 0 && tt.indexOf(5) >= 0 && tt.indexOf(2) >=0) return [81,5,2];
  if (my == 5 && tt.indexOf(0) >= 0 && tt.indexOf(2) >=0) return [81,0,2];
  if (my == 2 && tt.indexOf(0) >= 0 && tt.indexOf(5) >=0) return [81,0,5];
  return [];
}

function drawSelector(coords) {
  var ringShape = new THREE.Shape();
  ringShape.moveTo(-2.2, 0 );
  ringShape.lineTo(-1,-1.5 );
  ringShape.lineTo( 1,-1.5 );
  ringShape.lineTo( 2.2, 0 );
  ringShape.lineTo( 1, 1.5 );
  ringShape.lineTo(-1, 1.5 );
  ringShape.lineTo(-2.2, 0 );
  var inner = new THREE.Path();
  inner.moveTo( -2, 0 );
  inner.lineTo( -0.9, -1.35);
  inner.lineTo(  0.9, -1.35);
  inner.lineTo(  2, 0 );
  inner.lineTo(  0.9,  1.35);
  inner.lineTo( -0.9,  1.35);
  inner.lineTo( -2, 0 );
  ringShape.holes.push( inner );
  var extrudeSettings = { amount: .5, bevelEnabled: true, bevelSegments: 2, steps: 2, bevelSize: .05, bevelThickness: .05 };
  var geometry = new THREE.ExtrudeGeometry( ringShape, extrudeSettings );
  selection = new THREE.Mesh( geometry, new THREE.MeshPhongMaterial( { color:"red", side: THREE.DoubleSide } ));
  selection.rotation.x = Math.PI / 2;
  selection.scale.set( size*0.9, size, size*0.4)
  selection.position.set(0,0,0);
  selection.locked = false;
  scene.add(selection);
}

function keep(x,z) {
  for (var i=0, len=ondeck.length; i<len; i++) {
    if (x==ondeck[i].x && z==ondeck[i].z) {
      stats = towerType(map[z][x]);
      console.log("Gem purchased")
      towers.push({
        x:x,z:z,bullets:[],
        damage:stats.dmg,
        speed:stats.speed,
        num:stats.num,
        effect:stats.effect,
        range:stats.range
      });
    }
    else {
      scene.remove(map[ondeck[i].z][ondeck[i].x].mesh)
      buildWall({x:ondeck[i].x,z:ondeck[i].z});
    }
  }
  ondeck = [];
  updateGUI();
}


function towerType(tower) {
  var num = 1, speed = 20, range = 5, effect = 0, dmg = 30, level = tower.level;
  if      (tower.type == 0) {num=2+level;}
  else if (tower.type == 1) {effect = 1; dmg += level*20;}
  else if (tower.type == 2) {effect = 2; dmg += level*20;}
  else if (tower.type == 3) {effect = 3; dmg += level*20;}
  else if (tower.type == 4) {dmg = 50 + level*40;}
  else if (tower.type == 5) {dmg = 50 + level*40;}
  else if (tower.type == 6) {effect = 4; dmg += level*20;}
  else if (tower.type == 7) {speed = 5; dmg = 20 + level*10;}
  return {num:num, speed:speed, effect:effect, dmg:dmg, range:range};
}

function startRound() {
  round +=1;
  step += 5;
  selection.locked = false;
  document.getElementById("warn").innerHTML="Round "+round+" Starting!";
  attacking = true;
  totalPath();
  mobs=[];
  var start = coordToPos(0,9);
  for (var i=0; i<10; i++) {
    var geometry = new THREE.BoxGeometry( .3, .3, .3);
    var material = new THREE.MeshLambertMaterial( {color: 0x00ff00} );
    var mesh = new THREE.Mesh( geometry, material );
    mesh.position.set(start.x, 0.6, start.z);
    scene.add( mesh );
    mobs.push( {mesh:mesh, x:start.x, z:start.z, health:100*round, active:false} )
  } 
  mobs[0].active = true;
}

function totalPath() {
  mobPath=[];
  for (var i=0,len=goals.length; i<len; i++) {
    var start = (i==0)? {z:0,x:9}:goals[i-1]
    var segment = findPath(start,goals[i]);
    if (segment.length == 0) {
      console.log("No Path exists!");
      mobPath=[];
      return;
    }
    mobPath = mobPath.concat(segment);
  }
}

function findPath(s,e) {
  var openlist=[s];
  var path=[];
  for (var i=0;i<zmax;i++){ path.push([]); for (var j=0;j<xmax;j++){
      path[i].push({parent:{x:-1,y:-1},status:-1,weight:-1});
      if (map[i][j].type==-1) path[i][j].status=0;
    }
  }
  path[0][9]={status:1,weight:0,parent:{z:0,x:0}}
  while (openlist.length > 0) {
    //Find best choice on open list
    var index=-1;
    var lowest=Infinity;
    for (var i=0,len=openlist.length; i<len; i++) {
      var o = openlist[i];
      var w = path[o.z][o.x].weight+dist(o,e)*20;
      if (w < lowest) {index=i; lowest=w;}
    }
    var o = openlist[index];
    
    //Add the chosen spot's neighbors to the openlist
    var n1=[[-2,0],[-1,1],[1,1],[2,0],[1,0],[-1,0]];
    var n2=[[-2,0],[-1,0],[1,0],[2,0],[1,-1],[-1,-1]];
    var n = (o.z%2 == 0)? n1:n2;
    var par = path[o.z][o.x].parent;
    for (var i=0; i<6; i++) {
      if (o.z+n[i][0] < 0 || o.x+n[i][1] < 0) continue;
      if (o.z+n[i][0] >= zmax || o.x+n[i][1] >= xmax) continue;
      //console.log("z: "+(o.z+n[i][0])+", x: "+(o.x+n[i][1]));
      //console.log("o.z: "+o.z+", o.x: "+o.x);
      //console.log("n[i][0]: "+n[i][0]+", n[i][1]: "+n[i][1]);
      //console.log("path: "+path.length+" x "+path[0].length);
      var p = path[o.z+n[i][0]][o.x+n[i][1]]
      var type = map[o.z+n[i][0]][o.x+n[i][1]].type
      //Type 98 is the egg
      if (o.z+n[i][0] == e.z && o.x+n[i][1] == e.x) {
        var retPath = [[o.z+n[i][0],o.x+n[i][1]],[o.z,o.x]] 
        while ( 1==1 ) {
          var p = retPath[retPath.length-1];
          var pp = path[p[0]][p[1]]
          if (pp.parent.x == s.x && pp.parent.z == s.z) break;
          retPath.push([pp.parent.z, pp.parent.x])
        }
        var retVal = [];
        for (var i=retPath.length-1; i>=0; i--) {
          retVal.push({z:retPath[i][0],x:retPath[i][1]});
        }
        return retVal;
      }
      if (p.status == 0 && type == -1) {
        openlist.push({z:o.z+n[i][0],x:o.x+n[i][1]});
        p.status = 1;
        p.weight = path[o.z][o.x].weight+10;
        p.parent = {z:o.z,x:o.x};
      }
      else if (p.status == 1 && p.weight < path[par.z][par.x].weight) {
        path[o.z][o.x].parent={z:o.z+n[i][0],x:o.x+n[i][1]};
        path[o.z][o.x].weight=p.weight+10;
        console.log("Readjusting path due to weight");
      }
    }
    //Remove the chosen from the openlist
    openlist.splice(index,1);
  }
  return [];
}

function dist(p1,p2) {
  var pos1=coordToPos(p1.z,p1.x);
  var pos2=coordToPos(p2.z,p2.x);
  var dist=Math.sqrt(Math.pow((pos1.z-pos2.z),2)+Math.pow((pos1.x-pos2.x),2))
  return dist; 
}

function raycast(event) {
  var mouse = new THREE.Vector2()
  mouse.x = ( event.clientX / window.innerWidth ) * 2 - 1;
  mouse.y = -( event.clientY / window.innerHeight ) * 2 + 1
  var raycaster = new THREE.Raycaster();
  raycaster.setFromCamera( mouse, camera );
  var intersects = raycaster.intersectObjects( objects );
  return intersects;
}

function mMove(event) {
  var intersects=raycast(event);
  if ( intersects.length > 0 ) { 
    var c = intersects[0];
    var p = posToCoord(c.point.x, c.point.z);
    if (p.z >= zmax) p.z = zmax-1;
    if (p.x >= xmax) p.x = xmax-1;
    if (p.z < 0) p.z = 0;
    if (p.x < 0) p.x = 0;
    var t = map[p.z][p.x]
    if (t.type == -1) text="Empty Space";
    else if (t.type == 0) text="Multi Hit Tower";
    else if (t.type == 1) text="Poison Tower";
    else if (t.type == 2) text="Freeze Tower";
    else if (t.type == 3) text="Splash Tower";
    else if (t.type == 4) text="Anti-Air Tower";
    else if (t.type == 5) text="Anti-Ground Tower";
    else if (t.type == 6) text="Speed Boost Tower";
    else if (t.type == 7) text="Fast Attack Tower";
    else if (t.type == 98) text="Egg";
    else if (t.type == 99) text="Wall";
    else text="Somethings Wrong";
    if ("level" in t) text += " (Lvl "+t.level+")"
      document.getElementById("info").innerHTML=text;
  }
}

function attackDone() {
  for (var i=0, len=mobs.length; i<len; i++) {  
    if (mobs[i].active) return false; 
  }
  return true;
}

function moveMobs() {
  for (var i=0, len=mobs.length; i<len; i++) {  
    var m = mobs[i];
    if (!(m.active)) continue;
    if (!("target" in m)) m.target = 0;
    var target = coordToPos(mobPath[m.target].z,mobPath[m.target].x);
    var xdiff = target.x - m.mesh.position.x;
    var zdiff = target.z - m.mesh.position.z;
    var total = Math.sqrt(Math.pow(xdiff,2)+Math.pow(zdiff,2));
    if (total < 0.4) {
      m.target += 1;
      if (m.target == 3 && i != mobs.length-1) mobs[i+1].active = true;
      if (m.target > mobPath.length-1 || m.health < 1) {
        scene.remove(m.mesh);
        m.active = false;
        if (m.health > 0) {
          lives -= 1;
          document.getElementById("lives").innerHTML = "Lives: "+lives;
        }
        if (attackDone()) {
          attacking = false; 
          removeBullets();
          mobs = [];
          document.getElementById("step").innerHTML='Place 5 more Gems!'
          document.getElementById("warn").innerHTML="Round "+round+" Finished!"
          return;
        }
      }
    }
    else {
      m.mesh.position.x += xdiff/total/20;
      m.mesh.position.z += zdiff/total/20;
    }
  }
}

function removeBullets() {
  for (var i=0, len=towers.length; i<len; i++) {
    for (var j=0, jlen=towers[i].bullets.length; j<jlen; j++) {
      scene.remove(towers[i].bullets[j].mesh);
    }
    towers.bullets=[];
  }
}


function healthColor(health) {
  var t = 100*round;
  var h = (health >= 0)? health/t:0;
  return new THREE.Color("rgb("+Math.floor(512*(1-h))+","+Math.floor(512*h)+",0)");
}

function towerAttack() {
  for(var i=0, ilen=towers.length; i<ilen; i++) {
    //Move the bullets towards thier target
    for (var j=0, jlen=towers[i].bullets.length; j<jlen; j++) {
      var bullet = towers[i].bullets[j];
      var pos = bullet.mesh.position;
      var target = mobs[bullet.target];
      if (target == undefined) continue;
      var moveBy = bullet.end.clone().sub(pos).normalize().divideScalar(10);
      //Bullet hitting it's target
      if (pos.distanceTo(bullet.end) < moveBy.length()) {
        target.health -= towers[i].damage;
        target.mesh.material.color = healthColor(target.health);
        scene.remove(bullet.mesh);
        towers[i].bullets.splice(j,1);
        jlen -= 1;
        towers[i].delay = towers[i].speed;
      }
      else bullet.mesh.position.add(moveBy);
    }
    towers[i].delay -= 1;
    if (towers[i].delay > 0) continue;
    //Shoot new bullets at nearby mobs
    for (var j=0, jlen=mobs.length; j<jlen; j++) {
      if (mobs[j].health < 1) continue;
      if (towers[i].bullets.length < towers[i].num && shooting(i,j) == false) {
        var m = mobs[j].mesh.position;
        var t = coordToPos(towers[i].z,towers[i].x);
        var start = new THREE.Vector3(t.x,0.6,t.z);
        var d = m.distanceTo(start);
        if (d < towers[i].range) { 
          var type = map[towers[i].z][towers[i].x].type;
          var geometry = new THREE.SphereGeometry( .1 );
          var material = new THREE.MeshLambertMaterial( {color: colors[type]} );
          var bullet = new THREE.Mesh( geometry, material );
          bullet.position.set(t.x, 0.6, t.z);
          scene.add(bullet);
          towers[i].bullets.push({start:start,end:m,mesh:bullet,target:j});
        }
      }
    } 
  }
}

function shooting(t,m) {
  for (var i=0, len=towers[t].bullets.length; i<len; i++) {
    if (towers[t].bullets[i].target == m) return true
  }
  return false;
}

function animate() {
  if (attacking) {
    moveMobs();
    towerAttack();
  }
  if (moveBackward) {
    camera.position.z += .5;
    if (camera.position.z > 28.5) camera.position.z = 28.5;
  }
  if (moveForward) {
    camera.position.z -= .5;
    if (camera.position.z < 7.5) camera.position.z = 7.5;
  }
  if (moveRight) {
    camera.position.x += .5;
    if (camera.position.x > 21.5) camera.position.x = 21.5;
  }
  if (moveLeft) {
    camera.position.x -= .5;
    if (camera.position.x < 6) camera.position.x = 6;
  }
  renderer.render( scene, camera );
  requestAnimationFrame(animate);
//  console.log(camera.position.x)
}

function updateGUI(){
  var box=document.getElementById("step")
  if (ondeck.length == 0) 
    box.innerHTML = '<button onclick="startRound()">Start Round</button>';
  else box.innerHTML=step+" more gems to place";
}
  
function rn(min,max){return Math.floor(Math.random()*(max-min+1)+min)}

window.addEventListener( 'keydown', function(e){onKey(e.keyCode,true)}, false );
window.addEventListener( 'keyup', function(e){onKey(e.keyCode,false)}, false );

var onKey = function (x,bool) {
  if (x == 38 || x == 87) moveForward = bool;
  else if (x == 37 || x == 65) moveLeft = bool;
  else if (x == 40 || x == 83) moveBackward = bool;
  else if (x == 39 || x == 68) moveRight = bool;
  else if (x == 17) restartPath();
  else if (x == 32) findPath({z:7,x:8},goals[0]);
  }

</script>
