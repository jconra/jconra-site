<!DOCTYPE HTML>
<html>
<head>
<style>
body {    
margin: 0px;
padding: 0px; }
canvas { display: block; }
</style>
</head>
<body>
    
<canvas id="myCanvas" width="1000" height="600"></canvas>

<script>
var canvas = document.getElementById('myCanvas');
var ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

rocks = new Array();
stars = new Array();
candy = new Array();

function initialize(){
	saved = 0;
	health = 100;
	firereset=0;
	score = 0;
	angle = 45;
	velocity = 0;
	thrust = 0;
	rthrust = 0;
	range = 300;
	xcoord = 1.0*(canvas.width/2);
	ycoord = 1.0*(canvas.height/2);
	xinertia = 0;
	yinertia = 0;
	xmap = 0;
	ymap = 0;
	message = 100;
	left = false;
	up = false;
	right = false;
	fire = false;
	line = false;
	down = false;
	for(i=0;i<50;i++){rocks[i]=makerock(i);}
	for(i=0;i<500;i++){stars[i]=[rn(-100,1800),rn(-100,1100),rn(1,3)];}
	for(i=0;i<4;i++){candy[i]=[rn(-1000,2500),rn(-500,1500)];}}

initialize();

function makerock(i){return rock=[-xmap+rn(-100,1800),-ymap+rn(-100,1100),rn(10,50), Math.floor(i/10)+1, rn(60,100), rn(60,100), rn(60,120), rn(60,120), rn(-60,60), rn(-60,60), rn(-60,60), rn(-60,60), rn(-60,60), rn(-60,60),rn(50,100),rn(25,50)];}

function rn(min,max){return Math.floor( Math.random()*(max-min)+min);}


function gradient(i,t,r1,r2){
	switch(i){
		case 1: grd=ctx.createLinearGradient(r1, 0, r2, 0);break;
		case 2: grd=ctx.createLinearGradient(0, r1, 0, r2);break;}
	switch(t){
		case 1: grd.addColorStop(0,  "#111111"); 
				grd.addColorStop(.5, "#666666"); 
				grd.addColorStop(1,  "#111111");break;
		case 2: grd.addColorStop(0,  "#FFFFFF"); 
				grd.addColorStop(.2, "#8888FF"); 
				grd.addColorStop(.4, "#DDDDDD"); 
				grd.addColorStop(.6, "#5555CC"); 
				grd.addColorStop(.8, "#999999"); 
				grd.addColorStop(1,  "#000088");break;
		case 3: grd.addColorStop(0,  "#FF0000");  
				grd.addColorStop(1,  "transparent");break;}
	return grd;}
   
function draw(){

	ctx.fillStyle = 'black';
	ctx.fillRect(0,0,canvas.width,canvas.height);
   
	function astroid(i){
		var x = xmap+rocks[i][0];
		var y = ymap+rocks[i][1];
		var s = rocks[i][2]/50;
		ctx.beginPath();
		ctx.moveTo(x-rocks[i][6]*s,y+20*s);
		ctx.bezierCurveTo(x-rocks[i][6]*s, y-20*s, x-rocks[i][5]*s, y-rocks[i][5]*s, x-20*s, y-rocks[i][7]*s);
		ctx.bezierCurveTo(x+20*s, y-rocks[i][7]*s, x+rocks[i][4]*s, y-rocks[i][4]*s, x+rocks[i][6]*s, y-20*s);
		ctx.bezierCurveTo(x+rocks[i][6]*s, y+20*s, x+rocks[i][5]*s, y+rocks[i][5]*s, x+20*s, y+rocks[i][7]*s);
		ctx.bezierCurveTo(x-20*s, y+rocks[i][7]*s, x-rocks[i][4]*s, y+rocks[i][4]*s, x-rocks[i][6]*s, y+20*s);
		var r=(rocks[i][4]+rocks[i][5]+rocks[i][6]+rocks[i][7])/3*s;
		var grd = ctx.createRadialGradient(x,y,1,x,y,r);
		if (rocks[i][3]>2) var blue=100; else var blue=0;
		var color1="rgb("+(rocks[i][14]+blue+rocks[i][3]*20-50)+","+(rocks[i][15]+blue+rocks[i][3]*20-50)+","+blue+")";
		var color2="rgb("+25+","+10+","+0+")";
		grd.addColorStop(0,color1);
		grd.addColorStop(1,color2);
		ctx.fillStyle=grd;
		ctx.fill();
		clr1='rgba(0,0,0,.5)';clr2='transparent';
		circle(x+rocks[i][8]*s,y+rocks[i][9]*s,rocks[i][2],clr1,clr2);
		circle(x+rocks[i][10]*s,y+rocks[i][11]*s,rocks[i][2],clr1,clr2);
		circle(x+rocks[i][12]*s,y+rocks[i][13]*s,rocks[i][2],clr1,clr2);}
		
	function circle(x,y,r,cl1,cl2){
		ctx.beginPath();
		var grd = ctx.createRadialGradient(x,y,1,x,y,r);
		grd.addColorStop(0,cl1);
		grd.addColorStop(1,cl2);
		ctx.fillStyle=grd;
		ctx.arc(x, y, r ,0,Math.PI*2);
		ctx.fill();}
   
	ctx.fillStyle = 'white';
	for(i=0;i<100;i++){
		if (xmap+stars[i][0]>1800) {stars[i][0]-=1800; stars[i][1]+=rn(-500,500);}
		if (xmap+stars[i][0]<-200) {stars[i][0]+=1800; stars[i][1]+=rn(-500,500);}
		if (ymap+stars[i][1]>1100) {stars[i][1]-=1100; stars[i][0]+=rn(-500,500);}
		if (ymap+stars[i][1]<-200) {stars[i][1]+=1100; stars[i][0]+=rn(-500,500);}
	ctx.beginPath();
	var x = xmap+stars[i][0];
	var y = ymap+stars[i][1];
	ctx.arc(x, y, stars[i][2], 0, Math.PI*2);
	ctx.fill();}
	
	for(i=0;i<rocks.length;i++){
	rocks[i][1]-=rocks[i][3]*(score/100+1);
		if (xmap+rocks[i][0]>1800) {rocks[i]=makerock(i);rocks[i][0]=-xmap-400;}
		if (xmap+rocks[i][0]<-400) {rocks[i]=makerock(i);rocks[i][0]=-xmap+1800;}
		if (ymap+rocks[i][1]>1500) {rocks[i]=makerock(i);rocks[i][1]=-ymap-400;}
		if (ymap+rocks[i][1]<-400) {rocks[i]=makerock(i);rocks[i][1]=-ymap+1500;}
	astroid(i);}

	for(i=0;i<candy.length;i++){
		x=xmap+candy[i][0];y=ymap+candy[i][1];
		if (x>2500) {candy[i][0]-=3500; candy[i][1]+=rn(-500,500);}
		if (x<-1000){candy[i][0]+=3500; candy[i][1]+=rn(-500,500);}
		if (y>1000) {candy[i][1]-=1500; candy[i][0]+=rn(-500,500);}
		if (y<-500) {candy[i][1]+=1500; candy[i][0]+=rn(-500,500);}
		switch(i){
			case 0: str="Health";clr1='#99FF99';clr2='#009900';break;
			case 1: str="Range"; clr1='#FF9999';clr2='#990000';break;
			case 2: str="Points";clr1='#9999FF';clr2='#000099';break;
			case 3: str="  Pod"; clr1='#888888';clr2='#000000';break;}
		circle(x,y,40,clr1,clr2);
		ctx.fillStyle='white';
		ctx.fillText(str,x-35,y+10);
		dx=x-xcoord;  //horizontal distance
		dy=y-ycoord;  //vertical distance
		h=Math.sqrt(dx*dx+dy*dy);    //find hypotonise
		if (h<=50+10){
		switch(i){
		case 0:health+=20;break;
		case 1:range+=50;break;
		case 2:score+=20;break;
		case 3:saved+=1;score+=20;
				if (saved==10){alert("You Beat the game with "+ score + " points!");
				initialize();}break;}
		candy[i][0]+=rn(1500,3500);candy[i][0]+=rn(1100,3300);}}

	if (fire){
        for (i=0;i<rocks.length;i++){
			if (rocks[i][3]>2){
				dx=xmap+rocks[i][0]-xcoord;  //horizontal distance
				dy=ymap+rocks[i][1]-ycoord;  //vertical distance
				h=Math.sqrt(dx*dx+dy*dy);    //find hypotonise
				if (h<=range){
					var ark=Math.atan((rocks[i][2]*2)/h)*360/Math.PI;
					var ang=Math.atan(dx/(dy*-1))*180/Math.PI;
					if (((dx<0)&&(dy>0))||((dx>0)&&(dy>0)))ang+=180;
					if (angle>270) ang+=360;
					if ((angle>(ang-(ark/2)))&&(angle<(ang+(ark/2)))){
						ctx.beginPath();
						ctx.arc(xmap+rocks[i][0], ymap+rocks[i][1], rocks[i][2]*2, 0, Math.PI*2);
						ctx.fillStyle="white";
						ctx.fill();
						rocks[i]=makerock(i);
						rocks[i][1]=-ymap+1500;
						score++;}}}}}

	if (line){
		ctx.beginPath();
		ctx.moveTo(xmap+candy[3][0],ymap+candy[3][1]);
		ctx.lineTo(xcoord,ycoord);
		ctx.lineWidth="1";
		ctx.strokeStyle="#FFFFFF";
		ctx.stroke();}
						
	ctx.translate(xcoord , ycoord);
	ctx.rotate(angle*Math.PI / 180);
	
	if (thrust>0){
	for(i=0;i<2;i++){
	ctx.beginPath();
	ctx.moveTo(-20+(i*20),30)
	ctx.lineTo(i*20,30)
	ctx.lineTo(-10+(i*20),70)
	ctx.lineTo(-20+(i*20),30)
	ctx.fillStyle=gradient(2,2,30,70);
	ctx.fill();
	ctx.closePath();}
	if (!up)thrust--;}
	if (rthrust>0){
	for(i=0;i<2;i++){
	ctx.beginPath();
	ctx.moveTo(-20+(i*20),30)
	ctx.lineTo(i*20,30)
	ctx.lineTo(-10+(i*20),-70)
	ctx.lineTo(-20+(i*20),30)
	ctx.fillStyle=gradient(2,2,30,-70);
	ctx.fill();
	ctx.closePath();}
	if (!down)rthrust--;}
	ctx.beginPath();
	ctx.strokeStyle="#555555";
	ctx.lineWidth="2";
	for(i=-1;i<2;i++){
	ctx.moveTo(30*i,20);
	ctx.lineTo(25*i,-10);}
	ctx.stroke();
	if(fire){                                                  //laser fire
	ctx.beginPath();
	ctx.strokeStyle=gradient(2,3,-10,-range);
	for(i=-1;i<2;i++){
	if (i==0) i++;
	ctx.moveTo(25*i,-10);
	ctx.lineTo(0,(range*-1));}
	ctx.lineWidth="4";
	ctx.stroke();
	fire=false;}
	ctx.beginPath();
	ctx.moveTo(0,-30);
	ctx.lineTo(40,20);
	ctx.lineTo(50,50);
	ctx.lineTo(0,18);
	ctx.lineTo(-50,50);
	ctx.lineTo(-40,20);
	ctx.lineTo(0,-30);
	ctx.fillStyle=gradient(2,1,-30,30);
	ctx.fill();
	ctx.closePath();
	ctx.beginPath();
	ctx.moveTo(0,-70);
	ctx.lineTo(20,30);
	ctx.lineTo(-20,30);
	ctx.lineTo(0,-70);
	ctx.fillStyle=gradient(1,1,-20,20);
	ctx.fill();
	ctx.closePath();
	ctx.beginPath();
	ctx.moveTo(0,-30);
	ctx.lineTo(8,-10);
	ctx.lineTo(-8,-10);
	ctx.lineTo(0,-30);
	ctx.fillStyle = '#222299';
	ctx.fill();
	ctx.closePath();
	

	ctx.rotate(-angle*Math.PI / 180);
	ctx.translate(-xcoord , -ycoord);
	
	function crash(){
        for (i=0;i<rocks.length;i++){
			if (rocks[i][3]>2){
				var dx=xmap+rocks[i][0]-xcoord;  //horizontal distance
				var dy=ymap+rocks[i][1]-ycoord;  //vertical distance
				var h=Math.sqrt(dx*dx+dy*dy);    //find hypotonise
				var r=(rocks[i][4]+rocks[i][5]+rocks[i][6]+rocks[i][7])/3.5*(rocks[i][2]/50);
				if (h<=r+40){
						ctx.beginPath();
						ctx.arc(xmap+rocks[i][0], ymap+rocks[i][1], rocks[i][2]*2, 0, Math.PI*2);
						ctx.fillStyle="red";
						ctx.fill();
						rocks[i][1]=ymap*-1+900;
						rocks[i][0]+=rn(-500,500);
						health-=rocks[i][3];
						if (health<=0){
						alert("You Died! Your score was "+score);
						initialize();
						}}}}}
	crash();
	
	function scoreboard(){
		if (health>50) 		ctx.fillStyle='#55FF55';
		else if (health>20) ctx.fillStyle='#FFE303';
		else 				ctx.fillStyle='#FF0000';
		ctx.font = '20pt Calibri';
		ctx.fillText("Ship Health: "+health, 20, 20);
		ctx.fillStyle='#FF0000';
		ctx.fillText("Range: "+(range/10), 20, 40);
		ctx.fillStyle='#9999FF';
		ctx.fillText("Score: "+score, 20, 60);
		ctx.fillStyle='#FFFFFF';
		ctx.fillText("Saved: "+saved + "   Pods left: " + (10-saved) + "!", 220, 20);
		if (message>1){message--;
		ctx.fillText("Rescue your shipemates from their escape pods (press r for line to nearby pod)!", canvas.width-1000, 20);}
		}
	scoreboard();
	}

document.onkeydown = KeyDown;
function KeyDown(){
	var KeyID = event.keyCode;
	switch(KeyID){
	case 32:if (firereset==0) {fire=true;  
			firereset=1;}                break;       //Spacebar
	case 65:left=true;                   break;       //Arrow Left
	case 82:line=true;                   break;
	case 87:up=true; thrust=5;           break;       //Arrow Up
	case 83:down=true; rthrust=5;        break;       //Arrow Down
	case 68:right=true;                  break;}}     //Arrow Right
   
document.onkeyup = KeyUp;
function KeyUp(){
	var KeyID = event.keyCode;
	switch(KeyID){
	case 32:firereset=0;                 break;
	case 65:left=false;                  break;       //Arrow Left
	case 82:line=false;                  break;
	case 87:up=false;                    break;       //Arrow Up
	case 83:down=false;                  break;
	case 68:right=false;                 break;}}     //Arrow Right

	function start(){

	   function frame(){
		   if (left) angle-=10;
		   if (up) velocity++;
		   if (down) velocity--;
		   if (right) angle+=10;
		   if (angle>355) angle=0;
		   if (angle<0) angle=355;
		   var radangle=angle/180*Math.PI;
		   var xchange=Math.sin(radangle)*velocity;
		   var ychange=Math.cos(radangle)*velocity;
		   velocity=0;
		   
		   xinertia+=xchange;
		   yinertia+=ychange;
		   
		   if (xinertia>15) xinertia=15;
		   if (yinertia>15) yinertia=15;
		   if (xinertia<-15) xinertia=-15;
		   if (yinertia<-15) yinertia=-15;

		   xcoord+=xinertia;
		   ycoord-=yinertia;
		   
		   if (xcoord<300) {xmap+=(300-xcoord); xcoord=300;}
		   if (xcoord>(canvas.width-300)) {xmap-=xcoord-(canvas.width-300); xcoord=(canvas.width-300);}
		   if (ycoord<300) {ymap+=(300-ycoord); ycoord=300;}
		   if (ycoord>(canvas.height-300)) {ymap-=ycoord-(canvas.height-300); ycoord=(canvas.height-300);}

		   draw();
	   }
		
   var id = setInterval(frame, 50)}

start();
//ctx.font = '20pt Calibri';ctx.fillText("test", 20, 60);
</script>
</body>
</html>
