<!DOCTYPE HTML>
<html>
<head>
<style>
body {    
margin: 0px;
padding: 0px; }
canvas { display: block; }
</style>
</head>
<body>
    
<canvas id="myCanvas" width="1000" height="600"></canvas>

<script>

var canvas = document.getElementById('myCanvas');
var context = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

var message="hi";
var angle = 45;
var velocity = 0;
var thrust = 0;
var range = -300;
var xcoord = 1.0*(canvas.width/2);     //Always between 200 and 1400 at Fullscreen
var ycoord = 1.0*(canvas.height/2);    //Always between 200 and 800 at Fullscreen
var xinertia = 0;                      //Max at 50
var yinertia = 0;                      //Max at 50
var xmap = 0;
var ymap = 0;
var left = false;
var up = false;
var right = false;
var fire = false;
rocks = new Array();
stars = new Array();

for(i=0;i<50;i++){
rocks[i]=[Math.floor(Math.random() * 1800)-10,Math.floor(Math.random() * 1100)-10,Math.floor(Math.random() * 40)+10, Math.floor(i/3)];}
for(i=0;i<500;i++){
stars[i]=[Math.floor(Math.random() * 1800),Math.floor(Math.random() * 1100),Math.floor(Math.random() * 3)];}


var grd2 = context.createLinearGradient(-20, 0, 20, 0);
	grd2.addColorStop(0,  "#111111"); 
	grd2.addColorStop(.5, "#666666"); 
	grd2.addColorStop(1,  "#111111");
var grd1 = context.createLinearGradient(0, -30, 0, 30);
	grd1.addColorStop(0,  "#111111"); 
	grd1.addColorStop(.5, "#666666"); 
	grd1.addColorStop(1,  "#111111");
var grd3 = context.createLinearGradient(0, 30, 0, 70);
	grd3.addColorStop(0,  "#FFFFFF"); 
	grd3.addColorStop(.2, "#8888FF"); 
	grd3.addColorStop(.4, "#DDDDDD"); 
	grd3.addColorStop(.6, "#5555CC"); 
	grd3.addColorStop(.8, "#999999"); 
	grd3.addColorStop(1,  "#000088");
var grd5 = context.createLinearGradient(0,-10,0,-300);
	grd5.addColorStop(0,  "#FF0000");  
	grd5.addColorStop(1,  "transparent");
   
function draw(){
	context.fillStyle = 'black';
	context.fillRect(0,0,canvas.width,canvas.height);
   
	context.fillStyle = 'white';
	for(i=0;i<100;i++){
		if (xmap-(stars[i][0]*-1)>1800) {stars[i][0]-=1800; stars[i][1]+=Math.floor(Math.random()*100)-50;}
		if (xmap-(stars[i][0]*-1)<-200) {stars[i][0]+=1800; stars[i][1]+=Math.floor(Math.random()*100)-50;}
	    if (ymap-(stars[i][1]*-1)>1100) {stars[i][1]-=1100; stars[i][0]+=Math.floor(Math.random()*100)-50;}
		if (ymap-(stars[i][1]*-1)<-200) {stars[i][1]+=1100; stars[i][0]+=Math.floor(Math.random()*100)-50;}
	context.beginPath();
	var x = xmap+stars[i][0];
	var y = ymap+stars[i][1];
	context.arc(x, y, stars[i][2], 0, Math.PI*2);
	context.fill();}
    context.font = '10pt Calibri';
    context.fillText(message, xcoord+100, ycoord);
	
	
	for(i=0;i<rocks.length;i++){
	rocks[i][1]-=rocks[i][3];
		if (xmap-(rocks[i][0]*-1)>1800) {rocks[i][0]-=1800; rocks[i][1]+=Math.floor(Math.random()*100)-50;}
		if (xmap-(rocks[i][0]*-1)<-200) {rocks[i][0]+=1800; rocks[i][1]+=Math.floor(Math.random()*100)-50;}
	    if (ymap-(rocks[i][1]*-1)>1100) {rocks[i][1]-=1100; rocks[i][0]+=Math.floor(Math.random()*100)-50;}
		if (ymap-(rocks[i][1]*-1)<-200) {rocks[i][1]+=1100; rocks[i][0]+=Math.floor(Math.random()*100)-50;}
	var x = xmap+rocks[i][0];
	var y = ymap+rocks[i][1];
	context.beginPath();
	if (rocks[i][3]>10) var blue=40; else var blue=0;
	context.arc(x, y, rocks[i][2], 0, Math.PI*2);
	var grd4 = context.createRadialGradient(x, y, 1, x, y, rocks[i][2])
	var color1="rgb("+(blue+rocks[i][3]*6)+","+(blue+rocks[i][3]*4)+","+blue+")";
	var color2="rgb("+Math.floor(rocks[i][3]/2)*6+","+Math.floor(rocks[i][3]/2)*4+",00)";
	grd4.addColorStop(0, color1);  
	grd4.addColorStop(1, color2);
	context.fillStyle = grd4;
	context.fill();
	context.closePath();}

	
	if (fire){
        for (i=0;i<rocks.length;i++){
			if (rocks[i][3]>10){
				var dx=xmap+rocks[i][0]-xcoord;  //horizontal distance
				var dy=ymap+rocks[i][1]-ycoord;  //vertical distance
				var h=Math.sqrt(dx*dx+dy*dy);    //find hypotonise
				var ark=Math.atan(rocks[i][2]/h)*360/Math.PI;
				var ang=Math.atan(dx/(dy*-1))*180/Math.PI;
				if (((dx<0)&&(dy>0))||((dx>0)&&(dy>0)))ang+=180;
				if (angle>270) ang+=360;
				if ((angle>(ang-(ark/2)))&&(angle<(ang+(ark/2)))){
					context.beginPath();
					context.arc(xmap+rocks[i][0], ymap+rocks[i][1], rocks[i][2], 0, Math.PI*2);
					context.fillStyle="white";
					context.fill();
					rocks[i][1]=ymap*-1+900;
					rocks[i][0]=Math.floor(Math.random()*1800)-10;
				}
			}
		}
	}

   
	context.translate(xcoord , ycoord);
	context.rotate(angle*Math.PI / 180);
   
	context.beginPath();
	context.strokeStyle="#555555";
	context.lineWidth="2";
	for(i=-1;i<2;i++){
	context.moveTo(30*i,20);
	context.lineTo(25*i,-10);}
	context.stroke();
	if(fire){                                                  //laser fire
	context.beginPath();
	context.strokeStyle=grd5;
	for(i=-1;i<2;i++){
	if (i==0) i++;
	context.moveTo(25*i,-10);
	context.lineTo(0,range);}
	context.lineWidth="4";
	context.stroke();
	fire=false;}
	context.beginPath();
	context.moveTo(0,-30);
	context.lineTo(40,20);
	context.lineTo(50,50);
	context.lineTo(0,18);
	context.lineTo(-50,50);
	context.lineTo(-40,20);
	context.lineTo(0,-30);
	context.fillStyle = grd1;
	context.fill();
	context.closePath();
	context.beginPath();
	context.moveTo(0,-70);
	context.lineTo(20,30);
	context.lineTo(-20,30);
	context.lineTo(0,-70);
	context.fillStyle = grd2;
	context.fill();
	context.closePath();
	context.beginPath();
	context.moveTo(0,-30);
	context.lineTo(8,-10);
	context.lineTo(-8,-10);
	context.lineTo(0,-30);
	context.fillStyle = '#222299';
	context.fill();
	context.closePath();
	if (thrust>0){
	for(i=0;i<2;i++){
	context.beginPath();
	context.moveTo(-20+(i*20),30)
	context.lineTo(i*20,30)
	context.lineTo(-10+(i*20),70)
	context.lineTo(-20+(i*20),30)
	context.fillStyle = grd3;
	context.fill();
	context.closePath();}
	if (!up)thrust--;}

	context.rotate(-angle*Math.PI / 180);
	context.translate(-xcoord , -ycoord);
	}

document.onkeydown = KeyDown;
function KeyDown(){
	var KeyID = event.keyCode;
	switch(KeyID){
	case 32:fire=true;             break;       //Spacebar
	case 65:left=true;             break;       //Arrow Left
	case 87:up=true; thrust=5;     break;       //Arrow Up
	case 68:right=true;            break;}}     //Arrow Rigaaaaaaaht
   
document.onkeyup = KeyUp;
function KeyUp(){
	var KeyID = event.keyCode;
	switch(KeyID){
	case 65:left=false;            break;       //Arrow Left
	case 87:up=false;              break;       //Arrow Up
	case 68:right=false;           break;}}     //Arrow Right
   
	function start(){

	   function frame(){
		   if (left) angle-=10;
		   if (up) velocity++;
		   if (right) angle+=10;
		   if (angle>355) angle=0;
	       if (angle<0) angle=355;
		   var radangle=angle/180*Math.PI;
		   var xchange=Math.sin(radangle)*velocity;
		   var ychange=Math.cos(radangle)*velocity;
		   velocity=0;
		   
		   xinertia+=xchange;
		   yinertia+=ychange;
		   
		   if (xinertia>50) xinertia=50;
		   if (yinertia>50) yinertia=50;
		   if (xinertia<-50) xinertia=-50;
		   if (yinertia<-50) yinertia=-50;

		   xcoord+=xinertia;
		   ycoord-=yinertia;
		   
		   if (xcoord<200) {xmap+=(200-xcoord); xcoord=200;}
		   if (xcoord>(canvas.width-200)) {xmap-=xcoord-(canvas.width-200); xcoord=(canvas.width-200);}
		   if (ycoord<200) {ymap+=(200-ycoord); ycoord=200;}
		   if (ycoord>(canvas.height-200)) {ymap-=ycoord-(canvas.height-200); ycoord=(canvas.height-200);}

		   draw();
	   }
		
   var id = setInterval(frame, 100)}

start();
</script>
</body>
</html>
