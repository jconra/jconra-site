<!DOCTYPE HTML>
<html>
<head>
<title>
Astar Demo
</title>
<style>
body {    
margin: 0px;
padding: 0px;
canvas { display: block; }
</style>
</head>
<body>
<canvas id="myCanvas" width="1000" height="1000"></canvas>

<script>
var can, ctx, canX = 0, canY = 0, xDown = 0, yDown = 0, mouseIsDown = 0, x = 0, y = 0, scale = 1;
var clr = ["blue","tan","#00AA00","#00BB00","#00CC00","#22DD11","#33BB00","#119900","#448800","#557700","#666633","#888888","#EEEEEE"];
start = {x:0,y:0};
end = {x:0,y:0};
var size = 70;
var path=[];

can = document.getElementById("myCanvas");
ctx = can.getContext("2d");
cw = can.width = window.innerWidth;
ch = can.height = window.innerHeight;
var xsp = cw/size;
var ysp = (ch-50)/size;
var map = [];
for(var i =0; i <size; i++){
map[i] = [];for(var j =0; j<size;j++) map[i].push(0);}

makeLand();
function makeLand(){
var land = size*2;
while (land > 0){
var x=rn(1, size-1)
var y=rn(1, size-1)
for(var h =0; h<20; h++){
x += rn(-1,2);
y += rn(-1,2);
if (x<1) x=1;
if (y<1) y=1;
if (x>size-2) x = size-2;
if (y>size-2) y = size-2;
for(var i =-1; i<2; i++){
for(var j =-1; j<2; j++){
map[x+i][y+j] = 1;
}
}
}
land--;
}
for(var h=0; h<11; h++){
for(var i=1; i < size-1; i++){
for(var j=1; j < size-1; j++){
var total = 0;
for(var k=-1; k < 2; k++){
for(var l=-1; l < 2; l++){
if (map[i+k][j+l] > h) total++;
}
}
if (total == 9) map[i][j]++;
}
}
}
}
can.addEventListener("mousedown", mouseDown, false);
can.addEventListener("touchstart", touchDown, false);
can.addEventListener("touchmove", touchXY, true);
can.addEventListener("touchend", touchUp, false);
document.body.addEventListener("touchcancel", touchUp, false);
function touchUp()   {}
function touchDown() {touchXY();}
function touchXY(e) {
if (!e)
var e = event;
e.preventDefault();
xDown=canX; yDown=canY;
canX = e.targetTouches[0].pageX - can.offsetLeft;
canY = e.targetTouches[0].pageY - can.offsetTop;
showPos();
}

function mouseDown(e){
xDown=canX; yDown=canY;
canX = e.pageX;
canY = e.pageY;
showPos();
}

function showPos() {
var xgrid = Math.floor(canX/xsp)
var ygrid = Math.floor(canY/ysp)
if (start.x == 0 && start.y == 0){
start.x = xgrid; start.y = ygrid;}
else if (end.x == 0 && end.y == 0){
end.x = xgrid; end.y = ygrid;
try{
path = pathfind(start.x, start.y, end.x, end.y);
}
catch(e){alert(e)}
if (path.length==0) alert("No Path!")
}
else {start = {x:0,y:0}; end = {x:0,y:0};
path = []; draw();}
drawPath();}
draw();


function rn(min,max){return Math.floor( Math.random()*(max-min)+min);}
		
function draw(){
ctx.fillStyle = "black"
ctx.fillRect(0,0,cw,ch);
for(var i = 0; i <map.length; i++){
for(var j = 0; j <map[0].length; j++){
ctx.fillStyle = clr[map[i][j]];
ctx.fillRect(i*xsp, j*ysp, xsp+1, ysp+1);
}}}

function drawPath(){
if (start.x !=0 || start.y !=0){
ctx.fillStyle = "yellow";
ctx.fillRect(start.x*xsp, start.y*ysp, xsp+1, ysp+1);}
if (end.x !=0 || end.y !=0){
ctx.fillStyle = "red";
ctx.fillRect(end.x*xsp, end.y*ysp, xsp+1, ysp+1);
}
if (path.length > 0) {
ctx.fillStyle = "black";
for(var i=1; i<path.length; i++){
ctx.fillRect(path[i][0]*xsp+xsp/4, path[i][1]*ysp+ysp/4, xsp/2, ysp/2)
}
}
}

function pathfind(cx,cy,tx,ty){
  var x;
  var y;
  var openlist = new Array();
  var closedlist = new Array();
  openlist[0]=[cx,cy,cx,cy,0,(Math.abs(cx-tx)+Math.abs(cy-ty))];
  var count = 0;
  while (openlist.length>0){
    count++;
    var lowestf=5000;
    var index=0;
    for (i=0;i<openlist.length;i++){
      if ((openlist[i][4]+openlist[i][5])<lowestf){
        lowestf = (openlist[i][4]+openlist[i][5]);
        index = i;
      }
    }
    closedlist[closedlist.length] = openlist[index];
    x = openlist[index][0];
    y = openlist[index][1];
    var cg = openlist[index][4];
    openlist.splice(index,1);
    for (i=-1;i<2;i++){
      for (j=-1;j<2;j++){
        if ((i==0)||(j==0)) var g = 10;                      
        else var g = 16;
        if (x+i < 0 || x+i > map.length-1 || y+j < 0 || x+j >map[0].length-1) continue;
        if (map[x+i][y+j]>0){
          var onlist = -1;
          for(var k=0;k<closedlist.length;k++){
            if ((closedlist[k][0]==(x+i))&&(closedlist[k][1]==(y+j)))
            onlist = k;
          }
          if (onlist==-1){
            for(var k=0;k<openlist.length;k++){     
              if ((openlist[k][0]==(x+i))&&(openlist[k][1]==(y+j)))
              onlist = k;
            }
            if (onlist==-1){
              openlist[openlist.length] = [x+i,y+j,x,y,cg+g,Math.sqrt(Math.pow((x+i)-tx,2)+Math.pow((y+j)-ty,2))*20];
            }
            else {                              
              if (openlist[onlist][4]>(cg+g)){
                openlist[onlist][2]=x;
                openlist[onlist][3]=y;
                openlist[onlist][4]=(cg+g);
              }
            }
          }
        }
      }
    }
    if ((x==tx)&&(y==ty)) break; 
    //alert("path found")}
    else if (openlist.length==0) return [];
    //if (count%10==0) alert(openlist.length + "\n" + count)
  }
  var path = new Array();
  if ((x==tx)&&(y==ty)){
    while ((cx!=x)||(cy!=y)){
      var index = 0;
        for (i=0;i<closedlist.length;i++){
          if ((closedlist[i][0]==x)&&(closedlist[i][1]==y))
          index = i;
        }
        path[path.length]=[x,y];
        x = closedlist[index][2];
        y = closedlist[index][3];
      }
    }
    return path;
  }

</script>
</body>
</html>
