<!DOCTYPE HTML>
<html>
<head>
<meta charset="UTF-8">
<style>
body { margin: 0px; padding: 0px; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="myCanvas" width="800" height="800"></canvas>

<script>

var canvas = document.getElementById('myCanvas');
var ctx = canvas.getContext('2d');
var cw = canvas.width = window.innerWidth;
var ch = canvas.height = window.innerHeight;

var depth = 500;
var camera = {x:0, y:0, z:-20};
var points = [];
var mosx = mosy = 0;
var startPoint;
var bring = 0;


function rn(min,max){return Math.floor( Math.random()*((max+1)-min)+min);}

for (var i = 0; i < 100; i++){
  var tempArray = [];
  for (var j = 0; j < 500; j++){
    var t = rn(1,360), s = rn(1,360);
    tempArray.push({x:Math.cos(s/180*Math.PI)*Math.sin(t/180*Math.PI)*250,
 y:Math.sin(s/180*Math.PI)*Math.sin(t/180*Math.PI)*250,
                    z:Math.cos(t/180*Math.PI)*250});
  }
  var best = 0, max = 0, scoreArray = [];;
  for (var j = 0; j < tempArray.length; j++){
    var t = tempArray[j];
    var tempmin = 1000; 
    for (var k = 0; k < points.length; k++){
      var p = points[k];
      var dist = Math.sqrt((p.x - t.x)*(p.x - t.x) + (p.y - t.y)*(p.y - t.y) + (p.z - t.z)*(p.z - t.z))
      if (tempmin > dist){tempmin = dist;}
    }
    scoreArray.push({index:j,score:tempmin});
  }
  maxmin = 0;
  for (var j = 0; j < scoreArray.length; j++){
    if (scoreArray[j].score > maxmin){maxmin = scoreArray[j].score; best = scoreArray[j].index;} 
  }
  points.push({x:tempArray[best].x,
               y:tempArray[best].y,
               z:tempArray[best].z,n:i});
}

draw();
function draw(){
	ctx.fillStyle = "white";
	ctx.rect(0,0,cw,ch);
	ctx.fill();
  ctx.strokeStyle = "black";
  sortArray();
  
  //Draw Background Rectangles
  ctx.lineWidth = 5;
	for(var i = 0; i < Math.floor(points.length/2)+1; i++){
		ctx.beginPath();
    ctx.fillStyle = "#AAAAFF";
    var scale = depth/(depth+points[i].z+camera.z);
    var x = cw/2 + (points[i].x+camera.x)*scale;
    var y = ch/2 + (points[i].y+camera.y)*scale;
    ctx.rect(x-20*scale,y-10*scale,40*scale,20*scale);
    ctx.stroke();
    ctx.fill();
    ctx.fillStyle="black";

  }
    
  //Draw Lines
  ctx.lineWidth = 2;
	for(var i = 0; i < points.length; i++){
    var scale = depth/(depth+points[i].z+camera.z);
    ctx.beginPath();
    ctx.moveTo(cw/2,ch/2);
    ctx.lineTo(cw/2+points[i].x*scale,ch/2+points[i].y*scale);
    ctx.stroke();
  }
  
  //Draw Forward rectangles
  ctx.lineWidth = 5;
	for(var i = Math.floor(points.length/2); i < points.length; i++){
		ctx.beginPath();
    ctx.fillStyle = "#AAAAFF";
    var scale = depth/(depth+points[i].z+camera.z);
    var x = cw/2 + (points[i].x+camera.x)*scale;
    var y = ch/2 + (points[i].y+camera.y)*scale;
    
  var xx=(50-Math.abs(points[i].x))/50
  var yy=(50-Math.abs(points[i].y))/50
  ctx.rect(x-20*scale,y-10*scale,40*scale,20*scale);
      ctx.stroke();
      ctx.fill();
      ctx.fillStyle="black";
  ctx.font= (8*scale)+ "px Arial";
  ctx.fillText(points[i].n,x-3*scale,y+2*scale)
  }

  function display(n){
    ctx.fillText(points[n].x,20,50);
    ctx.fillText(points[n].y,20,70);
    ctx.fillText(points[n].z,20,90);
    a = rotate(find(bring),0,0);
    ctx.fillText(a.x,20,110);
    ctx.fillText(a.y,20,130);
    ctx.fillText(bring,20,400)
    ctx.fillText(n,50,400);
    ctx.fillText((3.14-Math.abs(a.x))*a.x/ Math.abs(a.x), 20,420);
    ctx.fillText((3.14-Math.abs(a.y))*a.y/ Math.abs(a.y), 20,440);
  }
}
  
function sortArray(){
  newArray = [];
  while (points.length > 0){
    var max = -1000000, index = -1;
    for(var i = 0; i < points.length; i++){
      if (points[i].z > max) {max = points[i].z; index = i}
    }
  newArray.push(points.splice(index,1)[0]);
  }
  points = newArray;
}

function rotate(n,xang,yang){
  var x = points[n].x;
	var y = points[n].y;
  var z = points[n].z;
 
  var xdist = Math.sqrt(z*z + x*x);
	var ax = Math.atan2(x,z);
	ax += xang/180*Math.PI;
  z=points[n].z=Math.cos(ax)*xdist;
  points[n].x=Math.sin(ax)*xdist;
 
  var ydist = Math.sqrt(z*z + y*y);
  var ay = Math.atan2(y,z);
  ay += yang/180*Math.PI;
  points[n].z=Math.cos(ay)*ydist;
  points[n].y=Math.sin(ay)*ydist;
  return {x:ax,y:ay};
}

canvas.addEventListener("touchend", function(){mosx=0;},false);



canvas.addEventListener("touchmove", function(e){
  e.preventDefault();
  var tempx = tempy = 0;
  if (mosx != 0){tempx = mosx, tempy = mosy;}
  mosx = e.targetTouches[0].pageX - canvas.offsetLeft;
  mosy = e.targetTouches[0].pageY - canvas.offsetTop;
  if (Math.abs((tempx-mosx) + (tempy-mosy)) < 50){
    for(var i = 0; i < points.length; i++){
    a = rotate(i,(tempx-mosx)/4,(tempy-mosy)/4);
    }
  }
  draw();
}, false);

var myVar=setInterval(function(){draw();rotateTo();},30);

function find(n){
  for(var i=0; i < points.length; i++){
    if (points[i].n == n) return i;
  }
}

function rotateTo(){
  a = rotate(find(bring),0,0);
  var xdiff = (3.14-Math.abs(a.x))*a.x/ Math.abs(a.x);
  var ydiff = (3.14-Math.abs(a.y))*a.y/ Math.abs(a.y);
  if (Math.PI-Math.abs(a.x) + Math.PI-Math.abs(a.y) < .03) bring++;
  for(var i = 0; i < points.length; i++){
    rotate(i,xdiff*3,ydiff*3); 
  }
  if (bring >= points.length) bring = 0;
}

</script>
</body>
</html>
