<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — jconra.com</title>
<style>
  @font-face { font-family: nasa; src: url("../fonts/nasalization-rg.ttf"); font-display: swap; }
  :root {
    --ground:#07090c; --panel:#10141a; --panel-hi:#151b23;
    --line:#212a34; --line-hi:#2f7d55;
    --ink:#ccd6de; --ink-dim:#7f8d99; --ink-faint:#59656f;
    --accent:#35e07d;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--ground); color:var(--ink); min-height:100vh;
    font:15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    /* faint grid, echoing the wireframe look of the labs themselves */
    background-image:
      linear-gradient(rgba(53,224,125,.026) 1px, transparent 1px),
      linear-gradient(90deg, rgba(53,224,125,.026) 1px, transparent 1px);
    background-size: 46px 46px;
  }
  .wrap { max-width:1020px; margin:0 auto; padding:56px 22px 80px; }

  header { border-bottom:1px solid var(--line); padding-bottom:22px; margin-bottom:34px; }
  .back {
    display:inline-block; font:11px/1 ui-monospace, "Courier New", monospace;
    letter-spacing:.18em; text-transform:uppercase; color:var(--ink-faint);
    text-decoration:none; margin-bottom:16px;
  }
  .back:hover { color:var(--accent); }
  h1 {
    font-family:nasa, ui-sans-serif, system-ui, sans-serif; font-weight:400;
    font-size:clamp(28px,5.5vw,42px); letter-spacing:.06em; color:#e8f1f5;
  }
  .lede { margin-top:10px; color:var(--ink-dim); max-width:56ch; font-size:14.5px; }

  h3.group { font:600 11px ui-monospace,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim); margin:26px 0 10px; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(290px,1fr)); align-items:start; }
  a.card {
    display:block; text-decoration:none; color:inherit;
    background:var(--panel); border:1px solid var(--line); border-radius:7px;
    padding:18px 19px 16px; position:relative; overflow:hidden;
    transition:border-color .16s ease, background .16s ease, transform .16s ease;
  }
  a.card:hover { border-color:var(--line-hi); background:var(--panel-hi); transform:translateY(-2px); }
  a.card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .card h2 {
    font-family:nasa, ui-sans-serif, sans-serif; font-weight:400; font-size:18px;
    letter-spacing:.05em; color:#e8f1f5; margin-bottom:7px;
  }
  a.card:hover h2 { color:var(--accent); }
  .card p { color:var(--ink-dim); font-size:13.5px; line-height:1.55; min-height:3.1em; }
  .meta {
    margin-top:13px; padding-top:11px; border-top:1px solid var(--line);
    display:flex; gap:9px; flex-wrap:wrap; align-items:center;
    font:10.5px/1 ui-monospace, "Courier New", monospace; letter-spacing:.09em;
    color:var(--ink-faint); text-transform:uppercase;
  }
  .tag { border:1px solid var(--line); border-radius:3px; padding:3px 6px; }
  .tag.v { color:var(--accent); border-color:rgba(53,224,125,.32); }
  footer {
    margin-top:46px; padding-top:18px; border-top:1px solid var(--line);
    font:11.5px/1.7 ui-monospace, "Courier New", monospace;
    color:var(--ink-faint); letter-spacing:.05em;
  }
  footer a { color:var(--ink-dim); }
  a.card.pic, div.card.pic { padding:0; }
  div.card { display:block; background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:18px 19px 16px; opacity:.75; }
  .card img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; border-bottom:1px solid var(--line); background:#0b0e12; }
  .card .txt { padding:14px 17px 15px; }
  .card.small p { min-height:0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../">&larr; jconra.com</a>
    <h1>Projects</h1>
    <p class="lede">Finished ideas, from this year back to the first things I built. Smaller experiments
      that feed the bigger ones are in <a href="../labs/" style="color:var(--accent)">the labs</a>.</p>
  </header>

  <div id="groups"><p class="lede">Loading the list…</p></div>

  <footer>Source: <a href="https://github.com/jconra/jconra-site">github.com/jconra/jconra-site</a></footer>
</div>
<script>
// the list lives in projects.json, which the town and the Town Map read too
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
fetch('projects.json').then(r => r.json()).then(({ groups, projects }) => {
  document.getElementById('groups').innerHTML = Object.entries(groups).map(([g, title]) => {
    const cards = projects.filter(p => p.group === g).map(p => {
      const tag = p.href ? 'a' : 'div', ext = p.href && /^https?:/.test(p.href) ? ' target="_blank" rel="noopener"' : '';
      const href = p.href ? ` href="${esc(p.href)}"` : '';
      const soon = p.href ? '' : '<div class="meta"><span class="tag">not online yet</span></div>';
      return p.img
        ? `<${tag} class="card pic"${href}${ext}><img src="/textures/projects/${esc(p.img)}.jpg" alt="" loading="lazy"><div class="txt"><h2>${esc(p.name)}</h2><p>${esc(p.text)}</p>${soon}</div></${tag}>`
        : `<${tag} class="card small"${href}${ext}><h2>${esc(p.name)}</h2><p>${esc(p.text)}</p>${soon}</${tag}>`;
    }).join('');
    return `<h3 class="group">${esc(title)}</h3><div class="grid">${cards}</div>`;
  }).join('');
});
</script>
</body>
</html>
