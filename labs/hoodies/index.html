<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoodie Lab</title>
<style>
  @font-face { font-family: nasa; src: url("../../fonts/nasalization-rg.ttf"); font-display: swap; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#05070a; }
  canvas { display:block; touch-action:none; }
  .tag { position:fixed; bottom:18%; transform:translateX(-50%); pointer-events:none; z-index:5;
         font:12px/1 nasa, ui-monospace, monospace; letter-spacing:.2em; text-transform:uppercase;
         color:#c7d4dd; text-shadow:0 2px 8px #000; opacity:0; transition:opacity .8s ease; }
  .tag.on { opacity:1; }
  #hint { position:fixed; left:0; right:0; bottom:22px; text-align:center; pointer-events:none; z-index:5;
          font:11px ui-monospace,"Courier New",monospace; letter-spacing:.12em; color:#8fa0ad;
          text-shadow:0 1px 4px #000; }
  #boot { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
          background:#05070a; color:#b9c8d2; font:13px nasa, "Courier New", monospace; letter-spacing:4px;
          transition:opacity .6s ease; }
  #boot.gone { opacity:0; pointer-events:none; }
  #back { position:fixed; top:16px; left:18px; z-index:6; font:11px ui-monospace,monospace; letter-spacing:.14em;
          color:#8fa0ad; text-decoration:none; text-transform:uppercase; }
  #back:hover { color:#e0c07a; }
</style>
</head>
<body>
<div id="boot">LOADING…</div>
<a id="back" href="../../">&larr; jconra.com</a>
<div class="tag" id="tag1">Hoodie 1</div>
<div class="tag" id="tag2">Hoodie 2</div>
<div id="hint">MOVE THE MOUSE TO SPIN THEM</div>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
} }
</script>
<script type="module">
// HOODIE LAB. Two Tripo generations of the same hoodie, side by side on the boxing demo's stage,
// spinning with the mouse. The stage, lights and spotlight below are lifted from labs/boxing
// unchanged so the two stay comparable under the same light.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const Q = new URLSearchParams(location.search);
const ARENA = 11;

const FORCE_GL1 = Q.has('gl1');
let renderer;
if (FORCE_GL1) {
  const cv = document.createElement('canvas');
  renderer = new THREE.WebGLRenderer({ canvas: cv, context: cv.getContext('webgl', { antialias:true }) });
} else {
  renderer = new THREE.WebGLRenderer({ antialias:true });
}
// The models looked soft and washed out next to the same asset in Tripo's own viewer, and none of
// it was the mesh. Three things were missing here:
//   - no tone mapping, so the whole image sat flat with the highlights clipping
//   - no anisotropy on the model textures, so a 4K map blurred at every glancing angle, which is
//     most of a body; only the canvas textures for the stage were getting it
//   - nothing in the environment, so a roughness-0.9 material with two lights has nothing to pick
//     up. Tripo lights with an environment, which is where its surface detail comes from.
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090d14);
scene.fog = new THREE.Fog(0x0a0e15, 26, 120);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 300);

// The environment below supplies ambient of its own, so the hemisphere is only a top-up now.
// Left at its old strength the two stacked, and a black fleece jacket rendered almost white.
scene.add(new THREE.HemisphereLight(0x8ea8bd, 0x1c242e, 0.52));
const key = new THREE.DirectionalLight(0xfff2de, 1.7);
key.position.set(8, 14, 6); key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
const S = 16;
key.shadow.camera.left=-S; key.shadow.camera.right=S;
key.shadow.camera.top=S; key.shadow.camera.bottom=-S; key.shadow.camera.far=48;
key.shadow.bias=-0.0016;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6f9ac6, 1.5);
rim.position.set(-8,5,-7); scene.add(rim);
// A soft fill from the camera side so faces are not left to the ambient term alone.
// Key and fill both come from the camera side, so whatever faces us takes both. Keep the fill
// low or it doubles the key on exactly the surfaces the player is looking at.
// Bounce off the concrete, from below. Everything else comes from above, which leaves the eye
// sockets and the underside of the brow in shadow - this lifts them without touching the jacket
// much, since it strikes upward-facing surfaces at a glance.
const bounce = new THREE.DirectionalLight(0xc2cfdc, 0.5);
bounce.position.set(2, -3.5, 4); scene.add(bounce);
const fill = new THREE.DirectionalLight(0xbcd2e6, 0.22);
fill.position.set(6, 3, -2); scene.add(fill);

// THE SPOT OVER THE RING. The directionals above light the fighters but they light the whole
// rooftop equally, so nothing said where the fight was - the canvas read as floor rather than as
// the lit circle everyone is watching. This hangs one lamp over the middle and lets its falloff
// draw the edge of the arena for us.
//
// `decay` is left at 1 rather than the physical 2 on purpose: at 2 the intensity needed to reach
// the canvas from 18 units up blows the fighters' heads out long before the floor is lit, because
// they are a third of the way up the cone.
const SPOT_H = 18, SPOT_ANGLE = 0.20;      // tight enough to sit on the fight and nothing else
// 130 by eye against 0 / 70 / 130 / 220 rendered side by side: enough to draw the pool and let the
// canvas fall away into the dark at the rim, without flattening the night out of the rest of it.
// PENUMBRA 0.80, chosen in play rather than from a render. A soft edge read as mush when the cone
// was wide, because the falloff was spread across most of the canvas; narrowed to 0.20 the same
// softness lands in a much shorter distance, so it reads as a lamp with a soft edge rather than as
// no edge at all. Sharpness and width are not independent choices, which is why both are sliders.
const spot = new THREE.SpotLight(0xffeccd, 130, 46, SPOT_ANGLE, 0.80, 1);
// DEAD CENTRE. This used to sit 1.5 off in z, on the reasoning that it put the light on the side
// the camera was on - which is wrong, because the camera orbits on a right-drag, so there is no
// fixed camera side for it to be on. All it actually did was push the lamp off the middle of the
// arena while the pool it casts stayed centred on the target, which is what made the haze look
// one-sided: its near edge was shoved toward one side of frame and its far edge out of it.
spot.position.set(0, SPOT_H, 0);
spot.target.position.set(0, 0, 0); scene.add(spot.target);
spot.castShadow = true;
spot.shadow.mapSize.set(1024, 1024);
spot.shadow.camera.near = 2; spot.shadow.camera.far = SPOT_H + 14;
spot.shadow.bias = -0.0022;
scene.add(spot);

// The beam itself. A cone of haze, additive and never writing depth, brightest where we are looking
// along its surface rather than through it - which is what makes a shaft of light read as a volume
// instead of as a grey ice cream cone. It fades out before it reaches the canvas so the beam and
// the pool of light meet instead of the geometry ending in a visible rim.
const beamGeo = new THREE.ConeGeometry(SPOT_H * Math.tan(SPOT_ANGLE) * 1.02, SPOT_H, 48, 1, true);
const beam = new THREE.Mesh(beamGeo, new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  uniforms: { uColor: { value: new THREE.Color(0xffe3b4) }, uStrength: { value: 0.10 },
              uSoft: { value: 1.0 } },
  vertexShader: `
    varying vec3 vN; varying vec3 vV; varying float vH;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vN = normalize(normalMatrix * normal);
      vV = normalize(-mv.xyz);
      vH = clamp(position.y / ${SPOT_H.toFixed(1)} + 0.5, 0.0, 1.0);   // 0 at the floor, 1 at the lamp
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform vec3 uColor; uniform float uStrength; uniform float uSoft;
    varying vec3 vN; varying vec3 vV; varying float vH;
    void main() {
      // FACE-ON, NOT EDGE-ON. Weighting by grazing angle is what a thin shell does, and it draws
      // the cone as two bright outlines with nothing in between - which is why the edges looked
      // like drawn lines. Weighting by how square the shell is to the eye fills the shaft instead
      // and takes it to zero exactly at the silhouette, so the edge feathers out on its own.
      //
      // It is also the more honest of the two. What a real shaft shows is how much lit air the ray
      // crossed, and for a cylinder seen side-on that chord is exactly sqrt(1 - (x/r)^2) across the
      // width - which is precisely abs(dot(N, V)). A narrow cone is close enough to a cylinder that
      // the same term carries it. Drawn double-sided and added, the near and far walls together
      // stand in for the volume between them.
      float facing = abs(dot(normalize(vN), normalize(vV)));
      float a = pow(facing, uSoft) * uStrength;
      // THE ONLY VIEW THAT MATTERS IS THE LOW ONE. This used to fade out below 0.42 of the way up
      // and get denser toward the lamp, which is a perfectly good shaft of light from across the
      // roof and completely invisible from where the fight is actually watched: at eye level only
      // the bottom quarter of the cone is ever on screen, and that was the quarter being faded to
      // nothing. It now holds most of its density all the way down and only drops in the last
      // fraction, where the geometry meets the canvas and an abrupt end would show as a rim.
      a *= smoothstep(0.0, 0.09, vH);
      a *= mix(0.80, 1.0, vH);
      gl_FragColor = vec4(uColor, a);
    }`,
}));
beam.renderOrder = 2;
scene.add(beam);

// THE HAZE IS DERIVED FROM THE LIGHT, never placed alongside it. It used to be a vertical cone
// parked at the lamp's x/z while the spot itself was tilted - aimed from an off-centre lamp at a
// centred target - so the shaft leaned one way, the beam of light leaned the other, and the circle
// at the bottom of the haze missed the lit pool by the whole offset. Reading the real axis means
// the two cannot come apart again, wherever the lamp is put or the sliders are dragged to.
// THE SHAFT IS NARROWER THAN THE LIGHT IT SITS IN, on purpose. Matching the cone to the spot's own
// angle is the physically honest thing and it reads badly close up: at the distance the fight is
// actually watched from, a cone as wide as the pool puts haze across the whole frame and softens
// the fighters instead of framing them. Drawing a tighter core inside the same pool keeps the shaft
// legible without touching what the lamp does to the ground, which is a separate object entirely.
const BEAM = { narrow: 0.70 };
const beamFrom = new THREE.Vector3(), beamTo = new THREE.Vector3(), beamAxis = new THREE.Vector3();
const BEAM_UP = new THREE.Vector3(0, 1, 0);
let beamKey = '';
function syncBeam() {
  beamFrom.copy(spot.position);
  beamTo.copy(spot.target.position);
  const key = beamFrom.toArray().join() + '|' + beamTo.toArray().join() + '|' + spot.angle + '|' + BEAM.narrow;
  if (key === beamKey) return;
  beamKey = key;
  beamAxis.subVectors(beamFrom, beamTo);            // cone's local +Y is its apex, so point it up the beam
  const len = beamAxis.length() || 1;
  const k = Math.tan(spot.angle) / Math.tan(SPOT_ANGLE) * BEAM.narrow;
  beam.scale.set(k, len / SPOT_H, k);               // stretch to reach exactly from lamp to target
  beam.position.copy(beamFrom).add(beamTo).multiplyScalar(0.5);
  beam.quaternion.setFromUnitVectors(BEAM_UP, beamAxis.divideScalar(len));
}

// Image-based lighting, which is what the model is actually missing. PMREM wants half-float
// render targets, so it is WebGL 2 only; on WebGL 1 the lights above carry it alone.
if (renderer.capabilities.isWebGL2) {
  try {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const env = new THREE.Scene();
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(12, 7, 12),
      new THREE.MeshBasicMaterial({ color: 0x11161d, side: THREE.BackSide })
    );
    env.add(box);
    const glow = new THREE.Mesh(new THREE.PlaneGeometry(9, 5),
      new THREE.MeshBasicMaterial({ color: 0x59708c }));
    glow.position.set(0, 3.4, 0); glow.rotation.x = Math.PI/2; env.add(glow);
    const lamp = new THREE.Mesh(new THREE.PlaneGeometry(4, 3),
      new THREE.MeshBasicMaterial({ color: 0xa8845a }));
    lamp.position.set(5.5, 1.4, 1); lamp.rotation.y = -Math.PI/2; env.add(lamp);
    // 0.03, not 0.06: PMREM caps the blur at 20 samples, and 0.06 asks for 30, so
    // it clipped and warned every load. 0.03 measures within 0.75% of it on mean
    // frame brightness -- nothing to see on materials this rough.
    scene.environment = pmrem.fromScene(env, 0.03).texture;
    pmrem.dispose();
  } catch (e) { /* no environment; the lights still stand on their own */ }
}

// platform
const plat = new THREE.Mesh(
  new THREE.CylinderGeometry(ARENA, ARENA*1.04, 0.7, 72),
  new THREE.MeshStandardMaterial({ color:0x2b333d, roughness:0.95 })
);
plat.position.y = -0.35; plat.receiveShadow = true; scene.add(plat);
const lip = new THREE.Mesh(
  new THREE.TorusGeometry(ARENA, 0.09, 10, 80).rotateX(Math.PI/2),
  new THREE.MeshStandardMaterial({ color:0x3b4a57, roughness:0.7, metalness:0.3 })
);
scene.add(lip);

// ── the stage ─────────────────────────────────────────────────────────────────
// Everything here is drawn into canvases at load time. No external images: the page already pulls
// two multi-megabyte models, and a fighting stage is mostly grime, windows and silhouettes, which
// a few dozen lines of 2D drawing does as well as a download would. Every canvas is a power of two
// so the textures still mipmap on WebGL 1.
function canvasTex(w, h, draw, repX = 1, repY = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX, repY);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const rand = (a, b) => a + Math.random() * (b - a);

// Poured concrete: slab seams, aggregate speckle, and stains that pool toward the joints.
const concrete = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#242a31'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26000; i++) {
    const v = Math.random();
    g.fillStyle = v > 0.5 ? 'rgba(210,225,240,0.035)' : 'rgba(0,0,0,0.10)';
    g.fillRect(Math.random()*w, Math.random()*h, 1 + (v > 0.97 ? 1 : 0), 1);
  }
  for (let i = 0; i < 16; i++) {                      // damp patches
    const x = Math.random()*w, y = Math.random()*h, r = rand(26, 90);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(10,13,17,0.42)'); gr.addColorStop(1, 'rgba(10,13,17,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.lineWidth = 3; g.strokeStyle = 'rgba(8,10,13,0.85)';    // slab joints
  for (const p of [0, 256]) { g.beginPath(); g.moveTo(p, 0); g.lineTo(p, h); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
  g.lineWidth = 1; g.strokeStyle = 'rgba(0,0,0,0.35)';      // hairline cracks
  for (let i = 0; i < 7; i++) {
    let x = Math.random()*w, y = Math.random()*h;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 6; k++) { x += rand(-34, 34); y += rand(-34, 34); g.lineTo(x, y); }
    g.stroke();
  }
}, 5, 5);

const platMat  = new THREE.MeshStandardMaterial({ map: concrete, color: 0x9aa3ad, roughness: 0.99 });
const platSide = new THREE.MeshStandardMaterial({ color: 0x232a31, roughness: 0.9 });
plat.material = [platSide, platMat, platSide];             // cylinder groups: side, top, bottom

// A worn paint ring where the two of them square up, sized to the stances.
const paint = new THREE.Mesh(
  new THREE.RingGeometry(3.9, 4.25, 96),
  new THREE.MeshStandardMaterial({ color:0x9a7d2c, roughness:1, transparent:true, opacity:0.55 })
);
paint.rotation.x = -Math.PI/2; paint.position.y = 0.012; scene.add(paint);

// Crowd: silhouettes on the inside of a cylinder. A ring of heads and shoulders reads as a packed
// crowd from every angle at a fraction of the cost of even one low-poly spectator.
const crowdTex = canvasTex(1024, 256, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  for (let row = 0; row < 3; row++) {
    const base = h + 8, shade = 11 + row * 9;                 // back rows lighter = further away
    for (let x = -30; x < w + 30; x += 21) {
      const cx = x + rand(-7, 7), hd = rand(9, 13);
      const sy = base - rand(86, 128) + row * 22;            // ragged heights, back rows shorter
      g.fillStyle = `rgb(${shade},${shade+2},${shade+6})`;
      g.beginPath(); g.arc(cx, sy, hd, 0, 7); g.fill();                           // head
      g.fillRect(cx - hd*0.5, sy, hd, hd*1.1);                                    // neck
      g.beginPath();                                                              // shoulders + torso
      g.moveTo(cx - hd*2.3, base);
      g.quadraticCurveTo(cx - hd*2.0, sy + hd*1.5, cx, sy + hd*1.4);
      g.quadraticCurveTo(cx + hd*2.0, sy + hd*1.5, cx + hd*2.3, base);
      g.fill();
      if (Math.random() < 0.10) {                                                 // a raised phone
        g.fillStyle = 'rgba(150,200,245,0.8)';
        g.fillRect(cx + rand(-18, 18), sy - rand(26, 44), 4, 7);
      }
    }
  }
}, 14, 1);
const crowd = new THREE.Mesh(
  new THREE.CylinderGeometry(21, 21, 5.6, 72, 1, true),
  new THREE.MeshBasicMaterial({ map:crowdTex, transparent:true, alphaTest:0.45, side:THREE.BackSide, fog:true })
);
crowd.position.y = 1.9; scene.add(crowd);

// Asphalt apron. Without it the drums and poles outside the deck stand in the void.
const apron = new THREE.Mesh(
  new THREE.CircleGeometry(46, 56).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({ map: concrete.clone(), color:0x4a5158, roughness:1 })
);
apron.material.map.repeat.set(20, 20); apron.material.map.needsUpdate = true;
apron.position.y = -0.72; scene.add(apron);

// City behind it. Lit windows are the whole effect, so they go straight in the colour map on an
// unlit material — the skyline is meant to be a backdrop, not something the key light touches.
const windows = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = '#070a10'; g.fillRect(0, 0, w, h);
  for (let y = 12; y < h - 10; y += 26) for (let x = 12; x < w - 10; x += 22) {
    const r = Math.random();
    if (r < 0.52) continue;
    g.fillStyle = r > 0.93 ? '#e8c777' : r > 0.78 ? '#9dbcd8' : '#4e6a86';
    g.globalAlpha = rand(0.35, 1);
    g.fillRect(x, y, 11, 15);
  }
  g.globalAlpha = 1;
});
const skyline = new THREE.Group(); scene.add(skyline);
for (let i = 0; i < 64; i++) {
  const back = i % 2 === 1;                       // two rings, so no gap opens onto bare sky
  const a = (i / 64) * Math.PI * 2 + rand(-0.06, 0.06);
  const r = back ? rand(84, 112) : rand(52, 72);
  const hgt = back ? rand(22, 60) : rand(11, 34), wid = back ? rand(12, 22) : rand(8, 15);
  const tex = windows.clone(); tex.needsUpdate = true;
  tex.repeat.set(Math.max(1, Math.round(wid / 7)), Math.max(1, Math.round(hgt / 14)));
  tex.offset.set(Math.random(), Math.random());
  const b = new THREE.Mesh(new THREE.BoxGeometry(wid, hgt, wid),
    new THREE.MeshBasicMaterial({ map: tex }));
  b.position.set(Math.sin(a) * r, hgt/2 - 3, Math.cos(a) * r);
  b.rotation.y = a;
  skyline.add(b);
}

// Floodlights, drums and crates crowded up against the platform edge.
const glowTex = canvasTex(64, 64, (g, w) => {
  const gr = g.createRadialGradient(w/2, w/2, 0, w/2, w/2, w/2);
  gr.addColorStop(0, 'rgba(255,238,200,0.95)'); gr.addColorStop(0.4, 'rgba(255,205,120,0.35)');
  gr.addColorStop(1, 'rgba(255,190,90,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
});
const steel = new THREE.MeshStandardMaterial({ color:0x2e363e, roughness:0.72, metalness:0.45 });
const rust  = new THREE.MeshStandardMaterial({ color:0x6d4028, roughness:0.95 });
const wood  = new THREE.MeshStandardMaterial({ color:0x4e3c26, roughness:1 });
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2 + 0.03, r = 20;     // beyond the crowd, so never in the way
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 13, 8), steel);
  pole.position.set(Math.sin(a)*r, 5.8, Math.cos(a)*r); scene.add(pole);
  const head = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.1, 0.6), steel);
  head.position.set(Math.sin(a)*r, 12, Math.cos(a)*r); head.rotation.y = a; scene.add(head);
  const lamp = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
  lamp.scale.setScalar(5.5); lamp.position.copy(head.position); scene.add(lamp);
}
for (let i = 0; i < 26; i++) {
  const a = Math.random() * Math.PI * 2, r = rand(14.5, 19.5);
  const drum = Math.random() < 0.55;
  const m = drum
    ? new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 1.15, 12), Math.random() < 0.5 ? rust : steel)
    : new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.1), wood);
  m.position.set(Math.sin(a)*r, -0.72 + (drum ? 0.58 : 0.55), Math.cos(a)*r);
  m.rotation.y = Math.random() * Math.PI;
  if (!drum && Math.random() < 0.4) { m.position.y += 1.1; m.rotation.y += 0.3; }
  m.castShadow = m.receiveShadow = true; scene.add(m);
}


// ── the hoodies ───────────────────────────────────────────────────────────────
// Decimated from Tripo's 2M-face export to 160k faces each (58MB -> 6-7MB). The normal and
// roughness maps carry the fabric detail, so the loss does not show at this size.
const SCALE = 1.7, SPACING = 1.35, LIFT = 0.62;
if (Q.has('probe')) Object.assign(window, { THREE, scene, camera, renderer });
const plinthMat = new THREE.MeshStandardMaterial({ color:0x1b2128, roughness:0.55, metalness:0.35 });
const trimMat   = new THREE.MeshStandardMaterial({ color:0x9a7d2c, roughness:0.6, metalness:0.5 });
const spinners = [];
function plinth(x) {
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.7, 0.42, 48), plinthMat);
  base.position.set(x, 0.21, 0); base.castShadow = base.receiveShadow = true; scene.add(base);
  const trim = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.022, 8, 64).rotateX(Math.PI/2), trimMat);
  trim.position.set(x, 0.42, 0); scene.add(trim);
}
const loader = new GLTFLoader();
const load = f => new Promise((res, rej) => loader.load(f, res, undefined, rej));
Promise.all([load('../../models/hoodie1.glb'), load('../../models/hoodie2.glb')]).then(list => {
  list.forEach((g, i) => {
    const x = (i === 0 ? -1 : 1) * SPACING;
    plinth(x);
    const pivot = new THREE.Group(); pivot.position.set(x, LIFT, 0); scene.add(pivot);
    const m = g.scene;
    // centre the model on its own vertical axis so it spins in place rather than orbiting
    const box = new THREE.Box3().setFromObject(m), c = box.getCenter(new THREE.Vector3());
    m.position.set(-c.x, -box.min.y, -c.z);
    m.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true; o.receiveShadow = true;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      for (const mat of ms) {
        if (mat.map) mat.map.colorSpace = THREE.SRGBColorSpace;
        for (const slot of ['map','normalMap','roughnessMap','metalnessMap'])
          if (mat[slot]) { mat[slot].anisotropy = renderer.capabilities.getMaxAnisotropy(); mat[slot].needsUpdate = true; }
        mat.envMapIntensity = 0.35;
      }
    });
    pivot.add(m); pivot.scale.setScalar(SCALE);
    spinners.push(pivot);
  });
  document.getElementById('boot').classList.add('gone');
  setTimeout(() => document.getElementById('boot').remove(), 700);
  document.getElementById('tag1').classList.add('on'); document.getElementById('tag2').classList.add('on');
}).catch(e => { document.getElementById('boot').textContent = 'LOAD FAILED — ' + e.message; });

// ── spin ──────────────────────────────────────────────────────────────────────
// Moving the pointer throws the spin; letting go leaves them turning and slowing to a stop.
// Horizontal movement only, so reaching for the back link does not whip them around.
let spin = 0, yaw = 0, lastX = null;
const SPIN_GAIN = 0.0009, DRAG = 1.6;
function nudge(x) {
  if (lastX !== null) spin += (x - lastX) * SPIN_GAIN / Math.max(0.004, 1 / 60);
  lastX = x;
}
addEventListener('pointermove', e => nudge(e.clientX));
addEventListener('pointerleave', () => { lastX = null; });
addEventListener('pointerdown', e => { lastX = e.clientX; });
addEventListener('touchmove', e => { if (e.touches[0]) nudge(e.touches[0].clientX); }, { passive:true });
addEventListener('touchend', () => { lastX = null; });

// ── camera: frame both, and fit a phone held upright ───────────────────────────
const look = new THREE.Vector3(0, LIFT + SCALE * 0.5, 0);
function frame() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 62 : 44;
  camera.updateProjectionMatrix();
  const halfW = SPACING + 0.95, halfH = (SCALE + LIFT) * 0.62;
  const v = camera.fov * Math.PI / 360, h = Math.atan(Math.tan(v) * camera.aspect);
  const d = Math.max(halfW / Math.tan(h), halfH / Math.tan(v)) + 1.2;
  camera.position.set(0, look.y + 0.45, d);
  camera.lookAt(look);
}
frame();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); frame(); });

const tagPos = new THREE.Vector3();
function placeTag(el, pivot) {
  tagPos.set(pivot.position.x, 0.05, 0.75).project(camera);
  el.style.left = ((tagPos.x * 0.5 + 0.5) * innerWidth) + 'px';
  el.style.top  = ((-tagPos.y * 0.5 + 0.5) * innerHeight) + 'px';
  el.style.bottom = 'auto';
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  spin *= Math.exp(-DRAG * dt);
  yaw += spin * dt;
  for (const s of spinners) s.rotation.y = yaw;
  syncBeam();
  if (spinners.length === 2) { placeTag(document.getElementById('tag1'), spinners[0]); placeTag(document.getElementById('tag2'), spinners[1]); }
  renderer.render(scene, camera);
});
</script>
</body>
