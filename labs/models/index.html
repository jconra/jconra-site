<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Lab</title>
<script src="/src/oops.js"></script>
<style>
  @font-face { font-family: nasa; src: url("../../fonts/nasalization-rg.ttf"); font-display: swap; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#090d14; color:#ccd6de; font:13px/1.45 ui-sans-serif, system-ui, sans-serif; }
  canvas { display:block; touch-action:none; }
  #panel { position:fixed; top:12px; right:12px; bottom:12px; width:310px; overflow-y:auto; z-index:5;
           background:rgba(10,13,17,.9); border:1px solid #212a34; border-radius:6px; padding:12px 14px; }
  #panel.min { bottom:auto; }
  #panel.min .body { display:none; }
  h1 { font:400 17px/1 nasa, ui-sans-serif, sans-serif; letter-spacing:.05em; color:#e8f1f5; display:flex; justify-content:space-between; align-items:center; }
  h1 button { font:600 11px ui-monospace,monospace; background:none; border:1px solid #212a34; color:#8494a0; border-radius:3px; padding:3px 7px; cursor:pointer; }
  details.sec { margin:10px 0 0; border-top:1px solid #1a2129; padding-top:6px; }
  details.sec summary, details.grp summary { font:600 10.5px/1 ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; color:#8494a0; cursor:pointer; list-style:none; padding:6px 0; user-select:none; }
  details.sec summary::before, details.grp summary::before { content:"▸ "; color:#35e07d; }
  details.sec[open] > summary::before, details.grp[open] > summary::before { content:"▾ "; }
  details.sec[open] > summary { color:#e8f1f5; }
  details.grp { margin-left:4px; }
  details.grp summary { letter-spacing:.08em; color:#aeb9c2; padding:5px 0; }
  details.grp summary i { font-style:normal; color:#59656f; }
  .list { display:flex; flex-direction:column; gap:2px; margin:2px 0 6px 14px; }
  .list button { text-align:left; background:none; border:1px solid transparent; border-radius:3px; color:#aeb9c2; padding:3px 7px; cursor:pointer;
                 font:12px ui-sans-serif, system-ui, sans-serif; display:flex; justify-content:space-between; gap:8px; }
  .list button:hover { border-color:#212a34; color:#e8f1f5; }
  .list button.on { background:rgba(53,224,125,.14); border-color:#2f7d55; color:#e8f1f5; }
  .list button small { color:#59656f; font:11px ui-monospace,monospace; white-space:nowrap; }
  .row { display:grid; grid-template-columns:1fr auto; gap:2px 8px; align-items:center; margin:6px 0; }
  .row label { color:#aeb9c2; }
  .row output { font:12px ui-monospace,monospace; color:#e8f1f5; font-variant-numeric:tabular-nums; }
  .row input[type=range] { grid-column:1 / -1; width:100%; accent-color:#35e07d; }
  .check { display:flex; gap:8px; align-items:center; margin:6px 0; color:#aeb9c2; cursor:pointer; }
  .check input { accent-color:#35e07d; }
  .readout { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font:12px ui-monospace,monospace; margin:6px 0; }
  .readout span { color:#7f8d99; }
  .readout b { color:#e8f1f5; font-weight:600; font-variant-numeric:tabular-nums; }
  .note { color:#6d7a85; font-size:11.5px; margin:8px 0 4px; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .btns button { font:600 11px ui-monospace,monospace; letter-spacing:.05em; text-transform:uppercase; background:rgba(53,224,125,.12);
                 color:#35e07d; border:1px solid #2f7d55; border-radius:4px; padding:6px 8px; cursor:pointer; }
  .btns button.on { background:rgba(53,224,125,.35); color:#e8f1f5; }
  #clips button { text-transform:none; letter-spacing:0; }
  #title { position:fixed; top:36px; left:16px; z-index:6; pointer-events:none; text-shadow:0 1px 4px #000; }
  #title b { display:block; font:400 20px nasa, ui-sans-serif, sans-serif; letter-spacing:.05em; color:#e8f1f5; }
  #title span { font:11.5px/1.5 ui-monospace,monospace; color:#9fb3c2; }
  #back { position:fixed; top:14px; left:16px; z-index:6; font:11px ui-monospace,monospace; letter-spacing:.14em; color:#8494a0; text-decoration:none; text-transform:uppercase; }
  #loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:6; font:12px nasa, monospace; letter-spacing:3px; color:#b9c8d2; pointer-events:none; }
  @media (max-width:700px) { #panel, #panel.min { width:auto; left:12px; top:auto; bottom:12px; max-height:46vh; } #title b { font-size:16px; } }
</style>
</head>
<body>
<a id="back" href="../">&larr; labs</a>
<div id="title"><b></b><span></span></div>
<div id="loading"></div>
<div id="panel">
  <h1>Model Lab <button id="min" type="button">hide</button></h1>
  <div class="body">
    <details class="sec" open><summary>Models</summary><div id="catalogue"></div></details>

    <details class="sec" open><summary>Animation</summary>
      <div id="clipNote" class="note">This model has no animations.</div>
      <div class="btns" id="clips"></div>
      <div class="btns"><button id="play" type="button">Pause</button><button id="rest" type="button">Rest pose</button></div>
      <div class="row"><label for="speed">Speed</label><output id="speedOut">1.00×</output><input id="speed" type="range" min="0" max="2" step="0.05" value="1"></div>
      <div class="row"><label for="time">Time</label><output id="timeOut">0.00 s</output><input id="time" type="range" min="0" max="1" step="0.001" value="0"></div>
    </details>

    <details class="sec"><summary>Parts</summary>
      <p class="note">Click a part to show it alone with its size; click it again to show everything.</p>
      <div class="list" id="parts" style="margin-left:0"></div>
    </details>

    <details class="sec"><summary>View</summary>
      <label class="check" for="spin"><input id="spin" type="checkbox"> Turntable</label>
      <label class="check" for="floor"><input id="floor" type="checkbox" checked> Floor and shadow</label>
      <label class="check" for="wire"><input id="wire" type="checkbox"> Wireframe</label>
      <label class="check" for="bones"><input id="bones" type="checkbox"> Skeleton</label>
      <div class="row"><label for="exposure">Exposure</label><output id="exposureOut">1.12</output><input id="exposure" type="range" min="0.3" max="2.5" step="0.01" value="1.12"></div>
      <div class="row"><label for="env">Environment light</label><output id="envOut">0.35</output><input id="env" type="range" min="0" max="1.5" step="0.01" value="0.35"></div>
      <div class="row"><label for="keyL">Key light</label><output id="keyLOut">1.70</output><input id="keyL" type="range" min="0" max="5" step="0.05" value="1.7"></div>
      <div class="row"><label for="keyDir">Key light direction</label><output id="keyDirOut">37°</output><input id="keyDir" type="range" min="-180" max="180" step="1" value="37"></div>
      <div class="row"><label for="rimL">Rim light (behind)</label><output id="rimLOut">1.50</output><input id="rimL" type="range" min="0" max="5" step="0.05" value="1.5"></div>
      <div class="row"><label for="ambient">Ambient</label><output id="ambientOut">0.52</output><input id="ambient" type="range" min="0" max="3" step="0.01" value="0.52"></div>
      <div class="row"><label for="bounce">Bounce light (from below)</label><output id="bounceOut">0.50</output><input id="bounce" type="range" min="0" max="3" step="0.05" value="0.5"></div>
      <div class="btns"><button id="frame" type="button">Frame the model</button></div>
    </details>
  </div>
</div>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
</script>
<script type="module" src="./models.js"></script>
</body>
</html>
