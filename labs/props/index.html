<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prop Viewer</title>
<style>
  @font-face { font-family: nasa; src: url("../../fonts/nasalization-rg.ttf"); font-display: swap; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#000; color:#ccd6de; font:13px/1.45 ui-sans-serif, system-ui, sans-serif; }
  canvas { display:block; touch-action:none; }
  #panel { position:fixed; top:12px; right:12px; bottom:12px; width:290px; overflow-y:auto; z-index:5;
           background:rgba(10,13,17,.9); border:1px solid #212a34; border-radius:6px; padding:12px 14px; }
  #panel.min { bottom:auto; }
  #panel.min .body { display:none; }
  h1 { font:400 17px/1 nasa, ui-sans-serif, sans-serif; letter-spacing:.05em; color:#e8f1f5; display:flex; justify-content:space-between; align-items:center; }
  h1 button { font:600 11px ui-monospace,monospace; background:none; border:1px solid #212a34; color:#8494a0; border-radius:3px; padding:3px 7px; cursor:pointer; }
  h2 { font:600 10.5px/1 ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; color:#5b6873; margin:16px 0 8px; }
  .note { color:#6d7a85; font-size:11.5px; margin:8px 0 4px; }
  .row { display:grid; grid-template-columns:1fr auto; gap:2px 8px; align-items:center; margin:6px 0; }
  .row label { color:#aeb9c2; }
  .row output { font:12px ui-monospace,monospace; color:#e8f1f5; font-variant-numeric:tabular-nums; }
  .row input[type=range] { grid-column:1 / -1; width:100%; accent-color:#35e07d; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  .btns button { font:600 11px ui-monospace,monospace; letter-spacing:.05em; text-transform:uppercase; background:rgba(53,224,125,.12);
                 color:#35e07d; border:1px solid #2f7d55; border-radius:4px; padding:6px 8px; cursor:pointer; }
  .btns button.on { background:rgba(53,224,125,.3); }
  #list { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
  #list button { font:11px ui-monospace,monospace; background:#05070a; color:#aeb9c2; border:1px solid #212a34; border-radius:3px; padding:5px 2px; cursor:pointer; }
  #list button.on { color:#35e07d; border-color:#2f7d55; background:rgba(53,224,125,.12); }
  .readout { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font:12px ui-monospace,monospace; margin:6px 0; }
  .readout b { color:#e8f1f5; font-weight:600; }
  #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font:13px nasa, monospace; letter-spacing:4px; color:#b9c8d2; background:#000; z-index:9; }
  #hud { position:fixed; top:36px; left:16px; z-index:6; pointer-events:none; font:11.5px/1.5 ui-monospace,monospace; color:#9fb3c2; text-shadow:0 1px 4px #000; }
  #hud b { color:#35e07d; font-weight:600; }
  #caption { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:6; pointer-events:none; font:400 15px nasa, ui-sans-serif, sans-serif; letter-spacing:.08em; color:#e8f1f5; text-shadow:0 2px 12px #000; }
  #back { position:fixed; top:14px; left:16px; z-index:6; font:11px ui-monospace,monospace; letter-spacing:.14em; color:#8494a0; text-decoration:none; text-transform:uppercase; }
  .arrow { position:fixed; top:50%; transform:translateY(-50%); z-index:6; width:44px; height:44px; border-radius:22px; background:rgba(10,13,17,.7); border:1px solid #212a34; color:#e8f1f5; font:20px ui-sans-serif; cursor:pointer; }
  #prev { left:16px; } #next { right:320px; }
  @media (max-width:700px) { #panel, #panel.min { width:auto; left:12px; top:auto; bottom:12px; max-height:46vh; } #next { right:16px; } .arrow { top:38%; } }
</style>
</head>
<body>
<div id="boot">LOADING PROPS… <span id="pct"></span></div>
<a id="back" href="../">&larr; labs</a>
<div id="hud"></div>
<button id="prev" class="arrow" type="button">&lsaquo;</button><button id="next" class="arrow" type="button">&rsaquo;</button>
<div id="caption"></div>
<div id="panel">
  <h1>Prop Viewer <button id="min" type="button">hide</button></h1>
  <div class="body">
    <p class="note">Every loose piece of the old quarters, one at a time on a turntable. Arrows or the list to change prop; drag to orbit, wheel to zoom. "Everything" shows the room as it was.</p>
    <div class="row" style="grid-template-columns:1fr"><span id="fps"></span></div>

    <h2>Prop</h2>
    <div id="list"></div>
    <div class="readout"><b id="pname"></b><span></span><b id="psize"></b><span>wide × tall × deep</span><b id="ptris"></b><span>triangles</span><b id="pwhere"></b><span>where it stood</span></div>

    <h2>View</h2>
    <div class="btns" id="views"></div>
    <label class="row" for="spin"><span>Turntable</span><input id="spin" type="checkbox" checked></label>
    <div class="row"><label for="light">Light</label><select id="light"><option value="flat" selected>Flat</option><option value="studio">Studio</option><option value="cabin">Cabin</option></select></div>
    <div class="row"><label for="exposure">Exposure</label><output id="exposureOut"></output><input id="exposure" type="range" min="0.3" max="2.5" step="0.01" value="1.0"></div>
    <label class="row" for="wire"><span>Wireframe</span><input id="wire" type="checkbox"></label>
    <label class="row" for="tex"><span>Texture</span><input id="tex" type="checkbox" checked></label>
  </div>
</div>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
} }
</script>
<script type="module" src="./props.js"></script>
</body>
</html>
